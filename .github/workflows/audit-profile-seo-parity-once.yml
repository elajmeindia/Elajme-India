name: Audit bilingual profile SEO and internal links once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-profile-seo-parity-once.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit doctor and hospital profile SEO, parity and routing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          problems=[]; checked=0; redirects=[]
          active=[]
          for kind in ('doctors','hospitals'):
              for p in sorted(Path(kind).glob('*/index.html')):
                  slug=p.parent.name
                  t=p.read_text(encoding='utf-8')
                  ar=Path('ar')/kind/slug/'index.html'
                  if 'http-equiv="refresh"' in t.lower() or 'noindex,follow' in t.lower():
                      redirects.append(f'{kind}/{slug}')
                      if not ar.exists(): problems.append(f'{kind}/{slug}: redirect alias missing Arabic counterpart')
                      else:
                          at=ar.read_text(encoding='utf-8')
                          if 'http-equiv="refresh"' not in at.lower() and 'noindex,follow' not in at.lower(): problems.append(f'{kind}/{slug}: Arabic alias is not a redirect/noindex')
                          if 'footer-approved.css' not in t or 'footer-approved.css' not in at: problems.append(f'{kind}/{slug}: redirect alias approved footer missing')
                      continue
                  active.append((kind,slug,p,ar))
                  if not ar.exists(): problems.append(f'{kind}/{slug}: missing Arabic profile'); continue
                  for path,lang in ((p,'en'),(ar,'ar')):
                      txt=path.read_text(encoding='utf-8'); checked+=1
                      prefix='https://elajmeindia.com/' + ('ar/' if lang=='ar' else '') + kind + '/' + slug + '/'
                      if f'<link rel="canonical" href="{prefix}"' not in txt: problems.append(f'{path}: canonical missing/wrong')
                      for h in ('en','ar','x-default'):
                          if f'hreflang="{h}"' not in txt: problems.append(f'{path}: hreflang {h} missing')
                      if not re.search(r'<title>[^<]{8,}</title>',txt,re.I): problems.append(f'{path}: title missing/weak')
                      if not re.search(r'<meta\s+name="description"\s+content="[^"]{40,}"',txt,re.I): problems.append(f'{path}: meta description missing/weak')
                      if len(re.findall(r'<h1\b',txt,re.I)) != 1: problems.append(f'{path}: expected exactly one H1')
                      if 'footer-approved.css' not in txt: problems.append(f'{path}: approved footer CSS missing')
                      expected='/ar/#enquiry' if lang=='ar' else '/#enquiry'
                      if expected not in txt: problems.append(f'{path}: Elajme enquiry route missing')
                      directory=('/ar/' if lang=='ar' else '/')+kind+'/'
                      if directory not in txt: problems.append(f'{path}: directory backlink missing')
                      expected_lang=('/'+kind+'/'+slug+'/') if lang=='ar' else ('/ar/'+kind+'/'+slug+'/')
                      lang_links=re.findall(r'<a\b[^>]*class="[^"]*\bmaster-lang\b[^"]*"[^>]*href="([^"]+)"',txt,re.I)
                      if len(lang_links) != 1:
                          problems.append(f'{path}: expected exactly one master language switch, found {len(lang_links)}')
                      elif lang_links[0] != expected_lang:
                          problems.append(f'{path}: language switch wrong ({lang_links[0]} != {expected_lang})')
                      if lang=='ar' and ('lang="ar"' not in txt or 'dir="rtl"' not in txt): problems.append(f'{path}: Arabic lang/RTL missing')
                      if lang=='en' and 'lang="en"' not in txt: problems.append(f'{path}: English lang missing')
          sitemap=Path('sitemap.xml').read_text(encoding='utf-8') if Path('sitemap.xml').exists() else ''
          for kind,slug,p,ar in active:
              for url in (f'https://elajmeindia.com/{kind}/{slug}/',f'https://elajmeindia.com/ar/{kind}/{slug}/'):
                  if url not in sitemap: problems.append(f'sitemap missing {url}')
          for url in ('https://elajmeindia.com/hospitals/wockhardt-hospital-mumbai-central/','https://elajmeindia.com/ar/hospitals/wockhardt-hospital-mumbai-central/'):
              if url not in sitemap: problems.append(f'sitemap missing {url}')
          print(f'ACTIVE PROFILE SEO/PARITY PAGES CHECKED: {checked}')
          print(f'REDIRECT ALIASES EXCLUDED FROM ACTIVE PROFILE RULES: {len(redirects)}')
          if redirects: print('Redirect aliases: '+', '.join(redirects))
          if problems:
              print('PROFILE SEO/PARITY ISSUES:'); print('\n'.join(problems)); sys.exit(1)
          print('BILINGUAL PROFILE SEO/PARITY AUDIT CLEAN')
          # audit trigger: exact profile language switches added 2026-11-03
          PY
