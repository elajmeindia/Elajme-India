name: Bilingual enquiry handoff smoke
on:
  pull_request:
    paths:
      - '.github/workflows/live-bilingual-enquiry-handoff.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-bilingual-enquiry-handoff.yml'
      - 'index.html'
      - 'ar/index.html'
      - 'script.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  enquiry:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify enquiry WhatsApp handoff without sending
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/elajme-enquiry-http.log 2>&1 &
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const errors=[];
            for(const language of ['en','ar']){
              const page=await browser.newPage({viewport:{width:390,height:844}});
              const path=language==='ar'?'/ar/':'/';
              const origin='http://127.0.0.1:8765';
              const url=origin+path+'#enquiry';
              const captured=[];
              await page.context().route('**/*',route=>{
                const url=new URL(route.request().url());
                if(url.hostname==='wa.me')captured.push(url.href);
                return url.origin===origin ? route.continue() : route.abort();
              });
              await page.addInitScript(()=>Object.defineProperty(navigator,'clipboard',{value:{writeText:()=>Promise.reject(new Error('unavailable'))}}));
              try{
                const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
                await page.locator('#patientEnquiryForm').waitFor({timeout:15000});
                await page.locator('#patientName').fill('Test Patient');
                await page.locator('#patientCountry').fill('Oman');
                await page.locator('#patientMobile').fill('+968 91234567');
                const select=page.locator('#preferredLanguage');
                if(await select.count())await select.selectOption({label:language==='ar'?'Arabic':'English'}).catch(async()=>await select.selectOption(language==='ar'?'Arabic':'English'));
                await page.locator('#patientEnquiryForm').evaluate(form=>form.requestSubmit());
                const review=page.locator('dialog[data-enquiry-review]');
                await review.waitFor({state:'visible'});
                const summary=await review.locator('textarea').inputValue();
                await review.getByRole('button').first().click();
                const request=page.context().waitForEvent('request',{predicate:req=>new URL(req.url()).hostname==='wa.me'});
                await review.locator('a').click();
                await request;
                for(let i=0;i<25&&!captured.length;i++)await new Promise(resolve=>setTimeout(resolve,20));
                if(response.status()!==200||captured.length!==1||new URL(captured[0]).pathname!=='/917488955154'
                   ||/Test Patient|Oman|91234567/.test(decodeURIComponent(captured[0]))||!summary.includes('Test Patient')
                   || !summary.includes('Oman') || !summary.includes('91234567')) errors.push(language+': private enquiry handoff failed');
              }catch(e){errors.push(language+': '+e.message);}
              await page.close();
            }
            await browser.close();
            if(errors.length){console.error(errors.join('\n'));process.exitCode=1;}
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
