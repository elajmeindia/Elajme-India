name: Correct duplicate specialties and expand to 39 once
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/correct-duplicates-expand-treatment-specialties-36-39-once.yml'
permissions:
  contents: write
jobs:
  correct-expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct duplicate 36-37 and add 38-39
        shell: python
        run: |
          from pathlib import Path
          import re, shutil
          en_base=Path('treatments/pediatrics-child-health-india/index.html').read_text(encoding='utf-8')
          ar_base=Path('ar/treatments/pediatrics-child-health-india/index.html').read_text(encoding='utf-8')
          specs=[
            (36,'breast-surgery-care-india','Breast Surgery & Breast Care','Breast care coordination','Breast surgery and breast care in India for international patients','breast conditions and breast surgery','جراحة الثدي ورعاية الثدي','جراحة الثدي ورعاية الثدي في الهند للمرضى الدوليين','جراحة الثدي ورعاية الثدي'),
            (37,'hand-microsurgery-india','Hand & Microsurgery','Hand and microsurgery coordination','Hand and microsurgery in India for international patients','hand, peripheral nerve and microsurgical conditions','جراحة اليد والجراحة المجهرية','جراحة اليد والجراحة المجهرية في الهند للمرضى الدوليين','جراحة اليد والجراحة المجهرية'),
            (38,'sleep-medicine-india','Sleep Medicine','Sleep medicine coordination','Sleep medicine in India for international patients','sleep-related conditions','طب النوم','طب النوم في الهند للمرضى الدوليين','طب النوم'),
            (39,'clinical-genetics-genomic-medicine-india','Clinical Genetics & Genomic Medicine','Clinical genetics coordination','Clinical genetics and genomic medicine in India for international patients','genetic and genomic medicine conditions','الوراثة السريرية والطب الجينومي','الوراثة السريرية والطب الجينومي في الهند للمرضى الدوليين','الوراثة السريرية والطب الجينومي')]
          # Remove the duplicate rehabilitation page introduced as #36. #29 infectious route remains canonical and is restored below.
          for p in [Path('treatments/rehabilitation-physical-medicine-india'),Path('ar/treatments/rehabilitation-physical-medicine-india')]:
            if p.exists(): shutil.rmtree(p)
          def make_en(slug,title,ey,h1,condition):
            return en_base.replace('Pediatrics & Child Health in India | Elajme India',f'{title} in India | Elajme India').replace('pediatrics-child-health-india',slug).replace('Pediatric care coordination',ey).replace('Pediatrics and child health in India for international patients',h1).replace('pediatric and child-health enquiries',f'{title.lower()} enquiries').replace('individual pediatric assessment','individual specialist assessment').replace('Pediatric assessment','Specialist assessment').replace('The pediatric team reviews the child’s symptoms, diagnosis, growth and development, previous treatment and relevant medical history.',f'The specialist team reviews symptoms, diagnosis, previous treatment, relevant investigations and medical history for {condition}.').replace('Specialist pediatric care','Condition-specific care').replace('Depending on the condition, the child may be reviewed by general pediatrics or an appropriate pediatric subspecialty team.','Depending on the condition, additional investigations or multidisciplinary specialist review may be recommended by the treating team.').replace('Family-centred follow-up','Treatment and follow-up').replace('The treating team explains investigations, treatment and follow-up requirements to the child’s parent or legal guardian.','The treating team determines appropriate investigations, treatment options and follow-up according to the individual clinical assessment.').replace('the child’s diagnosis, age, growth information, recent pediatric notes, blood tests, imaging, discharge summaries, vaccination history when relevant, previous treatment and current medicines','the diagnosis, recent specialist notes, blood tests, imaging or other relevant investigations, previous treatment and current medicines').replace('Start a pediatric care enquiry',f'Start a {title.lower()} enquiry')
          def make_ar(slug,title,h1,condition):
            return ar_base.replace('طب الأطفال وصحة الطفل في الهند | علاج مي إنديا',f'{title} في الهند | علاج مي إنديا').replace('pediatrics-child-health-india',slug).replace('طب الأطفال وصحة الطفل في الهند للمرضى الدوليين',h1).replace('استفسارات طب الأطفال وصحة الطفل',f'استفسارات {condition}').replace('تقييماً فردياً من طبيب الأطفال','تقييماً طبياً فردياً من الطبيب المختص').replace('تقييم طب الأطفال','التقييم التخصصي').replace('يراجع فريق طب الأطفال أعراض الطفل وتشخيصه ونموه وتطوره والعلاج السابق والتاريخ الطبي ذي الصلة.',f'يراجع الفريق المختص الأعراض والتشخيص والعلاجات السابقة والفحوصات والتاريخ الطبي المرتبط بـ{condition}.').replace('الرعاية التخصصية للأطفال','الرعاية حسب الحالة').replace('قد يحتاج الطفل، حسب الحالة، إلى مراجعة طب الأطفال العام أو أحد تخصصات طب الأطفال الفرعية المناسبة.','قد تتطلب الحالة فحوصات إضافية أو مراجعة متعددة التخصصات وفق تقييم الفريق المعالج.').replace('المتابعة مع الأسرة','العلاج والمتابعة').replace('يشرح الفريق المعالج الفحوصات والعلاج والمتابعة المطلوبة لوالد الطفل أو الوصي القانوني.','يحدد الفريق المعالج الفحوصات وخيارات العلاج والمتابعة المناسبة وفق التقييم السريري الفردي.').replace('تشخيص الطفل وعمره ومعلومات النمو وتقارير طب الأطفال الحديثة وتحاليل الدم والصور الطبية وملخصات الخروج وسجل التطعيم عند الحاجة والعلاجات السابقة والأدوية الحالية','التشخيص والتقارير التخصصية الحديثة وتحاليل الدم والصور أو الفحوصات ذات الصلة والعلاجات السابقة والأدوية الحالية').replace('ابدأ استفسار رعاية الأطفال',f'ابدأ استفسار {condition}')
          for _,slug,title,ey,h1,condition,artitle,arh1,arcondition in specs:
            Path('treatments',slug).mkdir(parents=True,exist_ok=True); Path('treatments',slug,'index.html').write_text(make_en(slug,title,ey,h1,condition),encoding='utf-8')
            Path('ar/treatments',slug).mkdir(parents=True,exist_ok=True); Path('ar/treatments',slug,'index.html').write_text(make_ar(slug,artitle,arh1,arcondition),encoding='utf-8')
          # Restore canonical infectious-diseases page as specialty 29 from template, without creating another duplicate specialty.
          slug='infectious-diseases-treatment-india'; title='Infectious Diseases'; artitle='الأمراض المعدية'
          Path('treatments',slug,'index.html').write_text(make_en(slug,title,'Infectious disease care coordination','Infectious diseases in India for international patients','infectious diseases'),encoding='utf-8')
          Path('ar/treatments',slug,'index.html').write_text(make_ar(slug,artitle,'علاج الأمراض المعدية في الهند للمرضى الدوليين','الأمراض المعدية'),encoding='utf-8')
          # Rebuild structured positions 36-39 and visible EN cards.
          enp=Path('treatments/index.html'); s=enp.read_text(encoding='utf-8').replace('37 Specialties','39 Specialties').replace('37 medical treatment areas','39 medical treatment areas')
          s=re.sub(r',\{"@type":"ListItem","position":36,[^}]+\},\{"@type":"ListItem","position":37,[^}]+\}', '', s)
          anchor=re.search(r'\{"@type":"ListItem","position":35,[^}]+\}',s)
          if not anchor: raise SystemExit('position 35 not found')
          extra=''.join([f',{{"@type":"ListItem","position":{n},"name":"{title}","url":"https://elajmeindia.com/treatments/{slug}/"}}' for n,slug,title,*_ in specs])
          s=s[:anchor.end()]+extra+s[anchor.end():]
          s=re.sub(r'<article class="card"><h3><a href="rehabilitation-physical-medicine-india/">.*?</article>','',s,flags=re.S)
          # remove duplicate infectious card added at tail while retaining the original specialty 29 card
          matches=list(re.finditer(r'<article class="card"><h3><a href="infectious-diseases-treatment-india/">.*?</article>',s,flags=re.S))
          for m in reversed(matches[1:]): s=s[:m.start()]+s[m.end():]
          marker='</div></div></section><section class="sec alt">'
          cards=''.join([f'<article class="card"><h3><a href="{slug}/">{title}</a></h3><p>{title} specialist review and international-patient enquiry coordination.</p></article>' for _,slug,title,*_ in specs])
          s=s.replace(marker,cards+marker,1); enp.write_text(s,encoding='utf-8')
          arp=Path('ar/treatments/index.html'); a=arp.read_text(encoding='utf-8')
          a=re.sub(r'<article class="card"><h3>إعادة التأهيل والطب الطبيعي</h3>.*?</article>','',a,flags=re.S)
          # remove extra tropical infectious card if present
          a=re.sub(r'<article class="card"><h3>الأمراض المعدية وطب المناطق الحارة</h3>.*?</article>','',a,flags=re.S)
          amarker='</div><div class="note">'; acards=''.join([f'<article class="card"><h3>{artitle}</h3><p>تنسيق المراجعة التخصصية والاستفسارات للمرضى الدوليين.</p><a href="{slug}/">عرض التفاصيل</a></article>' for _,slug,_,_,_,_,artitle,_,_ in specs]); a=a.replace(amarker,acards+amarker,1); arp.write_text(a,encoding='utf-8')
          sm=Path('sitemap.xml'); x=sm.read_text(encoding='utf-8')
          x=re.sub(r'\s*<url><loc>https://elajmeindia.com/(?:ar/)?treatments/rehabilitation-physical-medicine-india/</loc></url>','',x)
          add=''
          for _,slug,*_ in specs:
            for prefix in ('/treatments/','/ar/treatments/'):
              u='https://elajmeindia.com'+prefix+slug+'/'
              if u not in x: add+=f'  <url><loc>{u}</loc></url>\n'
          sm.write_text(x.replace('</urlset>',add+'</urlset>'),encoding='utf-8')
      - name: Verify corrected 36-39
        run: |
          for p in breast-surgery-care-india hand-microsurgery-india sleep-medicine-india clinical-genetics-genomic-medicine-india; do
            test -f "treatments/$p/index.html" && test -f "ar/treatments/$p/index.html"
            grep -q "$p/" treatments/index.html && grep -q "$p/" ar/treatments/index.html
            grep -q "https://elajmeindia.com/treatments/$p/" sitemap.xml
            grep -q "https://elajmeindia.com/ar/treatments/$p/" sitemap.xml
            ! grep -Eiq 'pediatric|child|parent|guardian' "treatments/$p/index.html"
          done
          test ! -e treatments/rehabilitation-physical-medicine-india/index.html
          test "$(grep -o 'infectious-diseases-treatment-india/' treatments/index.html | wc -l)" -ge 2
          grep -q '39 Specialties' treatments/index.html
          grep -q '"position":39' treatments/index.html
          ! grep -q '"position":36,"name":"Rehabilitation' treatments/index.html
          ! grep -q '"position":37,"name":"Infectious Diseases & Tropical Medicine' treatments/index.html
          git diff --exit-code assets/css/master-header.css assets/css/arabic-master-header.css assets/css/mobile-header.css assets/css/arabic-mobile-header.css assets/js/mobile-header.js assets/css/footer-approved.css FOOTER-LOCK.md
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A treatments ar/treatments sitemap.xml
          git diff --cached --quiet && exit 0
          git commit -m 'Correct duplicate specialties and expand bilingual directory to 39'
          git push
