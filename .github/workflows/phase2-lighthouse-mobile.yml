name: Same-origin mobile homepage LCP experiment
on:
  push:
    branches: [experiment/english-homepage-lcp]
permissions:
  contents: read
jobs:
  paired:
    strategy:
      fail-fast: false
      matrix:
        variant: [declarative-enhancement, early-css]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save lighthouse@12.8.2 playwright@1.56.1 puppeteer-core@24.32.0
      - run: npx playwright install --with-deps chromium
      - name: Compare live-origin Lighthouse samples with a browser-only HTML override
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          cat > lcp-same-origin.mjs <<'JS'
          import lighthouse from 'lighthouse';
          import puppeteer from 'puppeteer-core';
          import { chromium } from 'playwright';
          import { brotliCompressSync } from 'node:zlib';
          import { writeFileSync } from 'node:fs';

          const site = 'https://elajmeindia.com/';
          const variant = process.env.VARIANT;
          const enhancementUrl = '/assets/css/homepage-enhancements.css';
          const earlyLinks = [
            enhancementUrl,
            '/assets/css/mobile-header.css?v=3',
            '/assets/css/mobile-header-v2.css?v=16',
            '/assets/css/master-header.css?v=8'
          ].map(href => `<link rel="preload" as="style" href="${href}">`).join('\n');
          const modify = markup => variant === 'declarative-enhancement'
            ? markup.replace('</head>', `<link rel="stylesheet" href="${enhancementUrl}" data-homepage-enhancements>\n</head>`)
            : markup.replace('<link rel="stylesheet" href="styles.css"', earlyLinks+'\n<link rel="stylesheet" href="styles.css"');
          const flags = {onlyCategories:['performance'],formFactor:'mobile',screenEmulation:{mobile:true,width:390,height:844,deviceScaleFactor:1,disabled:false},throttlingMethod:'simulate',blockedUrlPatterns:['*google-analytics.com*'],logLevel:'error'};

          async function measure(mode, i){
            const browser = await puppeteer.launch({
              executablePath: chromium.executablePath(), headless:true,
              defaultViewport:null, ignoreDefaultArgs:['--enable-automation'],
              args:['--no-sandbox','--disable-dev-shm-usage']
            });
            try {
              const page = await browser.newPage();
              const client = await page.createCDPSession();
              let rewritten = 0, rewriteError;
              await client.send('Fetch.enable',{patterns:[{urlPattern:site,resourceType:'Document',requestStage:'Response'}]});
              client.on('Fetch.requestPaused', async ev => {
                try {
                  if(ev.responseStatusCode!==200) return await client.send('Fetch.continueRequest',{requestId:ev.requestId});
                  const payload = await client.send('Fetch.getResponseBody',{requestId:ev.requestId});
                  const original = payload.base64Encoded ? Buffer.from(payload.body,'base64').toString('utf8') : payload.body;
                  const html = mode==='candidate' ? modify(original) : original;
                  if(mode==='candidate' && html===original) throw Error('HTML override did not match');
                  const body = brotliCompressSync(html);
                  const headers = (ev.responseHeaders||[]).filter(x=>!/^(content-encoding|content-length|transfer-encoding|etag)$/i.test(x.name));
                  headers.push({name:'Content-Encoding',value:'br'},{name:'Content-Length',value:String(body.length)});
                  await client.send('Fetch.fulfillRequest',{requestId:ev.requestId,responseCode:200,responseHeaders:headers,body:body.toString('base64')});
                  rewritten++;
                } catch (err) {
                  rewriteError=err;
                  await client.send('Fetch.continueRequest',{requestId:ev.requestId}).catch(()=>{});
                }
              });
              const {lhr} = await lighthouse(site,flags,undefined,page);
              if(rewriteError) throw rewriteError;
              if(rewritten!==1 || lhr.runtimeError) throw Error(JSON.stringify({rewritten,runtimeError:lhr.runtimeError}));
              const a=lhr.audits, metrics=a.metrics.details.items[0];
              writeFileSync(`same-origin-${mode}-${i}.json`,JSON.stringify(lhr));
              const net=a['network-requests'].details.items.filter(x=>x.resourceType==='Stylesheet'&&x.url.startsWith(site)).map(x=>[x.url.slice(site.length),Math.round(x.networkRequestTime),Math.round(x.networkEndTime)]);
              const sample={lcp:Math.round(a['largest-contentful-paint'].numericValue),fcp:Math.round(a['first-contentful-paint'].numericValue),tbt:Math.round(a['total-blocking-time'].numericValue),cls:a['cumulative-layout-shift'].numericValue,observedLcp:metrics.observedLargestContentfulPaint,net,element:a['lcp-breakdown-insight'].details.items.find(x=>x.type==='node')?.selector};
              console.log('SAME ORIGIN SAMPLE',variant,mode,i,JSON.stringify(sample));
              return sample;
            } finally { await browser.close(); }
          }
          const results={baseline:[],candidate:[]};
          for(let i=1;i<=5;i++){
            for(const mode of (i%2?['baseline','candidate']:['candidate','baseline'])){
              results[mode].push(await measure(mode,i));
            }
          }
          const median=x=>x.map(i=>i.lcp).sort((a,b)=>a-b)[2];
          console.log('SAME ORIGIN COMPARISON',JSON.stringify({variant,baseline:results.baseline.map(x=>x.lcp),candidate:results.candidate.map(x=>x.lcp),baselineMedian:median(results.baseline),candidateMedian:median(results.candidate)}));
          JS
          node lcp-same-origin.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: same-origin-${{ matrix.variant }}
          path: same-origin-*.json
