name: Normalize English site headers once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-english-site-headers-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Enforce the homepage header everywhere
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          MASTER='''<header class="master-site-header"><div class="master-header-inner"><a class="master-brand" href="/" aria-label="Elajme India Home"><img src="/Healthcare%20Travel%20Swoosh%20Emblem.webp" alt="" width="60" height="60"><span class="master-brand-text"><span class="master-brand-main"><span>Elajme</span><b>India</b></span><span class="master-brand-ar" lang="ar" dir="rtl">علاج مي إنديا</span></span></a><nav class="master-nav" aria-label="Main navigation"><a href="/">Home</a><a href="/treatments/">Treatments</a><a href="/hospitals/">Hospitals</a><a href="/doctors/">Doctors</a><a href="/international-patients/mea/">International Patients</a><a href="/about/">About Us</a><a href="/contact/">Contact</a></nav><div class="master-actions"><a class="master-phone" href="tel:+917488955154">Call +91 74889 55154</a><a class="master-whatsapp" href="https://wa.me/917488955154" target="_blank" rel="noopener" aria-label="WhatsApp Elajme India">◉&nbsp; WhatsApp Us</a><a class="master-lang" href="/ar/">العربية</a><a class="master-cta" href="/#enquiry">Start Your Enquiry</a></div></div></header>'''
          def active_header(rel):
              href='/'
              if rel.startswith('treatments/'): href='/treatments/'
              elif rel.startswith('hospitals/'): href='/hospitals/'
              elif rel.startswith('doctors/'): href='/doctors/'
              elif rel.startswith('international-patients/'): href='/international-patients/mea/'
              elif rel.startswith('about/'): href='/about/'
              elif rel.startswith('contact/'): href='/contact/'
              return MASTER.replace(f'href="{href}"',f'href="{href}" aria-current="page"',1)
          patterns=[r'<header class="master-site-header">.*?</header>',r'<header class="shell-header">.*?</header>',r'<header class="directory-site-header">.*?</header>',r'<header class="site-header">.*?</header>',r'<header class="head">.*?</header>']
          changed=[]
          for p in Path('.').rglob('*.html'):
              rel=p.as_posix()
              if rel.startswith(('.git/','.github/','ar/')): continue
              text=p.read_text(encoding='utf-8')
              pat=next((x for x in patterns if re.search(x,text,re.S)),None)
              if not pat: continue
              new,n=re.subn(pat,active_header(rel),text,count=1,flags=re.S)
              if n!=1: raise SystemExit(f'header replacement failed: {rel}')
              new=re.sub(r'<style id="elajme-master-header-v\d+">.*?</style>','',new,flags=re.S)
              new=re.sub(r'<link rel="stylesheet" href="/assets/css/master-header\.css\?v=\d+">','',new)
              new=new.replace('</head>','<link rel="stylesheet" href="/assets/css/master-header.css?v=3"></head>',1)
              if new!=text:
                  p.write_text(new,encoding='utf-8'); changed.append(rel)
          print('HOME MASTER HEADER APPLIED:',len(changed),'English pages')
          PY
      - name: Verify exact visual master isolation and WhatsApp
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          required=['index.html','treatments/index.html','hospitals/index.html','doctors/index.html','international-patients/mea/index.html','about/index.html','contact/index.html']
          bad=[]; headers=[]
          for req in required:
              t=Path(req).read_text(encoding='utf-8')
              m=re.search(r'<header class="master-site-header">.*?</header>',t,re.S)
              if not m: bad.append((req,'master header missing')); continue
              h=m.group(0)
              if t.count('class="master-site-header"')!=1: bad.append((req,'master header count'))
              if t.count('/assets/css/master-header.css?v=3')!=1: bad.append((req,'master stylesheet v3 count'))
              if 'WhatsApp Us' not in h or 'wa.me/917488955154' not in h: bad.append((req,'WhatsApp mismatch'))
              if 'How it works' in h: bad.append((req,'legacy nav leaked'))
              for legacy in ['directory-site-header','directory-shell','directory-actions','shell-header']:
                  if legacy in h: bad.append((req,'legacy header class leaked: '+legacy))
              headers.append((req,re.sub(r' aria-current="page"','',h)))
          if headers:
              base=headers[0][1]
              for rel,h in headers[1:]:
                  if h!=base: bad.append((rel,'header markup differs from Home'))
          css=Path('assets/css/master-header.css').read_text(encoding='utf-8')
          for needle in ['height:82px!important','min-height:82px!important','max-height:82px!important','width:60px!important','min-width:122px!important','.master-whatsapp']:
              if needle not in css: bad.append(('master-header.css',needle))
          dcss=Path('assets/css/directory-shell.css').read_text(encoding='utf-8')
          if 'body>header:not(.directory-site-header) .c.nav' in dcss: bad.append(('directory-shell.css','legacy generic header selector can target master'))
          if 'body>header:not(.directory-site-header):not(.master-site-header)' not in dcss: bad.append(('directory-shell.css','master isolation missing'))
          if bad: raise SystemExit(str(bad))
          print('HOME HEADER DIMENSIONS HARD-LOCKED AND IDENTICAL ON REQUIRED PAGES')
          print('WHATSAPP PRESENT; HOW IT WORKS ABSENT; CACHE VERSION v3')
          PY
          git diff --exit-code -- assets/css/footer-approved.css FOOTER-LOCK.md
      - name: Commit normalized headers
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html'
          git commit -m 'Hard lock Home header dimensions across English site'
          git push
