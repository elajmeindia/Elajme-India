name: Fix exact Arabic language switches sitewide

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/batch-treatment-trust-parity-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Arabic visible English switches only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib
          locked=[Path('FOOTER-LOCK.md'),Path('assets/css/footer-approved.css')]
          before={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in locked}
          changed=[]
          for p in Path('ar').rglob('index.html'):
              counterpart=Path(str(p)[3:])
              if not counterpart.exists(): continue
              text=p.read_text(errors='ignore')
              if re.search(r'<meta[^>]+http-equiv=["\']refresh["\']',text,re.I): continue
              fi=text.lower().find('<footer'); pre=text[:fi] if fi>=0 else text; post=text[fi:] if fi>=0 else ''
              target='/' if str(counterpart).replace('\\','/')=='index.html' else '/'+str(counterpart).replace('\\','/')[:-10]
              pat=re.compile(r'(<a\b[^>]*class=["\'][^"\']*shell-lang[^"\']*["\'][^>]*href=["\'])[^"\']+(["\'][^>]*>\s*English\s*</a>)',re.I)
              new,n=pat.subn(lambda m:m.group(1)+target+m.group(2),pre,count=1)
              if n and new!=pre:
                  p.write_text(new+post)
                  changed.append(str(p))
          print('Changed Arabic pages:',len(changed))
          for x in changed: print('CHANGED',x)
          after={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in locked}
          if before!=after: raise SystemExit('LOCKED FILE CHANGED')
          PY
      - name: Commit safe switch fixes
        shell: bash
        run: |
          if git diff --quiet; then echo 'No changes required'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ar
          git commit -m 'Fix Arabic English language switches'
          git push
