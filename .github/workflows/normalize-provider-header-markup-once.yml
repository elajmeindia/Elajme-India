name: Normalize legacy provider header markup to approved master

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-provider-header-markup-once.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Replace legacy provider headers with approved master markup
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          en_header='''<header class="master-site-header"><div class="master-header-inner"><a class="master-brand" href="/" aria-label="Elajme India Home"><img src="/Healthcare%20Travel%20Swoosh%20Emblem.webp" alt="" width="60" height="60"><span class="master-brand-text"><span class="master-brand-main"><span>Elajme</span><b>India</b></span><span class="master-brand-ar" lang="ar" dir="rtl">علاج مي إنديا</span></span></a><nav class="master-nav" aria-label="Main navigation"><a href="/">Home</a><a href="/treatments/">Treatments</a><a href="/hospitals/">Hospitals</a><a href="/doctors/">Doctors</a><a href="/international-patients/mea/">International Patients</a><a href="/about/">About Us</a><a href="/contact/">Contact</a></nav><div class="master-actions"><a class="master-phone" href="tel:+917488955154" aria-label="Call Elajme India at +91 74889 55154">+91 74889 55154</a><a class="master-whatsapp" href="https://wa.me/917488955154" target="_blank" rel="noopener" aria-label="WhatsApp Elajme India">◉&nbsp; WhatsApp Us</a><a class="master-lang" href="/ar/">العربية</a><a class="master-cta" href="/#enquiry">Start Your Enquiry</a></div></div></header>'''
          ar_header='''<header class="master-site-header"><div class="master-header-inner"><a class="master-brand" href="/ar/" aria-label="علاج مي إنديا - الرئيسية"><img src="/Healthcare%20Travel%20Swoosh%20Emblem.webp" alt="" width="60" height="60"><span class="master-brand-text"><span class="master-brand-main"><span>Elajme</span><b>India</b></span><span class="master-brand-ar" lang="ar" dir="rtl">علاج مي إنديا</span></span></a><nav class="master-nav" aria-label="التنقل الرئيسي"><a href="/ar/">الرئيسية</a><a href="/ar/treatments/">العلاجات</a><a href="/ar/hospitals/">المستشفيات</a><a href="/ar/doctors/">الأطباء</a><a href="/ar/international-patients/mea/">المرضى الدوليون</a><a href="/ar/about/">من نحن</a><a href="/ar/contact/">تواصل معنا</a></nav><div class="master-actions"><a class="master-phone" href="tel:+917488955154" aria-label="اتصل بعلاج مي إنديا على +91 74889 55154"><bdi>+91 74889 55154</bdi></a><a class="master-whatsapp" href="https://wa.me/917488955154" target="_blank" rel="noopener" aria-label="واتساب علاج مي إنديا">◉&nbsp; واتساب</a><a class="master-lang" href="/">English</a><a class="master-cta" href="/ar/#enquiry">ابدأ استفسارك</a></div></div></header>'''

          changed=[]
          skipped=[]
          for root in ('doctors','hospitals','ar/doctors','ar/hospitals'):
              base=Path(root)
              if not base.exists(): continue
              for p in base.rglob('index.html'):
                  s=p.read_text(encoding='utf-8', errors='ignore')
                  low=s.lower()
                  if 'http-equiv="refresh"' in low or "http-equiv='refresh'" in low or 'noindex' in low:
                      continue
                  if 'class="master-site-header"' in s:
                      continue
                  m=re.search(r'<header\b[^>]*>.*?</header>', s, re.I|re.S)
                  if not m:
                      skipped.append(str(p)); continue
                  is_ar=p.parts[0]=='ar'
                  replacement=ar_header if is_ar else en_header
                  s=s[:m.start()]+replacement+s[m.end():]
                  p.write_text(s, encoding='utf-8')
                  changed.append(str(p))
          print('Provider headers normalized:', len(changed))
          for x in changed: print(x)
          if skipped:
              print('SKIPPED_NO_HEADER', len(skipped))
              for x in skipped: print(x)
              raise SystemExit(1)
          PY
      - name: Commit approved provider header markup
        run: |
          if git diff --quiet; then
            echo 'No legacy provider header markup remains.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add doctors hospitals ar/doctors ar/hospitals
          git commit -m 'Normalize provider header markup to approved master'
          git push
