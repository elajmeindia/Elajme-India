name: Connect Wockhardt Mumbai Central to bilingual hospital directories once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-wockhardt-directory-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair bilingual Wockhardt directory links safely
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          locked=['assets/css/footer-approved.css','FOOTER-LOCK.md']
          before={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in locked}
          old='wockhardt-hospitals-mumbai-central'
          new='wockhardt-hospital-mumbai-central'
          for p in (Path('hospitals/index.html'),Path('ar/hospitals/index.html')):
              s=p.read_text(encoding='utf-8')
              s=s.replace(old,new)
              p.write_text(s,encoding='utf-8')
              if new not in s: raise SystemExit(f'{p}: canonical Wockhardt profile link missing')
              if old in s: raise SystemExit(f'{p}: stale Wockhardt profile link remains')
          for p,h in before.items():
              if hashlib.sha256(Path(p).read_bytes()).hexdigest()!=h: raise SystemExit(f'Locked file changed: {p}')
          print('WOCKHARDT BILINGUAL DIRECTORY LINKS CLEAN')
          PY
      - name: Commit directory updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hospitals/index.html ar/hospitals/index.html
          if git diff --cached --quiet; then
            echo 'No directory changes required.'
          else
            git commit -m 'Repair Wockhardt canonical directory links'
            git push
          fi