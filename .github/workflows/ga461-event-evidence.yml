name: Validate GA4 candidate events with synthetic inputs
on:
  pull_request:
    paths: ['.github/workflows/ga461-event-evidence.yml', 'scripts/ga461-check.cjs', 'scripts/ga461-routes.json']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 9619b266bbc2e7193d3c841cfabe236dbb9066cd
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit playwright@1.56.1 && npx playwright install chromium
      - shell: bash
        run: |
          mkdir -p evidence
          node scripts/ga461-check.cjs | tee evidence/ga461.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ga461-intercepted-event-checks
          path: evidence/
          retention-days: 7
