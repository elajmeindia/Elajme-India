name: Audit exact bilingual language switches sitewide

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/batch-treatment-trust-parity-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit exact EN AR visible language switches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib

          def redirect_only(text):
              return bool(re.search(r'<meta[^>]+http-equiv=["\']refresh["\']', text, re.I))

          def active_pages():
              out=[]
              for p in Path('.').rglob('index.html'):
                  s=str(p).replace('\\','/')
                  if '/.git/' in s: continue
                  t=p.read_text(errors='ignore')
                  if redirect_only(t): continue
                  out.append((p,t))
              return out

          pages=active_pages()
          bypath={str(p).replace('\\','/'):t for p,t in pages}
          issues=[]; pairs=0

          def hrefs(text):
              pre=text[:text.lower().find('<footer')] if '<footer' in text.lower() else text
              return re.findall(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>', pre, re.I|re.S)

          def norm(h):
              h=h.split('#')[0].split('?')[0]
              if h.startswith('https://elajmeindia.com'): h=h[len('https://elajmeindia.com'):]
              return h

          for s,t in sorted(bypath.items()):
              if s=='index.html': counterpart='ar/index.html'; expected='/ar/'
              elif s.startswith('ar/'):
                  counterpart=s[3:]
                  if counterpart=='index.html': expected='/'
                  else: expected='/' + counterpart[:-10] if counterpart.endswith('index.html') else '/' + counterpart
              else:
                  counterpart='ar/'+s
                  expected='/ar/' + (s[:-10] if s.endswith('index.html') else s)
              if counterpart not in bypath: continue
              pairs += 1
              candidates=[]
              for h,label in hrefs(t):
                  label_clean=re.sub(r'<[^>]+>',' ',label)
                  if s.startswith('ar/'):
                      if re.search(r'English',label_clean,re.I) or 'shell-lang' in label:
                          candidates.append(norm(h))
                  else:
                      if 'العربية' in label_clean or 'Arabic' in label_clean:
                          candidates.append(norm(h))
              if not candidates:
                  issues.append((s,'NO_VISIBLE_LANGUAGE_SWITCH',expected))
              elif expected not in candidates:
                  issues.append((s,'WRONG_SWITCH',expected,candidates))

          print(f'Active paired pages checked: {pairs}')
          print(f'Language-switch issues: {len(issues)}')
          for x in issues: print('ISSUE',x)
          for p in [Path('FOOTER-LOCK.md'),Path('assets/css/footer-approved.css')]:
              if not p.exists(): raise SystemExit(f'Missing locked file: {p}')
              print('LOCK',p,hashlib.sha256(p.read_bytes()).hexdigest())
          if issues: raise SystemExit('EXACT BILINGUAL LANGUAGE SWITCH AUDIT FAILED')
          print('EXACT BILINGUAL LANGUAGE SWITCH AUDIT CLEAN')
          PY
