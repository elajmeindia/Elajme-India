name: Connect verified transplant follow-up providers once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/connect-transplant-followup-providers-once.yml']
permissions:
  contents: write
jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add bilingual transplant follow-up provider discovery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pairs = {
            'treatments/transplant-medicine-follow-up-india/index.html': ('<a href="/doctors/">Browse doctors</a><a href="/hospitals/">Explore hospitals</a>', '<a href="/doctors/dr-arvinder-singh-soin/">Dr. Arvinder Singh Soin · Liver Transplant</a><a href="/doctors/dr-anant-kumar/">Dr. Anant Kumar · Kidney Transplant</a><a href="/hospitals/medanta-the-medicity-gurugram/">Medanta – The Medicity, Gurugram</a><a href="/hospitals/max-super-speciality-hospital-saket/">Max Super Speciality Hospital, Saket</a>'),
            'ar/treatments/transplant-medicine-follow-up-india/index.html': ('<a href="/ar/doctors/">استعرض الأطباء</a><a href="/ar/hospitals/">استعرض المستشفيات</a>', '<a href="/ar/doctors/dr-arvinder-singh-soin/">د. أرفيندر سينغ سوين · زراعة الكبد</a><a href="/ar/doctors/dr-anant-kumar/">د. أنانت كومار · زراعة الكلى</a><a href="/ar/hospitals/medanta-the-medicity-gurugram/">ميدانتا – ذا ميديسيتي، جوروجرام</a><a href="/ar/hospitals/max-super-speciality-hospital-saket/">مستشفى ماكس سوبر التخصصي، ساكيت</a>')
          }
          for fn,(old,new) in pairs.items():
              p=Path(fn); s=p.read_text(encoding='utf-8')
              if old not in s: raise SystemExit(f'marker missing: {fn}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add treatments/transplant-medicine-follow-up-india/index.html ar/treatments/transplant-medicine-follow-up-india/index.html
          git commit -m 'Connect transplant follow-up to verified provider profiles'
          git push
