name: Expand dental treatment coverage once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/expand-fertility-ivf-coverage-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Create bilingual dental pages and connect discovery
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re
          locked=['assets/css/footer-approved.css','FOOTER-LOCK.md']
          before={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in locked}
          def footer_of(path):
              t=Path(path).read_text(encoding='utf-8'); i=t.find('<footer')
              if i<0: raise SystemExit('footer missing '+path)
              return t[i:]
          en_footer=footer_of('treatments/heart-treatment-india/index.html')
          ar_footer=footer_of('ar/treatments/heart-treatment-india/index.html')
          en='''<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dental Treatment in India | International Patients | Elajme India</title><meta name="description" content="Dental treatment coordination in India for international patients, including preliminary record review and consultation requests through Elajme India."><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="https://elajmeindia.com/treatments/dental-treatment-india/"><link rel="alternate" hreflang="en" href="https://elajmeindia.com/treatments/dental-treatment-india/"><link rel="alternate" hreflang="ar" href="https://elajmeindia.com/ar/treatments/dental-treatment-india/"><link rel="alternate" hreflang="x-default" href="https://elajmeindia.com/treatments/dental-treatment-india/"><link rel="stylesheet" href="../../assets/css/treatment.css"><link rel="stylesheet" href="/assets/css/footer-approved.css?v=1"></head><body><header class="head"><div class="c nav"><a class="brand" href="../../">Elajme India</a><a href="../">Treatments</a><a href="../../doctors/">Doctors</a><a href="../../hospitals/">Hospitals</a><a href="../../patient-guide/">Patient Guide</a><a href="../../ar/treatments/dental-treatment-india/" lang="ar" dir="rtl">العربية</a><a class="wa" href="/#enquiry">Start Your Enquiry</a></div></header><main><section class="hero"><div class="c"><span class="ey">Dental care coordination</span><h1>Dental treatment in India for international patients</h1><p class="lead">Elajme India helps international patients coordinate dental-care enquiries with qualified dental teams in India. The appropriate procedure, investigations and treatment plan depend on individual clinical assessment.</p><a class="btn" href="/#enquiry">Request coordination through Elajme India</a></div></section><section class="sec"><div class="c"><h2>Dental care depends on individual assessment</h2><div class="grid"><article class="card"><h3>Dental consultation</h3><p>A dental specialist may review symptoms, dental history, available X-rays or scans and previous treatment before advising next steps.</p></article><article class="card"><h3>Restorative and surgical care</h3><p>Depending on the case, the treating team may discuss restorative, prosthodontic, implant-related, oral-surgical or other dental options after evaluation.</p></article><article class="card"><h3>Further investigations</h3><p>The treating team may request additional dental imaging or tests before confirming suitability, treatment stages, timing or estimates.</p></article></div><div class="note">Elajme India provides coordination and general information. We do not diagnose dental conditions, prescribe procedures or guarantee treatment outcomes.</div></div></section><section class="sec alt"><div class="c"><h2>What to share for an initial review</h2><p class="lead">Useful information may include the main dental concern, previous dental records, available X-rays or scans, relevant medical history and current medicines. The treating dental team determines what records and investigations are required.</p><div class="grid"><article class="card"><h3>1. Send available records</h3><p>Share the main concern and relevant available dental or medical documents with Elajme India.</p></article><article class="card"><h3>2. Coordinate specialist review</h3><p>We can coordinate submission to an appropriate dental team for preliminary review.</p></article><article class="card"><h3>3. Confirm next steps</h3><p>Consultation availability, investigations, procedure options, timing and estimates remain subject to the treating provider's review.</p></article></div><div class="related"><a href="../../hospitals/">Explore hospitals</a><a href="../../patient-guide/">Patient guide</a><a href="../../medical-visa/">Medical visa guide</a></div></div></section><section class="cta"><div class="c"><h2>Start a dental-care enquiry</h2><p>Share your dental concern, available records and country. Elajme India can coordinate the next enquiry step with an appropriate dental team.</p><a class="btn" href="/#enquiry">Send your enquiry</a></div></section></main>'''+en_footer
          ar='''<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>علاج الأسنان في الهند للمرضى الدوليين | علاج مي إنديا</title><meta name="description" content="تنسيق استفسارات علاج الأسنان في الهند للمرضى الدوليين، مع مراجعة أولية للتقارير والصور وطلبات الاستشارة عبر علاج مي إنديا."><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="https://elajmeindia.com/ar/treatments/dental-treatment-india/"><link rel="alternate" hreflang="en" href="https://elajmeindia.com/treatments/dental-treatment-india/"><link rel="alternate" hreflang="ar" href="https://elajmeindia.com/ar/treatments/dental-treatment-india/"><link rel="alternate" hreflang="x-default" href="https://elajmeindia.com/treatments/dental-treatment-india/"><link rel="stylesheet" href="../../../assets/css/treatment.css"><link rel="stylesheet" href="../../../assets/css/ar-core.css"><link rel="stylesheet" href="/assets/css/site-shell.css"><link rel="stylesheet" href="/assets/css/footer-approved.css?v=1"></head><body class="site-shell"><header class="head"><div class="c nav"><a class="brand" href="/ar/">علاج مي إنديا</a><a href="/ar/treatments/">العلاجات</a><a href="/ar/doctors/">الأطباء</a><a href="/ar/hospitals/">المستشفيات</a><a href="/ar/patient-guide/">دليل المريض</a><a href="/treatments/dental-treatment-india/">English</a><a class="wa" href="/ar/#enquiry">ابدأ استفسارك</a></div></header><main><section class="hero"><div class="c"><span class="ey">تنسيق رعاية الأسنان</span><h1>علاج الأسنان في الهند للمرضى الدوليين</h1><p class="lead">تساعد علاج مي إنديا المرضى الدوليين في تنسيق استفسارات علاج الأسنان مع فرق طب الأسنان المؤهلة في الهند. ويحدد الفريق المعالج الإجراء والفحوصات والخطة المناسبة بعد تقييم الحالة بصورة فردية.</p><a class="btn" href="/ar/#enquiry">اطلب التنسيق عبر علاج مي إنديا</a></div></section><section class="sec"><div class="c"><h2>رعاية الأسنان تعتمد على التقييم الفردي</h2><div class="grid"><article class="card"><h3>استشارة طبيب الأسنان</h3><p>قد يراجع الطبيب الأعراض والتاريخ السني والصور أو الأشعة المتوفرة والعلاجات السابقة قبل تحديد الخطوات التالية.</p></article><article class="card"><h3>العلاجات الترميمية والجراحية</h3><p>بحسب الحالة، قد يناقش الفريق المعالج خيارات ترميم الأسنان أو التركيبات أو الزراعة أو جراحة الفم أو غيرها بعد التقييم.</p></article><article class="card"><h3>فحوصات إضافية</h3><p>قد يطلب الفريق المعالج صوراً أو فحوصات إضافية قبل تأكيد ملاءمة العلاج ومراحله ومدته والتكلفة التقديرية.</p></article></div><div class="note">تقدم علاج مي إنديا خدمات التنسيق والمعلومات العامة، ولا تشخص أمراض الأسنان ولا تصف الإجراءات ولا تضمن نتائج العلاج.</div></div></section><section class="sec alt"><div class="c"><h2>ما الذي يمكن إرساله للمراجعة الأولية؟</h2><p class="lead">قد تفيد مشاركة المشكلة الرئيسية وسجلات الأسنان السابقة والأشعة أو الصور المتوفرة والتاريخ الطبي ذي الصلة والأدوية الحالية. ويحدد فريق الأسنان المعالج المستندات والفحوصات المطلوبة.</p><div class="grid"><article class="card"><h3>1. إرسال السجلات المتوفرة</h3><p>أرسل المشكلة الرئيسية والمستندات الطبية أو السنية المتوفرة إلى علاج مي إنديا.</p></article><article class="card"><h3>2. تنسيق مراجعة الاختصاصي</h3><p>يمكننا تنسيق إرسال الحالة إلى فريق أسنان مناسب للمراجعة الأولية.</p></article><article class="card"><h3>3. تأكيد الخطوات التالية</h3><p>تبقى الاستشارة والفحوصات وخيارات الإجراءات والمواعيد والتقديرات خاضعة لمراجعة الجهة الطبية المعالجة.</p></article></div><div class="related"><a href="/ar/hospitals/">المستشفيات</a><a href="/ar/patient-guide/">دليل المريض</a><a href="/ar/medical-visa/">دليل التأشيرة الطبية</a></div></div></section><section class="cta"><div class="c"><h2>ابدأ استفسار علاج الأسنان</h2><p>أرسل المشكلة السنية والسجلات المتوفرة وبلد الإقامة، ويمكن لعلاج مي إنديا تنسيق الخطوة التالية مع فريق أسنان مناسب.</p><a class="btn" href="/ar/#enquiry">أرسل استفسارك</a></div></section></main>'''+ar_footer
          Path('treatments/dental-treatment-india').mkdir(parents=True,exist_ok=True); Path('treatments/dental-treatment-india/index.html').write_text(en,encoding='utf-8')
          Path('ar/treatments/dental-treatment-india').mkdir(parents=True,exist_ok=True); Path('ar/treatments/dental-treatment-india/index.html').write_text(ar,encoding='utf-8')
          p=Path('treatments/index.html'); s=p.read_text(encoding='utf-8'); pre,sep,foot=s.partition('<footer')
          if 'dental-treatment-india/' not in pre:
              anchor='<article class="card"><h3><a href="fertility-ivf-treatment-india/">IVF &amp; Fertility Care</a></h3><p>Fertility specialist and assisted-reproduction enquiry coordination.</p></article>'
              card='<article class="card"><h3><a href="dental-treatment-india/">Dental Care</a></h3><p>Dental specialist review and treatment-enquiry coordination.</p></article>'
              pre=pre.replace(anchor,anchor+card,1)
              pre=pre.replace('Medical Treatment in India: 10 Specialties','Medical Treatment in India: 11 Specialties').replace('Explore 10 medical treatment areas','Explore 11 medical treatment areas')
              # Keep structured data synchronized with visible directory.
              marker='{"@type":"ListItem","position":9,"name":"Spine Surgery","url":"https://elajmeindia.com/treatments/spine-surgery-india/"}'
              replacement=marker+',{"@type":"ListItem","position":10,"name":"IVF & Fertility Care","url":"https://elajmeindia.com/treatments/fertility-ivf-treatment-india/"},{"@type":"ListItem","position":11,"name":"Dental Care","url":"https://elajmeindia.com/treatments/dental-treatment-india/"}'
              if '"position":10,"name":"IVF & Fertility Care"' not in pre: pre=pre.replace(marker,replacement,1)
              p.write_text(pre+sep+foot,encoding='utf-8')
          p=Path('ar/treatments/index.html'); s=p.read_text(encoding='utf-8'); pre,sep,foot=s.partition('<footer')
          if 'dental-treatment-india/' not in pre:
              anchor='<article class="card"><h3>علاج العقم وأطفال الأنابيب</h3><p>تنسيق استفسارات الخصوبة وتقنيات الإخصاب المساعد.</p><a href="fertility-ivf-treatment-india/">عرض التفاصيل</a></article>'
              card='<article class="card"><h3>علاج الأسنان</h3><p>تنسيق مراجعة حالات الأسنان والتواصل مع فرق طب الأسنان.</p><a href="dental-treatment-india/">عرض التفاصيل</a></article>'
              pre=pre.replace(anchor,anchor+card,1)
              p.write_text(pre+sep+foot,encoding='utf-8')
          p=Path('sitemap.xml'); s=p.read_text(encoding='utf-8')
          for u in ['https://elajmeindia.com/treatments/dental-treatment-india/','https://elajmeindia.com/ar/treatments/dental-treatment-india/']:
              if u not in s: s=s.replace('</urlset>',f'  <url><loc>{u}</loc></url>\n</urlset>')
          p.write_text(s,encoding='utf-8')
          for p,h in before.items():
              if hashlib.sha256(Path(p).read_bytes()).hexdigest()!=h: raise SystemExit('locked file changed '+p)
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add treatments/dental-treatment-india/index.html ar/treatments/dental-treatment-india/index.html treatments/index.html ar/treatments/index.html sitemap.xml
          if git diff --cached --quiet; then echo 'No changes required.'; exit 0; fi
          git commit -m 'Add bilingual dental treatment coverage'
          git push