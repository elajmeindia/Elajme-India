name: Add bilingual Blog tabs sitewide
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-blog-tabs-sitewide.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Insert Blog in existing navigation across HTML pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          changed=[]
          for p in Path('.').rglob('*.html'):
              if any(x in p.parts for x in ('.git','.github','node_modules')): continue
              s=p.read_text(encoding='utf-8')
              ar=p.parts[0]=='ar'
              blog='/ar/blog/' if ar else '/blog/'
              label='المدونة' if ar else 'Blog'
              contact='/ar/contact/' if ar else '/contact/'
              def fix(m):
                  nav=m.group(0)
                  if 'href="'+blog+'"' in nav: return nav
                  match=re.search(r'<a\b[^>]*href="'+re.escape(contact)+r'"[^>]*>',nav)
                  if not match: return nav
                  return nav[:match.start()]+'<a href="'+blog+'">'+label+'</a>'+nav[match.start():]
              # Only existing site navigation; never modify footer or body links.
              updated=re.sub(r'<nav\b[^>]*class="[^"]*(?:master-nav|shell-links)[^"]*"[^>]*>.*?</nav>',fix,s,flags=re.S)
              if updated!=s:
                  p.write_text(updated,encoding='utf-8')
                  changed.append(str(p))
          print('Updated',len(changed),'pages')
          for p in changed: print(p)
          # Validate every supported header includes the correct Blog link.
          missing=[]
          for p in Path('.').rglob('*.html'):
              if any(x in p.parts for x in ('.git','.github','node_modules')): continue
              s=p.read_text(encoding='utf-8')
              navs=re.findall(r'<nav\b[^>]*class="[^"]*(?:master-nav|shell-links)[^"]*"[^>]*>.*?</nav>',s,re.S)
              if navs and not all('href="'+('/ar/blog/' if p.parts[0]=='ar' else '/blog/')+'"' in n for n in navs): missing.append(str(p))
          if missing: raise SystemExit('Missing Blog links: '+', '.join(missing[:30]))
          PY
      - name: Commit sitewide navigation update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if ! git diff --cached --quiet; then
            git commit -m "Add Blog and المدونة to all English and Arabic navigation headers"
            git push
          fi
