name: QA language switching regression
on:
  push:
    branches:
      - qa/language-switch-preview
    paths:
      - 'assets/js/mobile-header.js'
      - 'tests/language-switch-unit.cjs'
      - '.github/workflows/qa-language-switch.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  language-switch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check script syntax
        run: |
          node --check assets/js/mobile-header.js
          node --check tests/language-switch-unit.cjs
      - name: Execute full-script language selection scenarios
        run: node tests/language-switch-unit.cjs
