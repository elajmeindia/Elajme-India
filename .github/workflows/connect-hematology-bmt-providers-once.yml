name: Connect verified hematology and BMT providers once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/connect-hematology-bmt-providers-once.yml']
permissions:
  contents: write
jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add verified bilingual provider discovery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pairs = {
            'treatments/hematology-blood-disorders-india/index.html': ('<a href="/doctors/">Browse doctors</a><a href="/hospitals/">Explore hospitals</a>', '<a href="/doctors/dr-ashok-kumar-vaid/">Dr. Ashok Kumar Vaid · Hematology &amp; Stem Cell Transplant</a><a href="/hospitals/medanta-the-medicity-gurugram/">Medanta – The Medicity, Gurugram</a>'),
            'ar/treatments/hematology-blood-disorders-india/index.html': ('<a href="/ar/doctors/">استعرض الأطباء</a><a href="/ar/hospitals/">استعرض المستشفيات</a>', '<a href="/ar/doctors/dr-ashok-kumar-vaid/">د. أشوك كومار فايد · أمراض الدم وزراعة الخلايا الجذعية</a><a href="/ar/hospitals/medanta-the-medicity-gurugram/">ميدانتا – ذا ميديسيتي، جوروجرام</a>'),
            'treatments/bone-marrow-transplant-india/index.html': ('<a href="/doctors/">Browse doctors</a><a href="/hospitals/">Explore hospitals</a>', '<a href="/doctors/dr-ashok-kumar-vaid/">Dr. Ashok Kumar Vaid · Hematology &amp; Stem Cell Transplant</a><a href="/hospitals/medanta-the-medicity-gurugram/">Medanta – The Medicity, Gurugram</a>'),
            'ar/treatments/bone-marrow-transplant-india/index.html': ('<a href="/ar/doctors/">استعرض الأطباء</a><a href="/ar/hospitals/">استعرض المستشفيات</a>', '<a href="/ar/doctors/dr-ashok-kumar-vaid/">د. أشوك كومار فايد · أمراض الدم وزراعة الخلايا الجذعية</a><a href="/ar/hospitals/medanta-the-medicity-gurugram/">ميدانتا – ذا ميديسيتي، جوروجرام</a>')
          }
          for fn,(old,new) in pairs.items():
              p=Path(fn); s=p.read_text(encoding='utf-8')
              if old not in s: raise SystemExit(f'marker missing: {fn}')
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add treatments/hematology-blood-disorders-india/index.html ar/treatments/hematology-blood-disorders-india/index.html treatments/bone-marrow-transplant-india/index.html ar/treatments/bone-marrow-transplant-india/index.html
          git commit -m 'Connect hematology and BMT to verified provider profiles'
          git push
