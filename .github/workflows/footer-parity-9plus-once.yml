name: Fix English homepage footer only

on:
  push:
    paths:
      - ".github/workflows/footer-parity-9plus-once.yml"

permissions:
  contents: write

jobs:
  fix-home-footer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix only English homepage footer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          home=Path('index.html')
          source=Path('treatments/index.html')
          footer_re=re.compile(r'<footer\b[^>]*>.*?</footer>',re.I|re.S)
          html=home.read_text(encoding='utf-8')
          approved=source.read_text(encoding='utf-8')
          master=footer_re.search(approved).group(0)
          html=footer_re.sub(lambda _:master,html,count=1)
          html=re.sub(r'<link[^>]+footer-approved\.css[^>]*>', '<link rel="stylesheet" href="/assets/css/footer-approved.css?v=3">', html, count=1, flags=re.I)
          home.write_text(html,encoding='utf-8')
          print('Fixed index.html only; all other pages untouched')
          PY
      - name: Commit English homepage footer fix
        shell: bash
        run: |
          git config user.name "Elajme India QA"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix English homepage footer only"
          git push
