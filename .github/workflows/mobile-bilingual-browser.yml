name: Mobile Bilingual Browser Journey
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-bilingual-browser.yml'
      - 'index.html'
      - 'ar/index.html'
      - 'assets/js/mobile-header.js'
      - 'doctors/**'
      - 'ar/doctors/**'
      - 'treatments/**'
      - 'ar/treatments/**'
      - 'assets/images/doctors/portrait-unavailable.svg'
      - 'assets/css/ar-core.css'
      - 'assets/css/doctor-profile.css'
      - 'assets/css/profile-directory.css'
  pull_request:
    paths:
      - '.github/workflows/mobile-bilingual-browser.yml'
      - 'assets/css/ar-core.css'
      - 'assets/css/doctor-profile.css'
      - 'assets/css/profile-directory.css'
  workflow_dispatch:
  schedule:
    - cron: '43 4 * * *'
permissions:
  contents: read
jobs:
  mobile-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test live English and Arabic mobile journeys
        env:
          SITE_ORIGIN: https://elajmeindia.com
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const origin=process.env.SITE_ORIGIN;
            // Exclude synthetic journeys from analytics. WhatsApp is intercepted below.
            await page.context().route(url=>/google-analytics|googletagmanager|analytics.google.com|doubleclick.net|cloudflareinsights/.test(url.hostname),route=>route.abort());
            const errors=[];
            for(const path of ['/','/ar/','/doctors/','/ar/doctors/','/hospitals/','/ar/hospitals/']){
              try{
                const response=await page.goto(origin+path,{waitUntil:'domcontentloaded',timeout:25000});
                if(!response||response.status()!==200)throw Error('HTTP '+(response?.status()??'none'));
                await page.waitForTimeout(500);
                const lang=path.startsWith('/ar/')?'ar':'en';
                const htmlLang=await page.locator('html').getAttribute('lang');
                if(htmlLang?.toLowerCase()!==lang)errors.push(path+': incorrect html language '+htmlLang);
                if(lang==='ar' && await page.locator('html').getAttribute('dir')!=='rtl')errors.push(path+': missing RTL');
                const overflow=await page.evaluate(()=>({
                  documentWidth:document.documentElement.scrollWidth,
                  viewportWidth:window.innerWidth
                }));
                if(overflow.documentWidth>overflow.viewportWidth+2)
                  errors.push(path+': horizontal overflow '+overflow.documentWidth+'px > '+overflow.viewportWidth+'px');
                const images=await page.locator('img').evaluateAll(nodes=>nodes.filter(img=>{
                  const rect=img.getBoundingClientRect();
                  return rect.width>0 && rect.height>0 && rect.top<window.innerHeight && rect.bottom>0 && img.complete && img.naturalWidth===0;
                }).slice(0,8).map(img=>img.getAttribute('src')));
                if(images.length)errors.push(path+': visible broken images '+images.join(', '));
                const menu=page.locator('.master-mobile-menu').first();
                if(await menu.count()){
                  await menu.click();
                  if(await menu.getAttribute('aria-expanded')!=='true')errors.push(path+': mobile menu did not open');
                  await menu.click();
                  if(await menu.getAttribute('aria-expanded')!=='false')errors.push(path+': mobile menu did not close');
                }else errors.push(path+': mobile menu not found');
                const wa=page.locator('a[href^="https://wa.me/917488955154"]').first();
                if(!await wa.count())errors.push(path+': Elajme WhatsApp link missing');
                if(path==='/'||path==='/ar/'){
                  if(!await page.locator('#patientEnquiryForm').count())errors.push(path+': patient enquiry form missing');
                }
                console.log('CHECK',path,'HTTP',response.status());
              }catch(e){errors.push(path+': '+e.message)}
            }
            // Capture remote image request failures before the page replaces failed portraits with placeholders.
            const isExternalImage = request =>
              request.resourceType() === 'image' && new URL(request.url()).origin !== new URL(origin).origin;

            const originalUrl = request => {
              while(request.redirectedFrom()) request = request.redirectedFrom();
              return request.url();
            };

            for(const path of ['/doctors/','/ar/doctors/','/hospitals/','/ar/hospitals/']){
              const failures = new Map();
              let declaredImages = new Set();
              const recordResponse = response => {
                const request = response.request();
                if(isExternalImage(request) && response.status() >= 400){
                  failures.set(originalUrl(request), {status:response.status()});
                }
              };
              const recordFailure = request => {
                if(!isExternalImage(request)) return;
                const url = originalUrl(request);
                if(!failures.has(url)){
                  failures.set(url, {error:request.failure()?.errorText ?? 'unknown network error'});
                }
              };
              page.on('response', recordResponse);
              page.on('requestfailed', recordFailure);
              try{
                const response=await page.goto(origin+path,{waitUntil:'domcontentloaded',timeout:25000});
                const {sources, ...result}=await page.evaluate(async html=>{
                  // Parse the original response in an inert template, before runtime fallbacks.
                  const original=document.createElement('template');
                  original.innerHTML=html;
                  const sources=[...original.content.querySelectorAll('article img[src]')]
                    .map(img=>new URL(img.getAttribute('src'),location.href).href);
                  const imgs=[...document.querySelectorAll('article img')];
                  for(const img of imgs){img.loading='eager';}
                  await Promise.all(imgs.map(img=>Promise.race([
                    img.decode().catch(()=>{}),
                    new Promise(resolve=>setTimeout(resolve,12000))
                  ])));
                  await new Promise(resolve=>setTimeout(resolve,900));
                  await Promise.all(imgs.filter(img=>!img.complete||img.naturalWidth===0).map(img=>img.decode().catch(()=>{})));
                  return {sources,count:imgs.length,broken:imgs.filter(img=>!img.complete||img.naturalWidth===0).map(img=>({src:img.currentSrc||img.src,alt:img.alt})).slice(0,35),fallbacks:imgs.filter(img=>(img.currentSrc||img.src).includes('/portrait-unavailable.svg')).length,fallbackDoctors:imgs.filter(img=>(img.currentSrc||img.src).includes('/portrait-unavailable.svg')).map(img=>({name:img.closest('article')?.querySelector('h2')?.textContent?.trim()||img.alt,profile:img.closest('article')?.querySelector('a.outline, a[href*="dr-"]')?.getAttribute('href')||null}))};
                }, await response.text());
                declaredImages = new Set(sources);
                console.log('PROVIDER DIRECTORY IMAGE SCAN',path,JSON.stringify(result));
                if(result.broken.length)errors.push(path+': '+result.broken.length+' broken provider directory images: '+JSON.stringify(result.broken));
                if((path==='/doctors/'||path==='/ar/doctors/')&&result.fallbacks>9)console.warn('EXTERNAL PORTRAIT AVAILABILITY WARNING',path,result.fallbacks,'fallbacks; verified best observed 9; remote CDN delivery varies');
              }catch(e){errors.push(path+': directory image scan '+e.message)}
              finally{
                page.off('response', recordResponse);
                page.off('requestfailed', recordFailure);
                const details = [...failures]
                  .filter(([url]) => declaredImages.has(url))
                  .map(([url, failure]) => ({url, ...failure}));
                if(details.length){
                  console.warn('DIRECTORY EXTERNAL IMAGE REQUEST FAILURES', path, JSON.stringify(details));
                }
              }
            }
            // Check first-party profile pages for the doctors whose directory portraits needed fallbacks.
            const affected=['dr-aloy-j-mukherjee','dr-ameet-kishore','dr-anup-dhir','dr-geeta-kadayaprath','dr-kalyanpury-jawaharlal-choudhury','dr-deepa-sharma','dr-dinesh-talwar','dr-hardeep-singh','dr-jatin-ahuja','dr-kulbhushan-attri','dr-neeraj-singh','dr-sandip-agnihotri','dr-saveena-gulati-raheja','dr-sundeep-kumar-upadhyaya','dr-vinit-suri','dr-anil-mandhani'];
            for(const slug of affected){
              for(const prefix of ['/doctors/','/ar/doctors/']){
                const path=prefix+slug+'/';
                try{
                  const response=await page.goto(origin+path,{waitUntil:'domcontentloaded',timeout:25000});
                  if(response?.status()!==200){console.log('PROFILE PORTRAIT REVIEW',path,'HTTP '+response?.status());continue}
                  const result=await page.evaluate(async()=>{
                    const img=document.querySelector('img.profile-photo') || [...document.images].find(img=>img.getAttribute('fetchpriority')==='high' && img.alt?.trim()) || [...document.images].find(img=>img.getAttribute('onerror')?.includes('portrait-unavailable.svg')) || [...document.images].find(img=>img.src.startsWith('http') && /doctor|dr[. ]|طبيب/i.test(img.alt||''));
                    if(!img)return {missing:true};
                    await Promise.race([img.decode().catch(()=>{}),new Promise(resolve=>setTimeout(resolve,7000))]);
                    if(!img.complete||img.naturalWidth===0){await new Promise(resolve=>setTimeout(resolve,800));await img.decode().catch(()=>{});}
                    return {src:img.currentSrc||img.src,loaded:img.complete&&img.naturalWidth>0,placeholder:(img.currentSrc||img.src).includes('/portrait-unavailable.svg')};
                  });
                  console.log('PROFILE PORTRAIT REVIEW',path,JSON.stringify(result));
                  if(!result.loaded)errors.push(path+': broken profile portrait '+JSON.stringify(result));
                }catch(e){errors.push(path+': profile portrait scan '+e.message)}
              }
            }
            // Verify the two recently updated doctor portraits on both live language pages.
            for(const slug of ['dr-kanchan-bansode','dr-nishchint-jain']){
              for(const prefix of ['/doctors/','/ar/doctors/']){
                const path=prefix+slug+'/';
                // PR checks exercise the checked-out Nishchint HTML before it is deployed.
                if(slug==='dr-nishchint-jain')await page.route(origin+path,route=>route.fulfill({status:200,contentType:'text/html',body:require('fs').readFileSync(path.slice(1)+'index.html','utf8')}));
                try{
                  const response=await page.goto(origin+path,{waitUntil:'domcontentloaded',timeout:25000});
                  if(response?.status()!==200){errors.push(path+': HTTP '+response?.status());continue}
                  if(slug==='dr-nishchint-jain')await page.waitForFunction(()=>{const img=document.querySelector('img[data-doctor-portrait]');return img&&img.complete&&img.naturalWidth>0},null,{timeout:12000});
                  const result=await page.evaluate(async()=>{
                    const imgs=[...document.images].filter(img=>img.alt?.toLowerCase().includes('portrait'));
                    const img=document.querySelector('img[data-doctor-portrait]')||imgs[0];
                    if(!img)return {error:'portrait element missing'};
                    await Promise.race([img.decode().catch(()=>{}),new Promise(resolve=>setTimeout(resolve,12000))]);
                    return {src:img.currentSrc||img.src,loaded:img.complete&&img.naturalWidth>0,placeholder:(img.currentSrc||img.src).includes('portrait-unavailable.svg')};
                  });
                  if(result.error||!result.loaded)errors.push(path+': portrait failed to render '+(result.error||result.src));
                  else console.log(result.placeholder?'PORTRAIT FALLBACK OK':'PORTRAIT OK',path,result.src);
                }catch(e){errors.push(path+': portrait verification '+e.message)}
                finally{if(slug==='dr-nishchint-jain')await page.unrouteAll({behavior:'wait'})}
              }
            }
            // Verify the real portrait failure handler without contacting the external image host.
            for(const prefix of ['/doctors/','/ar/doctors/']){
              const path=prefix+'dr-nishchint-jain/';
              await page.route(origin+path,route=>route.fulfill({status:200,contentType:'text/html',body:require('fs').readFileSync(path.slice(1)+'index.html','utf8')}));
              await page.route('https://images.apollo247.in/doctors/9f3aed98-015d-45fc-b4ee-581f2a7b6d2f.jpg',route=>route.abort());
              try{
                await page.goto(origin+path,{waitUntil:'domcontentloaded',timeout:25000});
                await page.waitForFunction(()=>{
                  const img=document.querySelector('img[data-doctor-portrait]');
                  return img&&img.complete&&img.naturalWidth>0&&img.src.includes('/portrait-unavailable.svg');
                },null,{timeout:12000});
                const alt=await page.locator('img[data-doctor-portrait]').getAttribute('alt');
                if(!alt?.includes(prefix.startsWith('/ar/')?'غير متاحة':'unavailable'))errors.push(path+': misleading fallback alt');
                console.log('FORCED CHECKED-OUT PROFILE FALLBACK OK',path);
              }catch(e){errors.push(path+': forced fallback '+e.message)}
              finally{await page.unrouteAll({behavior:'wait'})}
            }
            for(const lang of ['en','ar']){
              const prefix=lang==='ar'?'/ar':'';
              const treatment=prefix+'/treatments/';
              const directory=prefix+'/doctors/';
              try{
                await page.goto(origin+treatment,{waitUntil:'domcontentloaded',timeout:25000});
                if(!await page.locator('a[href="'+directory+'"]').count())errors.push(treatment+': doctor directory route missing');
                await page.goto(origin+directory,{waitUntil:'domcontentloaded',timeout:25000});
                const hrefs=await page.locator('a[href]').evaluateAll(nodes=>nodes.map(n=>n.getAttribute('href')));
                const profileHref=hrefs.map(h=>{
                  try{return new URL(h,origin+directory)}catch{return null}
                }).find(u=>u && u.origin===new URL(origin).origin && u.pathname.startsWith(directory) && u.pathname!==directory && u.pathname.split('/').filter(Boolean).length===directory.split('/').filter(Boolean).length+1);
                if(!profileHref){errors.push(directory+': doctor profile link missing');continue}
                const response=await page.goto(profileHref.href,{waitUntil:'domcontentloaded',timeout:25000});
                if(response?.status()!==200)errors.push(profileHref.pathname+': profile HTTP '+response?.status());
                const enquiry=lang==='ar'?'/ar/#enquiry':'/#enquiry';
                if(!await page.locator('a[href="'+enquiry+'"]').count())errors.push(profileHref.pathname+': Elajme enquiry route missing');
                console.log('JOURNEY',treatment,'->',directory,'->',profileHref.pathname,'->',enquiry);
              }catch(e){errors.push(lang+': treatment-to-enquiry journey: '+e.message)}
            }
            for(const path of ['/','/ar/']){
              try{
                await page.goto(origin+path,{waitUntil:'domcontentloaded',timeout:25000});
                // Intercept the real location.assign WhatsApp handoff; never contact WhatsApp.
                let handoff=null;
                await page.route('https://wa.me/**',route=>{
                  handoff=route.request().url();
                  return route.abort();
                });
                const prepared=await page.evaluate(()=>{
                  const form=document.getElementById('patientEnquiryForm');
                  const fields={patientName:'Test Patient',patientCountry:'Test Country',patientMobile:'+971501234567',preferredLanguage:'Arabic'};
                  for(const [id,value] of Object.entries(fields)){
                    const el=document.getElementById(id);
                    if(!el)return {error:'missing '+id};
                    el.value=value;
                  }
                  return {valid:form.checkValidity()};
                });
                if(prepared.error||!prepared.valid)errors.push(path+': enquiry routing '+(prepared.error||'test form invalid'));
                else {
                  const outgoing=page.waitForRequest(req=>req.url().startsWith('https://wa.me/917488955154?text='),{timeout:10000}).catch(()=>null);
                  await page.evaluate(()=>document.getElementById('patientEnquiryForm').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}))).catch(()=>{});
                  const request=await outgoing;
                  if(!request)errors.push(path+': enquiry does not route to Elajme WhatsApp');
                  else console.log('ENQUIRY DESTINATION',path,'Elajme WhatsApp (intercepted; not sent)');
                }
                await page.unrouteAll({behavior:'wait'});
                // Navigation may have started, so reload before the independent validation test.
                await page.goto(origin+path,{waitUntil:'domcontentloaded',timeout:25000});
                const result=await page.locator('#patientEnquiryForm').evaluate(form=>{
                  const required=['patientName','patientCountry','patientMobile','preferredLanguage'];
                  const missing=required.filter(id=>!form.querySelector('#'+id));
                  const initiallyInvalid=!form.checkValidity();
                  const inputs=required.map(id=>form.querySelector('#'+id));
                  if(inputs.every(Boolean)){
                    inputs[0].value='Test Patient';
                    inputs[1].value='Test Country';
                    inputs[2].value='+971501234567';
                    inputs[3].value='Arabic';
                    inputs.forEach(el=>el.dispatchEvent(new Event('input',{bubbles:true})));
                  }
                  const validAfterFill=form.checkValidity();
                  inputs.forEach(el=>{if(el)el.value=el.tagName==='SELECT'?'English':''});
                  return {missing,initiallyInvalid,validAfterFill};
                });
                if(result.missing.length)errors.push(path+': missing enquiry fields '+result.missing.join(','));
                if(!result.initiallyInvalid)errors.push(path+': blank enquiry form should be invalid');
                if(!result.validAfterFill)errors.push(path+': valid enquiry form rejected');
                console.log('FORM VALIDATION',path,JSON.stringify(result),'NO SUBMISSION');
              }catch(e){errors.push(path+': enquiry validation: '+e.message)}
            }
            if(errors.length){
              const fs=require('fs');
              fs.mkdirSync('qa-artifacts',{recursive:true});
              fs.writeFileSync('qa-artifacts/failures.txt',errors.join('\n')+'\n');
              try{await page.screenshot({path:'qa-artifacts/last-mobile-page.png',fullPage:true})}catch(e){console.error('Screenshot unavailable:',e.message)}
            }
            await browser.close();
            errors.forEach(e=>console.error('FAIL',e));
            console.log('MOBILE BILINGUAL BROWSER:',errors.length,'issues');
            if(errors.length)process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - name: Verify four responsive homepages in both languages
        if: ${{ !cancelled() }}
        env:
          SITE_ORIGIN: https://elajmeindia.com
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const origin=process.env.SITE_ORIGIN||'https://elajmeindia.com';
            const results=[];
            fs.mkdirSync('qa-artifacts',{recursive:true});
            for(const [width,height] of [[375,812],[390,844],[768,1024],[1363,936]]){
              for(const lang of ['en','ar']){
                const id=`${lang}-${width}`;
                const result={lang,width,height,errors:[],observations:{}};
                const check=(ok,message)=>{if(!ok)result.errors.push(message)};
                const context=await browser.newContext({viewport:{width,height},deviceScaleFactor:1,isMobile:width<768,hasTouch:width<1363,serviceWorkers:'block'});
                // Keep synthetic activity out of analytics; block all message destinations and writes.
                let handoffs=0;
                await context.route('**/*',route=>{
                  const req=route.request(),url=new URL(req.url());
                  if(/(^|\.)((wa\.me)|(whatsapp\.com))$/.test(url.hostname)){
                    handoffs++;
                    check(url.hostname==='wa.me'&&url.pathname==='/917488955154','Unexpected WhatsApp destination');
                    return route.abort();
                  }
                  if(!['GET','HEAD'].includes(req.method())||/google-analytics|googletagmanager|cloudflareinsights/.test(url.hostname))return route.abort();
                  return route.continue();
                });
                const page=await context.newPage();
                page.setDefaultTimeout(10000);
                try{
                  const response=await page.goto(origin+(lang==='ar'?'/ar/':'/'),{waitUntil:'networkidle',timeout:45000});
                  check(response?.status()===200,'Homepage HTTP status');
                  await page.evaluate(()=>document.fonts.ready);
                  check(await page.locator('html').getAttribute('lang')===lang,'Page language');
                  check(await page.locator('html').evaluate(el=>getComputedStyle(el).direction)===(lang==='ar'?'rtl':'ltr'),'Page direction');
                  const logo=page.locator('.master-brand img');
                  check(await logo.isVisible()&&await logo.evaluate(img=>img.complete&&img.naturalWidth>0),'Header logo');
                  const menu=page.locator('.master-mobile-menu').first();
                  if(await menu.isVisible()){
                    await menu.click();
                    await page.waitForTimeout(250);
                    check(await menu.getAttribute('aria-expanded')==='true','Menu did not open');
                    check(await page.locator('.master-nav a:visible').count()===8,'Eight navigation tabs unavailable');
                    await page.screenshot({path:`qa-artifacts/${id}-menu.png`});
                    await menu.click();
                    check(await menu.getAttribute('aria-expanded')==='false','Menu did not close');
                    result.observations.menu='opened, eight links visible, closed';
                  }else{
                    check(await page.locator('.master-nav a:visible').count()===8,'Desktop navigation tabs unavailable');
                    result.observations.menu='desktop navigation';
                  }
                  const wa=await page.locator('a[href*="wa.me/"],a[href*="api.whatsapp.com/"]').evaluateAll(nodes=>nodes.map(a=>a.href));
                  check(wa.length>0&&wa.every(h=>new URL(h).pathname==='/917488955154'),'Official WhatsApp number');
                  const prefix=lang==='ar'?'/ar':'';
                  const links=await page.locator('.treatments-section .hero-actions > .button').evaluateAll(nodes=>nodes.map(a=>new URL(a.href).pathname));
                  check(links.length===3&&['/treatments/','/hospitals/','/doctors/'].every(p=>links.includes(prefix+p)),'Directory destinations');
                  const countryCount=await page.locator('.audience-inner .country').count();
                  check(countryCount===8,'Eight country cards');
                  check(await page.locator('.process-grid .process-step').count()===4,'Four journey cards');
                  result.observations.grids=await page.evaluate(()=>{
                    const out={};
                    for(const [name,selector,child] of [['countries','.audience-inner','.country'],['journey','.process-grid','.process-step']]){
                      const grid=document.querySelector(selector),cells=[...grid.querySelectorAll(child)].map(el=>{const r=el.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height}});
                      const overlaps=cells.some((a,i)=>cells.slice(i+1).some(b=>Math.min(a.x+a.width,b.x+b.width)-Math.max(a.x,b.x)>2&&Math.min(a.y+a.height,b.y+b.height)-Math.max(a.y,b.y)>2));
                      out[name]={columns:getComputedStyle(grid).gridTemplateColumns,rows:[...new Set(cells.map(r=>Math.round(r.y)))].length,cells,overlaps};
                    }
                    return out;
                  });
                  check(!Object.values(result.observations.grids).some(g=>g.overlaps),'Overlapping grid cards');
                  if(width===1363){
                    check(result.observations.grids.countries.rows===2,'Desktop country cards should occupy two rows');
                    check(result.observations.grids.journey.rows===1,'Desktop journey should occupy one row');
                  }
                  check(await page.locator('.master-lang').getAttribute('href')===(lang==='ar'?'/':'/ar/'),'Homepage language switch destination');
                  result.observations.countryCount=countryCount;
                  result.observations.css=await page.locator('link[rel="stylesheet"]').evaluateAll(nodes=>nodes.map(n=>n.getAttribute('href')));
                  // Scroll every screen so lazy images and sticky/floating controls are represented.
                  for(let y=0;y<await page.evaluate(()=>document.documentElement.scrollHeight);y+=Math.floor(height*0.75)){
                    await page.evaluate(y=>window.scrollTo(0,y),y);
                    await page.waitForTimeout(80);
                    const overflow=await page.evaluate(()=>({scroll:document.documentElement.scrollWidth,viewport:innerWidth}));
                    check(overflow.scroll<=overflow.viewport+2,`Horizontal overflow at y=${y}: ${overflow.scroll}>${overflow.viewport}`);
                  }
                  await page.evaluate(()=>scrollTo(0,0));
                  await page.screenshot({path:`qa-artifacts/${id}-full.png`,fullPage:true});
                  for(const [name,selector] of Object.entries({hero:'#home',countries:'.audience-strip',enquiry:'#enquiry',treatments:'.treatments-section',journey:'.process-section',guides:'.countries-section',faq:'.faq-section',footer:'footer'})){
                    const section=page.locator(selector).first();
                    check(await section.isVisible(),`${name} section missing`);
                    await section.screenshot({path:`qa-artifacts/${id}-${name}.png`});
                  }
                  // Native clicks exercise the real FAQ and required-field validation.
                  const faq=page.locator('.faq-list details').first();
                  await faq.locator('summary').click();
                  check(await faq.evaluate(el=>el.open),'FAQ did not open');
                  await faq.locator('summary').click();
                  check(!await faq.evaluate(el=>el.open),'FAQ did not close');
                  const form=page.locator('#patientEnquiryForm');
                  check(!await form.evaluate(el=>el.checkValidity()),'Blank form accepted');
                  await form.locator('[type="submit"]').click();
                  check(handoffs===0,'Blank form triggered handoff');
                  for(const [field,value] of Object.entries({patientName:'Synthetic QA',patientCountry:'Oman',patientMobile:'+12025550123'}))await page.locator('#'+field).fill(value);
                  check(await form.evaluate(el=>el.checkValidity()),'Valid synthetic fields rejected');
                  const required=await form.evaluate(el=>['patientName','patientCountry','patientMobile'].map(id=>{const field=el.querySelector('#'+id),saved=field.value;field.value='';const rejected=!el.checkValidity();field.value=saved;return {id,rejected};}));
                  check(required.every(f=>f.rejected),'Required field accepted when empty');
                  result.observations.required=required;
                  await page.locator('#patientMobile').fill('12');
                  await form.locator('[type="submit"]').click();
                  await page.waitForTimeout(200);
                  check(handoffs===0,'Invalid phone triggered handoff');
                  await page.locator('#patientMobile').fill('+12025550123');
                  // Hit testing detects fixed controls covering actual field/button centres after normal scrolling.
                  const obstruction=[];
                  for(const selector of ['#patientName','#patientCountry','#patientMobile','#preferredLanguage','.enquiry-submit']){
                    const target=page.locator(selector);
                    await target.evaluate(el=>el.scrollIntoView({block:'center',behavior:'instant'}));
                    const hit=await target.evaluate(el=>{const r=el.getBoundingClientRect(),top=document.elementFromPoint(r.x+r.width/2,r.y+r.height/2);return !!top&&(top===el||el.contains(top));});
                    if(!hit)obstruction.push(selector);
                  }
                  check(!obstruction.length,'Form controls obstructed: '+obstruction.join(', '));
                  result.observations.obstructed=obstruction;
                  await form.screenshot({path:`qa-artifacts/${id}-validation.png`});
                  const outgoing=page.waitForRequest(req=>new URL(req.url()).hostname==='wa.me',{timeout:10000}).catch(()=>null);
                  await form.locator('[type="submit"]').click({noWaitAfter:true});
                  check(!!await outgoing,'Synthetic enquiry handoff missing');
                  // The request event precedes the route callback; wait for interception before counting.
                  for(let n=0;n<50&&handoffs===0;n++)await new Promise(resolve=>setTimeout(resolve,20));
                  check(handoffs===1,'Expected exactly one intercepted handoff');
                  result.observations.handoffs=handoffs;
                }catch(error){result.errors.push(error.message);try{await page.screenshot({path:`qa-artifacts/${id}-failure.png`,fullPage:true})}catch{}}
                finally{await context.close()}
                results.push(result);
                console.log('RESPONSIVE',JSON.stringify(result));
              }
            }
            await browser.close();
            fs.writeFileSync('qa-artifacts/responsive-results.json',JSON.stringify(results,null,2));
            if(process.env.GITHUB_STEP_SUMMARY)fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'## Responsive production verification\n\n|Language|Viewport|Result|\n|---|---|---|\n'+results.map(r=>`|${r.lang}|${r.width} × ${r.height}|${r.errors.length?r.errors.join('; '):'PASS'}|`).join('\n')+'\n\nScreenshots and measurements are in the responsive evidence artifact. Automated geometry checks require visual review; they do not establish a quality score.\n');
            if(results.some(r=>r.errors.length))process.exitCode=1;
          })().catch(error=>{console.error(error);process.exitCode=1});
