name: Localize doctor images
on:
  push:
    paths:
      - '.github/workflows/localize-doctor-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover-anant-kumar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Localize Dr Anant Kumar portrait
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images/doctors
          URL='https://medglobe.health/images/UrologyTreatment/AnantKumar.png'
          DEST='assets/images/doctors/dr-anant-kumar.png'
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 90 -A 'Mozilla/5.0' "$URL" -o "$DEST"
          test -s "$DEST"
          test $(stat -c%s "$DEST") -gt 4000
          file "$DEST" | grep -Eqi 'image|png|jpeg|webp'
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('doctors/index.html')
          text=p.read_text()
          cards=re.findall(r'<article class="card".*?</article>',text,re.S)
          done=False
          for card in cards:
              if 'Dr. Anant Kumar' in card:
                  new=re.sub(r'<img class="photo"[^>]*>', '<img class="photo" loading="lazy" src="../assets/images/doctors/dr-anant-kumar.png?v=7" alt="Dr. Anant Kumar">', card, count=1)
                  if new == card:
                      raise SystemExit('Dr Anant Kumar image tag not found')
                  text=text.replace(card,new,1)
                  done=True
                  break
          if not done:
              raise SystemExit('Dr Anant Kumar card not found')
          p.write_text(text)
          PY
      - name: Commit localized portrait
        run: |
          git config user.name 'Elajme India Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/images/doctors/dr-anant-kumar.png doctors/index.html
          git diff --cached --quiet && { echo 'No changes produced'; exit 1; }
          git commit -m 'Localize Dr Anant Kumar portrait'
          git push
