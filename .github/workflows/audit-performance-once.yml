name: Audit site performance once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-performance-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit image weight and loading hints
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root=Path('.')
          pages=list(root.rglob('*.html'))
          image_ext={'.png','.jpg','.jpeg','.webp','.avif','.gif'}
          large=[]
          very_large=[]
          png_refs=[]
          missing_lazy=[]
          missing_dims=[]

          for p in root.rglob('*'):
              if p.is_file() and p.suffix.lower() in image_ext:
                  size=p.stat().st_size
                  if size>300_000: large.append((size,p.as_posix()))
                  if size>800_000: very_large.append((size,p.as_posix()))

          for page in pages:
              text=page.read_text(errors='ignore')
              imgs=re.findall(r'<img\b[^>]*>',text,flags=re.I)
              for tag in imgs:
                  m=re.search(r'\bsrc=["\']([^"\']+)',tag,flags=re.I)
                  if not m: continue
                  src=m.group(1)
                  if src.lower().split('?')[0].endswith('.png'):
                      png_refs.append((page.as_posix(),src))
                  # Flag non-logo/non-hero images without lazy loading.
                  low=tag.lower()
                  if 'loading=' not in low and not any(k in src.lower() for k in ('logo','banner','hero','emblem')):
                      missing_lazy.append((page.as_posix(),src))
                  if 'width=' not in low or 'height=' not in low:
                      missing_dims.append((page.as_posix(),src))

          print('PERFORMANCE AUDIT (read-only)')
          print(f'HTML pages: {len(pages)}')
          print(f'Images >300KB: {len(large)}')
          for size,path in sorted(large,reverse=True)[:80]: print(f'LARGE {size/1024:.0f}KB {path}')
          print(f'Images >800KB: {len(very_large)}')
          print(f'PNG references in HTML: {len(png_refs)}')
          for page,src in png_refs[:80]: print(f'PNG_REF {page}: {src}')
          print(f'Non-critical images missing loading hint: {len(missing_lazy)}')
          for page,src in missing_lazy[:80]: print(f'NO_LAZY {page}: {src}')
          print(f'Images missing width/height: {len(missing_dims)}')
          for page,src in missing_dims[:80]: print(f'NO_DIMS {page}: {src}')

          # Fail only for extreme asset weight; informational findings remain visible in logs.
          if very_large:
              raise SystemExit(f'Performance audit found {len(very_large)} image(s) over 800KB')
          PY
      - name: Verify footer lock files are untouched
        run: |
          test -z "$(git status --porcelain -- assets/css/footer-approved.css FOOTER-LOCK.md)"
