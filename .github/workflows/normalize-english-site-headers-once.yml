name: Lock bilingual master headers
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-english-site-headers-once.yml'
      - 'assets/css/master-header.css'
      - 'assets/css/arabic-master-header.css'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Enforce approved English master and Arabic visual parity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          EN='''<header class="master-site-header"><div class="master-header-inner"><a class="master-brand" href="/" aria-label="Elajme India Home"><img src="/Healthcare%20Travel%20Swoosh%20Emblem.webp" alt="" width="60" height="60"><span class="master-brand-text"><span class="master-brand-main"><span>Elajme</span><b>India</b></span><span class="master-brand-ar" lang="ar" dir="rtl">علاج مي إنديا</span></span></a><nav class="master-nav" aria-label="Main navigation"><a href="/">Home</a><a href="/treatments/">Treatments</a><a href="/hospitals/">Hospitals</a><a href="/doctors/">Doctors</a><a href="/international-patients/mea/">International Patients</a><a href="/about/">About Us</a><a href="/contact/">Contact</a></nav><div class="master-actions"><a class="master-phone" href="tel:+917488955154" aria-label="Call Elajme India at +91 74889 55154">+91 74889 55154</a><a class="master-whatsapp" href="https://wa.me/917488955154" target="_blank" rel="noopener" aria-label="WhatsApp Elajme India">◉&nbsp; WhatsApp Us</a><a class="master-lang" href="/ar/">العربية</a><a class="master-cta" href="/#enquiry">Start Your Enquiry</a></div></div></header>'''
          AR='''<header class="master-site-header"><div class="master-header-inner"><a class="master-brand" href="/ar/" aria-label="علاج مي إنديا - الرئيسية"><img src="/Healthcare%20Travel%20Swoosh%20Emblem.webp" alt="" width="60" height="60"><span class="master-brand-text"><span class="master-brand-main"><span>Elajme</span><b>India</b></span><span class="master-brand-ar" lang="ar" dir="rtl">علاج مي إنديا</span></span></a><nav class="master-nav" aria-label="التنقل الرئيسي"><a href="/ar/">الرئيسية</a><a href="/ar/treatments/">العلاجات</a><a href="/ar/hospitals/">المستشفيات</a><a href="/ar/doctors/">الأطباء</a><a href="/ar/international-patients/mea/">المرضى الدوليون</a><a href="/ar/about/">من نحن</a><a href="/ar/contact/">تواصل معنا</a></nav><div class="master-actions"><a class="master-phone" href="tel:+917488955154" aria-label="اتصل بعلاج مي إنديا على +91 74889 55154"><bdi>+91 74889 55154</bdi></a><a class="master-whatsapp" href="https://wa.me/917488955154" target="_blank" rel="noopener" aria-label="واتساب علاج مي إنديا">◉&nbsp; واتساب</a><a class="master-lang" href="/">English</a><a class="master-cta" href="/ar/#enquiry">ابدأ استفسارك</a></div></div></header>'''
          patterns=[r'<header class="master-site-header">.*?</header>',r'<header class="shell-header">.*?</header>',r'<header class="directory-site-header">.*?</header>',r'<header class="site-header">.*?</header>',r'<header class="head">.*?</header>']

          def active(header, rel, ar=False):
              base='ar/' if ar else ''
              r=rel[len(base):] if ar else rel
              href='/ar/' if ar else '/'
              if r.startswith('treatments/'): href=('/ar/treatments/' if ar else '/treatments/')
              elif r.startswith('hospitals/'): href=('/ar/hospitals/' if ar else '/hospitals/')
              elif r.startswith('doctors/'): href=('/ar/doctors/' if ar else '/doctors/')
              elif r.startswith('international-patients/'): href=('/ar/international-patients/mea/' if ar else '/international-patients/mea/')
              elif r.startswith('about/'): href=('/ar/about/' if ar else '/about/')
              elif r.startswith('contact/'): href=('/ar/contact/' if ar else '/contact/')
              return header.replace(f'href="{href}"',f'href="{href}" aria-current="page"',1)

          changed=[]
          for p in Path('.').rglob('*.html'):
              rel=p.as_posix()
              if rel.startswith(('.git/','.github/')) or rel=='404.html': continue
              text=p.read_text(encoding='utf-8',errors='ignore')
              is_ar=rel.startswith('ar/')
              pat=next((x for x in patterns if re.search(x,text,re.S)),None)
              if not pat: continue
              header=active(AR if is_ar else EN,rel,is_ar)
              new,n=re.subn(pat,header,text,count=1,flags=re.S)
              if n!=1: raise SystemExit(f'header replacement failed: {rel}')
              new=re.sub(r'<link rel="stylesheet" href="/assets/css/master-header\.css\?v=\d+">','',new)
              new=re.sub(r'<link rel="stylesheet" href="/assets/css/arabic-master-header\.css\?v=\d+">','',new)
              if rel in ('hospitals/index.html','doctors/index.html'):
                  new=new.replace('<link rel="stylesheet" href="/assets/css/directory-shell.css">','')
              links='<link rel="stylesheet" href="/assets/css/master-header.css?v=5">'
              if is_ar: links+='<link rel="stylesheet" href="/assets/css/arabic-master-header.css?v=1">'
              new=new.replace('</head>',links+'</head>',1)
              if new!=text:
                  p.write_text(new,encoding='utf-8'); changed.append(rel)
          print('BILINGUAL MASTER HEADER APPLIED:',len(changed),'pages')
          PY
      - name: Verify bilingual header super lock
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,sys
          bad=[]
          css=Path('assets/css/master-header.css').read_text(encoding='utf-8')
          arcss=Path('assets/css/arabic-master-header.css').read_text(encoding='utf-8')
          for needle in ['height:82px!important','width:60px!important','.master-whatsapp','font-weight:500!important']:
              if needle not in css: bad.append('MASTER_CSS '+needle)
          for needle in ['html[lang="ar"] .master-header-inner','direction:rtl!important','.master-whatsapp']:
              if needle not in arcss: bad.append('AR_PARITY_CSS '+needle)
          for p in Path('.').rglob('*.html'):
              rel=p.as_posix()
              if rel.startswith(('.git/','.github/')) or rel=='404.html': continue
              t=p.read_text(encoding='utf-8',errors='ignore')
              if '<header' not in t: continue
              if t.count('class="master-site-header"')!=1: bad.append('MASTER_COUNT '+rel)
              if t.count('/assets/css/master-header.css?v=5')!=1: bad.append('MASTER_CSS_LINK '+rel)
              h=re.search(r'<header class="master-site-header">.*?</header>',t,re.S)
              if not h: bad.append('MASTER_MISSING '+rel); continue
              hs=h.group(0)
              if 'How it works' in hs or 'directory-site-header' in hs or 'shell-header' in hs: bad.append('LEGACY_HEADER '+rel)
              if '917488955154' not in hs: bad.append('PHONE_WA '+rel)
              if rel.startswith('ar/'):
                  if t.count('/assets/css/arabic-master-header.css?v=1')!=1: bad.append('AR_CSS_LINK '+rel)
                  for x in ['الرئيسية','العلاجات','المستشفيات','الأطباء','المرضى الدوليون','من نحن','تواصل معنا','واتساب','English','ابدأ استفسارك']:
                      if x not in hs: bad.append('AR_LABEL '+rel+' '+x)
              else:
                  for x in ['Home','Treatments','Hospitals','Doctors','International Patients','About Us','Contact','WhatsApp Us','العربية','Start Your Enquiry']:
                      if x not in hs: bad.append('EN_LABEL '+rel+' '+x)
          if bad:
              print('\n'.join(bad)); sys.exit(1)
          print('BILINGUAL MASTER HEADER SUPER LOCK: CLEAN')
          PY
          git diff --exit-code -- assets/css/footer-approved.css FOOTER-LOCK.md
      - name: Commit bilingual normalization
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html'
          git commit -m 'Apply locked master header across English and Arabic site'
          git push
