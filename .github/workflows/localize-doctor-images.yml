name: Doctor image verification audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-doctor-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify protected doctor portrait assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          protected = [
              'dr-aditya-gupta',
              'dr-arvind-kumar-khurana',
              'dr-rajneesh-malhotra',
              'dr-ramneek-mahajan',
              'dr-sanjay-gogoi',
          ]
          root = Path('assets/images/doctors')
          missing = []
          for slug in protected:
              matches = [p for p in root.glob(slug + '.*') if p.suffix.lower() in {'.jpg','.jpeg','.png','.webp','.avif'}]
              if matches:
                  print('verified local asset present:', slug, '=>', ', '.join(str(p) for p in matches))
              else:
                  missing.append(slug)
                  print('WARNING: protected portrait missing:', slug)
          if missing:
              print('Protected portrait audit completed with missing assets:', ', '.join(missing))
          else:
              print('All protected local doctor portraits are present.')
          print('This workflow is intentionally read-only. It never deletes or replaces doctor portraits.')
          PY
