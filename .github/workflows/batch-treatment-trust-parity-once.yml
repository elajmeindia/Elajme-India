name: Complete Oman Arabic treatment discovery parity once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/batch-treatment-trust-parity-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align Oman Arabic treatment discovery
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib
          p=Path('ar/oman/treatment-in-india/index.html')
          text=p.read_text(); fi=text.lower().find('<footer'); assert fi>=0
          pre,foot=text[:fi],text[fi:]
          links='''<div class="related"><a href="/ar/treatments/cancer-treatment-india/">علاج السرطان</a><a href="/ar/treatments/heart-treatment-india/">علاج القلب</a><a href="/ar/treatments/liver-transplant-india/">زراعة الكبد</a><a href="/ar/treatments/kidney-transplant-india/">زراعة الكلى</a><a href="/ar/treatments/knee-replacement-india/">استبدال مفصل الركبة</a><a href="/ar/treatments/neurosurgery-india/">جراحة الأعصاب</a><a href="/ar/treatments/spine-surgery-india/">جراحة العمود الفقري</a><a href="/ar/treatments/urology-treatment-india/">المسالك البولية</a><a href="/ar/treatments/gastroenterology-treatment-india/">أمراض الجهاز الهضمي</a><a href="/ar/treatments/">جميع مجالات العلاج</a><a href="/ar/hospitals/">دليل المستشفيات</a><a href="/ar/doctors/">دليل الأطباء</a><a href="/ar/medical-visa/">معلومات التأشيرة الطبية</a><a href="/ar/patient-guide/">دليل المريض الدولي</a><a href="/ar/international-patients/mea/">دعم مرضى الخليج والمرضى الدوليين</a></div>'''
          matches=list(re.finditer(r'<div class="related">.*?</div>',pre,flags=re.S)); assert matches
          m=matches[-1]; new=pre[:m.start()]+links+pre[m.end():]+foot
          assert foot==text[fi:]
          assert 'href="/ar/#enquiry"' in new and 'hreflang="en"' in new and 'hreflang="ar"' in new
          if new!=text: p.write_text(new); print('Changed Oman Arabic discovery section')
          else: print('Oman Arabic discovery section already aligned')
          for q in [Path('FOOTER-LOCK.md'),Path('assets/css/footer-approved.css')]: print('LOCK',q,hashlib.sha256(q.read_bytes()).hexdigest())
          PY
      - name: Commit Oman parity improvement
        run: |
          if git diff --quiet -- ar/oman/treatment-in-india/index.html; then echo 'No changes required'; exit 0; fi
          git config user.name 'elajmeindia'
          git config user.email 'shahzadalamnadwi@gmail.com'
          git add ar/oman/treatment-in-india/index.html
          git commit -m 'Complete Oman Arabic treatment discovery parity'
          git push
