name: Verify exact bilingual language switches sitewide

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/batch-treatment-trust-parity-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact EN AR visible language switches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin,urlparse
          import re,hashlib
          def redirect_only(t): return bool(re.search(r'<meta[^>]+http-equiv=["\']refresh["\']',t,re.I))
          def webpath(s): return '/' if s=='index.html' else ('/'+s[:-10] if s.endswith('index.html') else '/'+s)
          def resolve(current,h):
              h=h.split('#')[0].split('?')[0]
              if h.startswith('https://elajmeindia.com'): return urlparse(h).path
              if h.startswith('/'): return h
              return urlparse(urljoin('https://elajmeindia.com'+webpath(current),h)).path
          pages={}
          for p in Path('.').rglob('index.html'):
              s=str(p).replace('\\','/'); t=p.read_text(errors='ignore')
              if not redirect_only(t): pages[s]=t
          issues=[]; checked=0
          for s,t in sorted(pages.items()):
              cp=('ar/index.html' if s=='index.html' else (s[3:] if s.startswith('ar/') else 'ar/'+s))
              if cp not in pages: continue
              checked+=1; expected=webpath(cp)
              fi=t.lower().find('<footer'); pre=t[:fi] if fi>=0 else t
              candidates=[]
              for m in re.finditer(r'<a\b([^>]*)>(.*?)</a>',pre,re.I|re.S):
                  attrs,label=m.group(1),m.group(2); hm=re.search(r'href=["\']([^"\']+)["\']',attrs,re.I)
                  if not hm: continue
                  clean=re.sub(r'<[^>]+>',' ',label)
                  switch=('shell-lang' in attrs) or (s.startswith('ar/') and re.search(r'English',clean,re.I)) or ((not s.startswith('ar/')) and ('العربية' in clean or re.search(r'Arabic',clean,re.I)))
                  if switch: candidates.append(resolve(s,hm.group(1)))
              if expected not in candidates: issues.append((s,expected,candidates))
          print('Active paired pages checked:',checked)
          print('Exact language-switch issues:',len(issues))
          for x in issues: print('ISSUE',x)
          for p in [Path('FOOTER-LOCK.md'),Path('assets/css/footer-approved.css')]: print('LOCK',p,hashlib.sha256(p.read_bytes()).hexdigest())
          if issues: raise SystemExit('EXACT BILINGUAL LANGUAGE SWITCH AUDIT FAILED')
          print('EXACT BILINGUAL LANGUAGE SWITCH AUDIT CLEAN')
          PY
