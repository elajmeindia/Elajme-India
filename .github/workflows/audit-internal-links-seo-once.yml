name: Audit internal links and SEO once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-internal-links-seo-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit active local links, canonicals and hreflang
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse, unquote
          import re
          root=Path('.'); pages=list(root.rglob('*.html')); problems=[]; checked=0
          def redirect_only(text):
              return bool(re.search(r'<meta[^>]+http-equiv=["\']refresh["\']', text, re.I))
          def target_exists(url, source):
              if not url or url.startswith(('#','mailto:','tel:','javascript:','https://wa.me/')): return True
              p=urlparse(url)
              if p.scheme in ('http','https'):
                  if p.netloc not in ('elajmeindia.com','www.elajmeindia.com'): return True
                  path=unquote(p.path)
              else: path=unquote(p.path)
              if not path: return True
              try:
                  if path.startswith('/'): rel=path.lstrip('/')
                  else: rel=(source.parent/path).resolve().relative_to(root.resolve()).as_posix()
              except ValueError:
                  return False
              q=Path(rel); candidates=[]
              if rel.endswith('/') or not q.suffix: candidates += [root/q/'index.html',root/q,root/(rel+'.html')]
              else: candidates += [root/q]
              return any(c.exists() for c in candidates)
          for page in pages:
              rel=page.as_posix()
              if rel.startswith('.github/') or rel=='404.html': continue
              text=page.read_text(encoding='utf-8',errors='ignore')
              if redirect_only(text): continue
              checked += 1
              for attr,url in re.findall(r'\b(href|src)=["\']([^"\']+)["\']',text,flags=re.I):
                  if not target_exists(url,page): problems.append(f'BROKEN {page}: {attr}={url}')
              canon=re.findall(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)',text,flags=re.I)
              if len(canon)!=1: problems.append(f'CANONICAL_COUNT {page}: {len(canon)}')
              elif not canon[0].startswith('https://elajmeindia.com/'): problems.append(f'CANONICAL_DOMAIN {page}: {canon[0]}')
              langs=re.findall(r'<link[^>]+rel=["\']alternate["\'][^>]+hreflang=["\']([^"\']+)',text,flags=re.I)
              counterpart=(root/'ar'/rel) if not rel.startswith('ar/') else (root/rel[3:])
              if counterpart.exists():
                  missing={'en','ar'}-set(langs)
                  if missing: problems.append(f'HREFLANG {page}: missing {sorted(missing)}')
          print('Active pages checked:',checked)
          print('Blocking issues:',len(problems))
          print('\n'.join(problems) if problems else 'INTERNAL LINKS / SEO ROUTE AUDIT CLEAN')
          if problems: raise SystemExit(f'Audit found {len(problems)} issue(s)')
          PY
      - name: Verify locked UI files remain untouched
        run: |
          test -z "$(git status --porcelain -- assets/css/master-header.css assets/css/arabic-master-header.css assets/css/mobile-header.css assets/css/arabic-mobile-header.css assets/js/mobile-header.js assets/css/footer-approved.css FOOTER-LOCK.md)"

