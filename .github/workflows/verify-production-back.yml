name: Verify production Back spacing
on:
  pull_request:
    paths: ['.github/workflows/verify-production-back.yml', 'scripts/verify-production-back.cjs']
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit playwright@1.56.1 && npx playwright install chromium
      - shell: bash
        run: |
          mkdir -p evidence
          node scripts/verify-production-back.cjs | tee evidence/position.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-back-12-views
          path: evidence/
          retention-days: 7
