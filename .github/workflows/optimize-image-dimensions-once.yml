name: Optimize remaining image dimensions once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-image-dimensions-once.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add intrinsic dimensions to remaining verified provider images
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          targets = {
            'https://www.fortishealthcare.com/azblob/files/styles/experts_image/azblob/doctors/dr-anil--mandhani-1879.jpg?itok=ZyR0xaHZ': (400, 400),
            '/assets/images/doctors/dr-harsh-dua.webp': (600, 600),
            '/assets/images/hospitals/wockhardt.jpg': (1200, 800),
          }
          pages = [
            Path('doctors/index.html'), Path('ar/doctors/index.html'),
            Path('doctors/dr-anil-mandhani/index.html'), Path('ar/doctors/dr-anil-mandhani/index.html'),
            Path('doctors/dr-harsh-dua/index.html'), Path('ar/doctors/dr-harsh-dua/index.html'),
            Path('hospitals/wockhardt-hospital-mumbai-central/index.html'),
            Path('ar/hospitals/wockhardt-hospital-mumbai-central/index.html'),
          ]
          changed=[]
          for p in pages:
            s=p.read_text(encoding='utf-8')
            original=s
            for src,(w,h) in targets.items():
              pat=re.compile(r'(<img\b(?=[^>]*\bsrc=["\']'+re.escape(src)+r'["\'])[^>]*)(>)',re.I)
              def add_dims(m):
                tag=m.group(1)
                if re.search(r'\bwidth\s*=',tag,re.I) and re.search(r'\bheight\s*=',tag,re.I):
                  return m.group(0)
                tag=re.sub(r'\s+width=["\'][^"\']*["\']','',tag,flags=re.I)
                tag=re.sub(r'\s+height=["\'][^"\']*["\']','',tag,flags=re.I)
                return f'{tag} width="{w}" height="{h}"{m.group(2)}'
              s=pat.sub(add_dims,s)
            if s != original:
              p.write_text(s,encoding='utf-8')
              changed.append(str(p))
          print('Updated:', *changed, sep='\n- ')
          PY
      - name: Verify locked header/footer CSS unchanged
        run: |
          test -z "$(git status --porcelain -- assets/css/master-header.css assets/css/arabic-master-header.css assets/css/footer-approved.css FOOTER-LOCK.md)"
      - name: Commit safe dimension hints
        run: |
          if [ -z "$(git status --porcelain -- '*.html')" ]; then
            echo 'No HTML changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add doctors/index.html ar/doctors/index.html doctors/dr-anil-mandhani/index.html ar/doctors/dr-anil-mandhani/index.html doctors/dr-harsh-dua/index.html ar/doctors/dr-harsh-dua/index.html hospitals/wockhardt-hospital-mumbai-central/index.html ar/hospitals/wockhardt-hospital-mumbai-central/index.html
          git commit -m 'Add intrinsic dimensions to remaining provider images'
          git push
