name: Switch live image references to existing WebP assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-heavy-assets-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize-references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch HTML references only when an existing WebP counterpart is present
        shell: bash
        run: |
          set -euo pipefail
          BEFORE_FOOTER=$(sha256sum assets/css/footer-approved.css | cut -d' ' -f1)
          BEFORE_LOCK=$(sha256sum FOOTER-LOCK.md | cut -d' ' -f1)

          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          html_pages = list(root.rglob('*.html'))
          raster_exts = {'.png', '.jpg', '.jpeg'}

          # Build a conservative mapping only where the optimized WebP already
          # exists next to the original. No binary file is created, modified,
          # recompressed, renamed or deleted by this workflow.
          mappings = []
          for src in root.rglob('*'):
              if not src.is_file() or src.suffix.lower() not in raster_exts:
                  continue
              dst = src.with_suffix('.webp')
              if dst.exists() and dst.is_file():
                  mappings.append((src, dst))

          changed_pages = []
          replacements = []

          for page in html_pages:
              text = page.read_text(encoding='utf-8', errors='ignore')
              marker = text.lower().find('<footer')
              head = text if marker < 0 else text[:marker]
              tail = '' if marker < 0 else text[marker:]
              original_head = head

              for src, dst in mappings:
                  src_posix = src.as_posix()
                  dst_posix = dst.as_posix()
                  candidates = {
                      src_posix: dst_posix,
                      '/' + src_posix: '/' + dst_posix,
                      src.name: dst.name,
                      src.name.replace(' ', '%20'): dst.name.replace(' ', '%20'),
                  }
                  for old, new in candidates.items():
                      count = head.count(old)
                      if count:
                          head = head.replace(old, new)
                          replacements.append((page.as_posix(), old, new, count))

              if head != original_head:
                  page.write_text(head + tail, encoding='utf-8')
                  changed_pages.append(page.as_posix())

          print(f'Existing raster→WebP pairs found: {len(mappings)}')
          print(f'HTML pages changed: {len(changed_pages)}')
          for page, old, new, count in replacements:
              print(f'{page}: {old} -> {new} ({count})')
          PY

          AFTER_FOOTER=$(sha256sum assets/css/footer-approved.css | cut -d' ' -f1)
          AFTER_LOCK=$(sha256sum FOOTER-LOCK.md | cut -d' ' -f1)
          test "$BEFORE_FOOTER" = "$AFTER_FOOTER"
          test "$BEFORE_LOCK" = "$AFTER_LOCK"
          if git diff -- assets/css/footer-approved.css FOOTER-LOCK.md | grep .; then
            echo 'Footer lock violation'; exit 1
          fi

      - name: Verify optimized alternatives are used where available
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          raster_exts = {'.png', '.jpg', '.jpeg'}
          remaining = []

          pairs = []
          for src in root.rglob('*'):
              if src.is_file() and src.suffix.lower() in raster_exts:
                  dst = src.with_suffix('.webp')
                  if dst.exists():
                      pairs.append((src, dst))

          for page in root.rglob('*.html'):
              text = page.read_text(encoding='utf-8', errors='ignore')
              marker = text.lower().find('<footer')
              active = text if marker < 0 else text[:marker]
              for src, dst in pairs:
                  needles = {
                      src.as_posix(),
                      '/' + src.as_posix(),
                      src.name,
                      src.name.replace(' ', '%20'),
                  }
                  if any(n in active for n in needles):
                      remaining.append((page.as_posix(), src.as_posix(), dst.as_posix()))

          if remaining:
              for page, src, dst in remaining:
                  print(f'REMAINING: {page}: {src} (WebP exists: {dst})')
              raise SystemExit(f'{len(remaining)} live HTML reference(s) still use an original despite an existing WebP')

          print('PASS: live HTML uses existing WebP counterparts wherever available.')
          PY

      - name: Confirm binary assets were not changed
        shell: bash
        run: |
          if git diff --name-only | grep -Ei '\.(png|jpe?g|webp|gif|avif)$'; then
            echo 'Binary asset changed unexpectedly'; exit 1
          fi

      - name: Commit reference-only performance improvements
        shell: bash
        run: |
          git config user.name 'Elajme India Performance'
          git config user.email 'actions@users.noreply.github.com'
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo 'No HTML references required changing.'
            exit 0
          fi
          git commit -m 'Use existing WebP assets on live pages'
          git push
