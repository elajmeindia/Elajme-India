name: Localize hospital images

# Safety note:
# Hospital facility photos must come from the hospital/provider's official web properties
# or another source that has been manually verified for the exact facility. The previous
# version downloaded FMRI, Fortis Noida and Apollo Navi Mumbai images from third-party
# websites. That behavior is intentionally disabled so a manual workflow run cannot
# overwrite verified/local assets with an uncertain facility image.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Explain hospital image policy
        run: |
          echo 'No images are downloaded by this workflow.'
          echo 'Use only exact-facility images verified against official hospital/provider sources.'
          echo 'Existing local images are preserved until individually re-verified or replaced.'
