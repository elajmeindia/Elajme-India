name: Connect dermatology provider once
on:
  push:
    paths:
      - '.github/workflows/connect-dermatology-provider-once.yml'
permissions:
  contents: write
jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Connect EN and AR dermatology pages
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
            'treatments/dermatology-skin-treatment-india/index.html': (
              '<h2>Explore doctors and hospitals</h2><p class="lead">Browse Elajme India’s doctor and hospital directories. The appropriate doctor or hospital for an individual case depends on the medical records, required specialty and the treating provider’s assessment.</p><div class="related"><a href="/doctors/">Browse doctors</a><a href="/hospitals/">Explore hospitals</a><a href="/#enquiry">Request case coordination through Elajme India</a></div>',
              '<h2>Verified dermatology doctor and hospital pathway</h2><p class="lead">For skin, hair or nail concerns, Elajme India can coordinate record review with Dr. Sandip Agnihotri and the dermatology team at Indraprastha Apollo Hospitals, Delhi. Doctor association, availability and suitability are reconfirmed for each case.</p><div class="related"><a href="/doctors/dr-sandip-agnihotri/">Dr. Sandip Agnihotri · Dermatology</a><a href="/hospitals/indraprastha-apollo-hospital-delhi/">Indraprastha Apollo Hospital · Dermatology</a><a href="/doctors/">Browse more doctors</a><a href="/hospitals/">Explore more hospitals</a><a href="/#enquiry">Request case coordination through Elajme India</a></div>'
            ),
            'ar/treatments/dermatology-skin-treatment-india/index.html': (
              '<h2>استكشف الأطباء والمستشفيات</h2><p class="lead">يمكنك استعراض دليل علاج مي إنديا للأطباء والمستشفيات. يعتمد اختيار الطبيب أو المستشفى المناسب للحالة على مراجعة التقارير الطبية والتخصص المطلوب وتقييم الجهة المعالجة.</p><div class="related"><a href="/ar/doctors/">استعرض الأطباء</a><a href="/ar/hospitals/">استعرض المستشفيات</a><a href="/ar/#enquiry">اطلب تنسيق حالتك عبر علاج مي إنديا</a></div>',
              '<h2>طبيب ومستشفى موثقان للأمراض الجلدية</h2><p class="lead">لحالات الجلد والشعر والأظافر، يمكن لعلاج مي إنديا تنسيق مراجعة التقارير مع د. سانديب أجنيهوتري وفريق الأمراض الجلدية في مستشفى إندرابراستا أبولو، دلهي. يتم إعادة تأكيد ارتباط الطبيب وتوفره ومدى ملاءمته لكل حالة.</p><div class="related"><a href="/ar/doctors/dr-sandip-agnihotri/">د. سانديب أجنيهوتري · الأمراض الجلدية</a><a href="/ar/hospitals/indraprastha-apollo-hospital-delhi/">مستشفى إندرابراستا أبولو · الأمراض الجلدية</a><a href="/ar/doctors/">استعرض المزيد من الأطباء</a><a href="/ar/hospitals/">استعرض المزيد من المستشفيات</a><a href="/ar/#enquiry">اطلب تنسيق حالتك عبر علاج مي إنديا</a></div>'
            )
          }
          for fn,(old,new) in replacements.items():
              p=Path(fn); s=p.read_text()
              if old not in s: raise SystemExit(f'marker missing: {fn}')
              p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add treatments/dermatology-skin-treatment-india/index.html ar/treatments/dermatology-skin-treatment-india/index.html
          git commit -m 'Connect dermatology treatment to verified provider profiles'
          git push
