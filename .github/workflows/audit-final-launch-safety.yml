name: Audit final launch safety

# Final production safety rerun after metadata and accessibility gate passed.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-final-launch-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit forms conversion analytics privacy and security
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys

          root=Path('.')
          pages=list(root.rglob('*.html'))
          blocking=[]; warnings=[]
          owned_phone='917488955154'

          for p in pages:
              s=p.read_text(errors='ignore')
              low=s.lower()
              if 'http-equiv="refresh"' in low or "http-equiv='refresh'" in low:
                  continue
              ar=p.as_posix().startswith('ar/')
              for href in re.findall(r'href=["\']([^"\']+)',s,re.I):
                  h=href.lower()
                  if h.startswith(('tel:','https://wa.me/','http://wa.me/','https://api.whatsapp.com/','http://api.whatsapp.com/')):
                      digits=''.join(re.findall(r'\d',href))
                      if digits and owned_phone not in digits:
                          blocking.append(f'NON_ELAJME_CONTACT {p}: {href}')
              for tag in re.findall(r'<form\b[^>]*>',s,re.I):
                  m=re.search(r'action=["\']([^"\']*)',tag,re.I)
                  if m:
                      action=m.group(1).strip()
                      if action.startswith('http://'):
                          blocking.append(f'INSECURE_FORM_ACTION {p}: {action}')
                  if 'method="get"' in tag.lower() or "method='get'" in tag.lower():
                      warnings.append(f'GET_FORM_REVIEW {p}')
              if re.search(r'(?:src|href)=["\']http://',s,re.I):
                  blocking.append(f'MIXED_CONTENT {p}')
              if '<form' in low and 'privacy' not in low:
                  warnings.append(f'FORM_WITHOUT_PRIVACY_REFERENCE {p}')
              if ar and re.search(r'href=["\']/#enquiry["\']',s,re.I):
                  blocking.append(f'AR_ENQUIRY_TO_EN_HOME {p}')

          if not (root/'privacy.html').is_file(): warnings.append('MISSING_EN_PRIVACY_PAGE')
          if not (root/'ar/privacy.html').is_file(): warnings.append('MISSING_AR_PRIVACY_PAGE')
          if not (root/'robots.txt').is_file(): blocking.append('MISSING_ROBOTS_TXT')
          if not (root/'sitemap.xml').is_file(): blocking.append('MISSING_SITEMAP')

          secret_patterns=[
              r'BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY',
              r'(?i)aws_secret_access_key\s*[=:]',
              r"(?i)api[_-]?key\s*[=:]\s*[\"'][A-Za-z0-9_-]{20,}"
          ]
          for p in root.rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.suffix.lower() not in {'.html','.js','.json','.yml','.yaml','.txt','.md','.env'}: continue
              try: t=p.read_text(errors='ignore')
              except Exception: continue
              if any(re.search(x,t) for x in secret_patterns): blocking.append(f'POTENTIAL_SECRET {p}')

          print('FINAL LAUNCH SAFETY AUDIT')
          print('HTML pages checked:',len(pages))
          print('Blocking issues:',len(blocking))
          for x in blocking[:100]: print('BLOCK',x)
          print('Review warnings:',len(warnings))
          for x in warnings[:150]: print('WARN',x)
          if blocking: sys.exit(1)
          PY
      - name: Verify approved header footer baseline remains untouched
        run: |
          test -z "$(git status --porcelain -- assets/css/master-header.css assets/css/arabic-master-header.css assets/css/mobile-header.css assets/css/arabic-mobile-header.css assets/js/mobile-header.js assets/css/footer-approved.css FOOTER-LOCK.md)"
