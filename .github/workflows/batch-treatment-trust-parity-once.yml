name: Add bilingual patient guide preparation section once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/batch-treatment-trust-parity-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add patient preparation guidance
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          blocks={
          'patient-guide/index.html': '<section class="sec"><div class="c"><h2>Preparing information for a hospital review</h2><p>Organising the available records can make the initial case review easier. Patients can start with a short summary of the medical problem, the diagnosis if known, recent relevant reports, previous treatment information and a current medicine list.</p><p>Relevant records may include laboratory results, imaging reports, pathology reports, discharge summaries and notes from major previous procedures. The exact information needed depends on the individual case, and the hospital or specialist may request additional documents after the first review.</p><p>You do not need to delay an initial enquiry because every record is not available. Start with the information you have and keep the documents clearly labelled where possible.</p></div></section>',
          'ar/patient-guide/index.html': '<section class="sec"><div class="c"><h2>تجهيز المعلومات قبل مراجعة المستشفى</h2><p>يساعد تنظيم السجلات المتوفرة على تسهيل المراجعة الأولية للحالة. يمكن للمريض البدء بملخص قصير للمشكلة الطبية والتشخيص إن كان معروفاً والتقارير الحديثة ذات الصلة ومعلومات العلاج السابق وقائمة الأدوية الحالية.</p><p>قد تشمل السجلات المهمة نتائج التحاليل وتقارير الأشعة وتقارير الباثولوجي وملخصات الخروج من المستشفى وتقارير الإجراءات أو العمليات السابقة المهمة. وتختلف المعلومات المطلوبة حسب كل حالة، وقد يطلب المستشفى أو الطبيب مستندات إضافية بعد المراجعة الأولى.</p><p>لا يلزم تأخير الاستفسار الأولي بسبب عدم توفر جميع السجلات. ابدأ بالمعلومات المتاحة لديك، وحاول ترتيب المستندات وتسميتها بوضوح قدر الإمكان.</p></div></section>'}
          changed=[]
          for fn,block in blocks.items():
              p=Path(fn); text=p.read_text(); fi=text.lower().find('<footer'); assert fi>=0
              pre,foot=text[:fi],text[fi:]
              marker='Preparing information for a hospital review' if not fn.startswith('ar/') else 'تجهيز المعلومات قبل مراجعة المستشفى'
              if marker in pre: continue
              assert '</main>' in pre
              new=pre.replace('</main>',block+'</main>',1)+foot
              assert foot==text[fi:]
              p.write_text(new); changed.append(fn)
          print('Changed:',changed)
          for p in [Path('FOOTER-LOCK.md'),Path('assets/css/footer-approved.css')]: print('LOCK',p,hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Commit patient guide improvements
        run: |
          if git diff --quiet -- patient-guide/index.html ar/patient-guide/index.html; then echo 'No changes required'; exit 0; fi
          git config user.name 'elajmeindia'
          git config user.email 'shahzadalamnadwi@gmail.com'
          git add patient-guide/index.html ar/patient-guide/index.html
          git commit -m 'Add bilingual patient preparation guidance'
          git push
