name: PR 477 live bilingual allergy verification
on:
  pull_request:
    paths: ['.github/workflows/verify-live-pr477.yml', 'scripts/verify-live-pr477.cjs']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit playwright@1.56.1 && npx playwright install chromium
      - shell: bash
        run: |
          mkdir -p evidence
          node scripts/verify-live-pr477.cjs | tee evidence/results.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr477-live-bilingual-verification
          path: evidence/
          retention-days: 7
