name: Audit final prelaunch technical readiness once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-prelaunch-technical-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit sitemap robots metadata schema and conversion endpoints
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, xml.etree.ElementTree as ET

          root=Path('.')
          problems=[]; warnings=[]
          for f in ('index.html','robots.txt','sitemap.xml','404.html'):
              if not (root/f).exists(): problems.append(f'MISSING_CORE_FILE {f}')
          rp=root/'robots.txt'
          if rp.exists():
              r=rp.read_text(errors='ignore')
              if re.search(r'(?im)^\s*disallow\s*:\s*/\s*$',r): problems.append('ROBOTS_BLOCKS_SITE')
              if 'sitemap' not in r.lower(): problems.append('ROBOTS_MISSING_SITEMAP')
          sp=root/'sitemap.xml'
          if sp.exists():
              try:
                  ET.parse(sp); xml=sp.read_text(errors='ignore')
                  locs=re.findall(r'<loc>\s*([^<]+)',xml,re.I)
                  if not locs: problems.append('SITEMAP_NO_URLS')
                  bad=[u for u in locs if not u.startswith('https://elajmeindia.com/')]
                  if bad: problems.append(f'SITEMAP_NON_PRODUCTION_URLS {len(bad)}')
                  if not any('/ar/' in u or u.rstrip('/').endswith('/ar') for u in locs): problems.append('SITEMAP_MISSING_AR_URLS')
              except Exception as e: problems.append(f'SITEMAP_XML_INVALID {e}')
          active=[]
          for p in root.rglob('*.html'):
              s=p.as_posix()
              if s.startswith('.github/'): continue
              text=p.read_text(errors='ignore')
              if re.search(r'<meta[^>]+http-equiv=["\']refresh["\']',text,re.I): continue
              active.append((p,text))
          for p,text in active:
              pre=text[:text.lower().find('<footer')] if '<footer' in text.lower() else text
              low=pre.lower()
              if p.name=='index.html':
                  canon=re.findall(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)',text,re.I)
                  if len(canon)!=1: problems.append(f'CANONICAL_COUNT {p}: {len(canon)}')
                  elif not canon[0].startswith('https://elajmeindia.com/'): problems.append(f'CANONICAL_DOMAIN {p}: {canon[0]}')
              if '<meta name="viewport"' not in low and "<meta name='viewport'" not in low:
                  warnings.append(f'MISSING_VIEWPORT {p}')
              for action in re.findall(r'<form[^>]+action=["\']([^"\']+)',pre,re.I):
                  if action.startswith('http') and 'elajmeindia.com' not in action:
                      problems.append(f'EXTERNAL_FORM_ACTION {p}: {action}')
              if re.match(r'^(ar/)?(doctors|hospitals)/[^/]+/index\.html$',p.as_posix()):
                  expected='/ar/#enquiry' if p.as_posix().startswith('ar/') else '/#enquiry'
                  if expected not in pre: problems.append(f'PROFILE_ENQUIRY {p}: {expected}')
          home=(root/'index.html').read_text(errors='ignore') if (root/'index.html').exists() else ''
          for token,label in [('og:title','HOME_MISSING_OG_TITLE'),('og:description','HOME_MISSING_OG_DESCRIPTION'),('og:image','HOME_MISSING_OG_IMAGE')]:
              if token not in home.lower(): warnings.append(label)
          if not re.search(r'<link[^>]+rel=["\'][^"\']*(icon|shortcut icon)',home,re.I): warnings.append('HOME_MISSING_FAVICON')
          if 'application/ld+json' not in home.lower(): warnings.append('HOME_MISSING_STRUCTURED_DATA')
          print(f'Active pages checked: {len(active)}')
          print(f'Blocking issues: {len(problems)}')
          print(f'Review warnings: {len(warnings)}')
          if warnings: print('--- WARNINGS ---'); print('\n'.join(warnings))
          if problems: print('--- BLOCKING ---'); print('\n'.join(problems)); raise SystemExit(1)
          print('PRELAUNCH TECHNICAL BLOCKING CHECKS CLEAN')
          PY
      - name: Verify locked footer files remain untouched
        run: |
          test -z "$(git status --porcelain -- assets/css/footer-approved.css FOOTER-LOCK.md)"
# audit-trigger: post-seo-growth-final-gate-2026-10-31
