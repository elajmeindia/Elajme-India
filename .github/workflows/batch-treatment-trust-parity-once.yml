name: Strengthen Medanta and Soin enquiry pathways once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/batch-treatment-trust-parity-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strengthen bilingual Medanta and Soin enquiry paths
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          changes = {
            'hospitals/medanta-the-medicity-gurugram/index.html': (
              '<p><strong>Consultation requests submitted through this page are coordinated only through Elajme India.</strong></p><h2>Related doctor profile</h2>',
              '<p><strong>Consultation requests submitted through this page are coordinated only through Elajme India.</strong></p><h2>What happens after you enquire?</h2><p>Share the available medical summary and relevant reports with Elajme India. We can coordinate a preliminary case-review request with the relevant hospital team and help clarify the next practical step. Case acceptance, specialist availability, treatment plans and estimates remain subject to hospital review.</p><p class="links"><a href="/#enquiry">Share reports / start an Elajme India enquiry</a><a href="../../patient-guide/">See the international patient guide</a></p><h2>Related doctor profile</h2>'
            ),
            'ar/hospitals/medanta-the-medicity-gurugram/index.html': (
              '<p><strong>تُنسق جميع طلبات الاستشارة الواردة من هذه الصفحة حصريًا عبر علاج مي إنديا.</strong></p><h2>ملف طبيب ذي صلة</h2>',
              '<p><strong>تُنسق جميع طلبات الاستشارة الواردة من هذه الصفحة حصريًا عبر علاج مي إنديا.</strong></p><h2>ماذا يحدث بعد إرسال الاستفسار؟</h2><p>شارك الملخص الطبي والتقارير المتاحة مع علاج مي إنديا. يمكننا تنسيق طلب مراجعة أولية للحالة مع فريق المستشفى المعني ومساعدتك على فهم الخطوة العملية التالية. يبقى قبول الحالة وتوفر الاختصاصي وخطة العلاج والتكلفة التقديرية خاضعاً لمراجعة المستشفى.</p><p class="links"><a href="/ar/#enquiry">أرسل التقارير / ابدأ استفسارك عبر علاج مي إنديا</a><a href="/ar/patient-guide/">دليل المريض الدولي</a></p><h2>ملف طبيب ذي صلة</h2>'
            ),
            'doctors/dr-arvinder-singh-soin/index.html': (
              '<p><strong>All consultation enquiries submitted from this profile are coordinated only through Elajme India.</strong></p><div class="profile-links"><a href="/#enquiry">Submit medical reports / start an enquiry</a></div>',
              '<p><strong>All consultation enquiries submitted from this profile are coordinated only through Elajme India.</strong></p><h2>What happens after you enquire?</h2><p>Share the available medical summary and relevant liver or transplant reports with Elajme India. We can coordinate the consultation or case-review request with the relevant hospital team and help clarify the next practical step. Transplant eligibility, donor suitability, case acceptance and treatment decisions remain subject to qualified transplant teams and applicable requirements.</p><div class="profile-links"><a href="/#enquiry">Share reports / start an Elajme India enquiry</a><a href="/patient-guide/">See the international patient guide</a></div>'
            ),
            'ar/doctors/dr-arvinder-singh-soin/index.html': (
              '<p><strong>يتم تنسيق جميع طلبات الاستشارة المقدمة من هذه الصفحة حصراً عبر علاج مي إنديا.</strong></p><div class="profile-links"><a href="/ar/#enquiry">إرسال التقارير الطبية / بدء الاستفسار</a></div>',
              '<p><strong>يتم تنسيق جميع طلبات الاستشارة المقدمة من هذه الصفحة حصراً عبر علاج مي إنديا.</strong></p><h2>ماذا يحدث بعد إرسال الاستفسار؟</h2><p>شارك الملخص الطبي وتقارير الكبد أو الزراعة المتاحة مع علاج مي إنديا. يمكننا تنسيق طلب الاستشارة أو مراجعة الحالة مع فريق المستشفى المعني ومساعدتك على فهم الخطوة العملية التالية. تبقى أهلية الزراعة وملاءمة المتبرع وقبول الحالة والقرارات العلاجية خاضعة لفرق الزراعة المؤهلة والمتطلبات المعمول بها.</p><div class="profile-links"><a href="/ar/#enquiry">أرسل التقارير / ابدأ استفسارك عبر علاج مي إنديا</a><a href="/ar/patient-guide/">دليل المريض الدولي</a></div>'
            )
          }
          changed=[]
          for fn,(old,new) in changes.items():
              p=Path(fn); text=p.read_text(); fi=text.lower().find('<footer'); assert fi>=0
              pre,foot=text[:fi],text[fi:]
              if new in pre:
                  print('Already strengthened:',fn); continue
              assert old in pre, f'expected conversion anchor not found in {fn}'
              p.write_text(pre.replace(old,new,1)+foot); changed.append(fn)
              print('Changed:',fn)
          for q in [Path('FOOTER-LOCK.md'),Path('assets/css/footer-approved.css')]: print('LOCK',q,hashlib.sha256(q.read_bytes()).hexdigest())
          print('Changed files:',len(changed))
          PY
      - name: Commit Medanta and Soin conversion improvements
        run: |
          if git diff --quiet -- hospitals/medanta-the-medicity-gurugram/index.html ar/hospitals/medanta-the-medicity-gurugram/index.html doctors/dr-arvinder-singh-soin/index.html ar/doctors/dr-arvinder-singh-soin/index.html; then echo 'No changes required'; exit 0; fi
          git config user.name 'elajmeindia'
          git config user.email 'shahzadalamnadwi@gmail.com'
          git add hospitals/medanta-the-medicity-gurugram/index.html ar/hospitals/medanta-the-medicity-gurugram/index.html doctors/dr-arvinder-singh-soin/index.html ar/doctors/dr-arvinder-singh-soin/index.html
          git commit -m 'Strengthen Medanta and Soin enquiry pathways'
          git push
