name: Directory spacing visual baseline
on:
  pull_request:
    paths:
      - 'treatments/index.html'
      - 'ar/treatments/index.html'
      - 'doctors/index.html'
      - 'ar/doctors/index.html'
      - 'hospitals/index.html'
      - 'ar/hospitals/index.html'
      - '.github/workflows/directory-spacing-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture bilingual responsive screenshots and check overflow
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/elajme-spacing-server.log 2>&1 &
          mkdir -p spacing-evidence
          node <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const pages = ['treatments/','ar/treatments/','doctors/','ar/doctors/','hospitals/','ar/hospitals/'];
            const viewports = [{width:390,height:844},{width:768,height:1024},{width:1363,height:936}];
            let errors = [];
            for (const pageName of pages) {
              for (const viewport of viewports) {
                const page = await browser.newPage({viewport,deviceScaleFactor:1});
                const url = 'http://127.0.0.1:8765/' + pageName;
                await page.goto(url,{waitUntil:'networkidle'});
                await page.screenshot({path:'spacing-evidence/'+pageName.replaceAll('/','-')+viewport.width+'.png',fullPage:true,animations:'disabled'});
                const result = await page.evaluate(() => ({
                  viewport:document.documentElement.clientWidth,
                  scroll:document.documentElement.scrollWidth,
                  hero:document.querySelector('.hero')?.getBoundingClientRect().height,
                  sections:[...document.querySelectorAll('.sec')].map(e=>Math.round(e.getBoundingClientRect().height)),
                  heroOverlays:(() => {
                    const hero=document.querySelector('.hero');
                    if(!hero)return [];
                    const h=hero.getBoundingClientRect();
                    const text=[...hero.querySelectorAll('p,h1,h2,.lead')].filter(e=>e.getClientRects().length);
                    return [...document.querySelectorAll('body *')].filter(e=>{
                      const style=getComputedStyle(e);
                      if(style.position!=='fixed' || style.visibility==='hidden'||style.display==='none')return false;
                      const b=e.getBoundingClientRect();
                      return b.width>0&&b.height>0&&b.right>h.left&&b.left<h.right&&b.bottom>h.top&&b.top<h.bottom;
                    }).slice(0,20).map(e=>{
                      const b=e.getBoundingClientRect();
                      const overlappingText=text.filter(t=>{const q=t.getBoundingClientRect();return b.left<q.right&&b.right>q.left&&b.top<q.bottom&&b.bottom>q.top;});
                      return {tag:e.tagName,id:e.id,classes:String(e.className).slice(0,100),text:e.innerText?.slice(0,70),rect:[Math.round(b.x),Math.round(b.y),Math.round(b.width),Math.round(b.height)],overlappingText:overlappingText.map(t=>t.innerText.slice(0,75))};
                    });
                  })()
                }));
                if(viewport.width===390 && /(?:doctors|hospitals)\/$/.test(pageName)) {
                  const filterCheck=await page.evaluate(() => {
                    const input=document.querySelector('#q');
                    const city=document.querySelector('#city');
                    const cards=[...document.querySelectorAll('.grid .card')];
                    const before=cards.filter(e=>e.getClientRects().length>0).length;
                    if(input){
                      input.value='zzzxxyy-no-match';
                      input.dispatchEvent(new Event('input',{bubbles:true}));
                    }
                    const after=cards.filter(e=>e.getClientRects().length>0).length;
                    if(input){
                      input.value='';
                      input.dispatchEvent(new Event('input',{bubbles:true}));
                    }
                    const restored=cards.filter(e=>e.getClientRects().length>0).length;
                    return {hasSearch:!!input,hasCity:!!city,cards:cards.length,before,after,restored};
                  });
                  console.log('FILTER_CHECK',pageName,JSON.stringify(filterCheck));
                  if(filterCheck.cards && filterCheck.hasSearch && (filterCheck.after!==0||filterCheck.restored!==filterCheck.before))errors.push(pageName+': search filter did not hide/restore all cards');
                }
                console.log(pageName,viewport.width,JSON.stringify(result));
                if(result.scroll > result.viewport+2)errors.push(pageName+' at '+viewport.width+': horizontal overflow '+result.scroll);
                await page.close();
              }
            }
            await browser.close();
            if(errors.length){console.error(errors.join('\n'));process.exitCode=1;}
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: directory-spacing-baseline-screenshots
          path: spacing-evidence/
          retention-days: 14
