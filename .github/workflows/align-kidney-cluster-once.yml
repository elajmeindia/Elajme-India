name: Align urology cluster parity once
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/align-kidney-cluster-once.yml'
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align Arabic urology links with English
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ar/treatments/urology-treatment-india/index.html')
          s=p.read_text()
          old='<h2>استكشف الأطباء والمستشفيات</h2><p class="muted">هذه الروابط للمساعدة في الاستكشاف والتنسيق ولا تمثل تصنيفاً أو توصية طبية.</p><div class="related"><a href="/ar/doctors/">الأطباء</a><a href="/ar/hospitals/">المستشفيات</a><a href="../kidney-transplant-india/">تنسيق زراعة الكلى</a></div><h2>هل الحالة تتعلق بزراعة الكلى؟</h2>'
          new='<h2>استكشف الأطباء والمستشفيات ذوي الصلة</h2><p class="muted">هذه الروابط للمساعدة في الاستكشاف والتنسيق ولا تمثل تصنيفاً أو توصية طبية.</p><div class="related"><a href="/ar/doctors/dr-anant-kumar/">د. أنانت كومار</a><a href="/ar/doctors/dr-sanjay-gogoi/">د. سانجاي غوغوي</a><a href="/ar/doctors/dr-anil-mandhani/">د. أنيل مانداني</a><a href="/ar/doctors/">دليل الأطباء</a><a href="/ar/hospitals/max-super-speciality-hospital-saket/">ماكس ساكيت</a><a href="/ar/hospitals/fortis-hospital-noida/">فورتيس نويدا</a><a href="/ar/hospitals/apollo-hospitals-navi-mumbai/">أبولو نافي مومباي</a><a href="/ar/hospitals/">دليل المستشفيات</a></div><h2>هل الحالة تتعلق بزراعة الكلى؟</h2>'
          if old not in s:
              raise SystemExit('Expected urology related-links block not found')
          before=s.split('<footer',1)[1]
          s=s.replace(old,new,1)
          after=s.split('<footer',1)[1]
          if before != after:
              raise SystemExit('Footer changed')
          p.write_text(s)
          PY
      - name: Commit content update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ar/treatments/urology-treatment-india/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Align urology specialist and hospital links'
          git push
