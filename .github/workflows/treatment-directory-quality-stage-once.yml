name: Treatment directory quality stage once
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/treatment-directory-quality-stage-once.yml'
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit treatment pages for template residue, parity and routing
        shell: python
        run: |
          from pathlib import Path
          import re, sys
          en_root=Path('treatments'); ar_root=Path('ar/treatments')
          en_pages={p.parent.name:p for p in en_root.glob('*/index.html')}
          ar_pages={p.parent.name:p for p in ar_root.glob('*/index.html')}
          issues=[]
          for slug,p in sorted(en_pages.items()):
            if slug not in ar_pages: issues.append(f'Missing Arabic counterpart: {slug}')
            s=p.read_text(encoding='utf-8')
            if slug!='pediatrics-child-health-india' and re.search(r'\b(pediatric|child|parent|guardian|vaccination)\b',s,re.I): issues.append(f'Pediatric residue EN: {slug}')
            if '<h1' not in s.lower(): issues.append(f'Missing H1 EN: {slug}')
            if 'elajmeindia.com' not in s: issues.append(f'Missing Elajme production reference EN: {slug}')
          for slug,p in sorted(ar_pages.items()):
            if slug not in en_pages: issues.append(f'Missing English counterpart: {slug}')
            s=p.read_text(encoding='utf-8')
            if slug!='pediatrics-child-health-india' and re.search(r'(طب الأطفال|الطفل|والد الطفل|الوصي القانوني|سجل التطعيم)',s): issues.append(f'Pediatric residue AR: {slug}')
            if '<h1' not in s.lower(): issues.append(f'Missing H1 AR: {slug}')
          print(f'English treatment pages: {len(en_pages)}')
          print(f'Arabic treatment pages: {len(ar_pages)}')
          if issues:
            print('\n'.join(issues)); sys.exit(1)
          print('Treatment-page bilingual/template quality audit clean')
      - name: Verify directory and sitemap coverage
        shell: python
        run: |
          from pathlib import Path
          import sys
          en=Path('treatments/index.html').read_text(encoding='utf-8')
          ar=Path('ar/treatments/index.html').read_text(encoding='utf-8')
          sm=Path('sitemap.xml').read_text(encoding='utf-8')
          slugs=sorted(p.parent.name for p in Path('treatments').glob('*/index.html'))
          issues=[]
          for slug in slugs:
            if f'{slug}/' not in en: issues.append(f'EN directory missing {slug}')
            if f'{slug}/' not in ar: issues.append(f'AR directory missing {slug}')
            if f'https://elajmeindia.com/treatments/{slug}/' not in sm: issues.append(f'Sitemap EN missing {slug}')
            if f'https://elajmeindia.com/ar/treatments/{slug}/' not in sm: issues.append(f'Sitemap AR missing {slug}')
          if issues:
            print('\n'.join(issues)); sys.exit(1)
          print(f'Directory and sitemap coverage clean for {len(slugs)} treatment routes')
      - name: Protect approved global UI
        run: git diff --exit-code assets/css/master-header.css assets/css/arabic-master-header.css assets/css/mobile-header.css assets/css/arabic-mobile-header.css assets/js/mobile-header.js assets/css/footer-approved.css FOOTER-LOCK.md
