name: Audit international positioning phase 4
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-country-positioning-phase4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Audit country positioning and Nigeria parity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          en=Path('index.html').read_text()
          ar=Path('ar/index.html').read_text()
          nigeria=Path('nigeria/treatment-in-india/index.html').read_text()
          nigeria_ar=Path('ar/nigeria/treatment-in-india/index.html').read_text()
          hub=Path('international-patients/mea/index.html').read_text()
          assert '/nigeria/treatment-in-india/' in en
          assert 'Dedicated patient pages' in en
          assert 'international patient' in en.lower()
          assert 'Nigeria' in en
          assert 'rel="canonical"' in nigeria and 'hreflang="en"' in nigeria and 'hreflang="ar"' in nigeria and 'hreflang="x-default"' in nigeria
          assert '/#enquiry' in nigeria
          assert '/assets/css/footer-approved.css' in nigeria
          assert 'lang="ar"' in ar and 'dir="rtl"' in ar
          assert '/ar/nigeria/treatment-in-india/' in ar
          assert 'نيجيريا' in ar
          assert '/assets/css/footer-approved.css' in ar
          assert 'lang="ar"' in nigeria_ar and 'dir="rtl"' in nigeria_ar
          assert '/ar/#enquiry' in nigeria_ar
          assert 'hreflang="en"' in nigeria_ar and 'hreflang="ar"' in nigeria_ar and 'hreflang="x-default"' in nigeria_ar
          assert 'Nigeria' in hub and 'Africa' in hub and 'International' in hub
          assert '../../nigeria/treatment-in-india/' in hub
          assert '/assets/css/footer-approved.css' in hub
          print('PHASE 4 INTERNATIONAL POSITIONING AUDIT CLEAN')
          PY
# corrected assertions after bilingual homepage positioning repair 2026-11-01
# trigger corrected phase 4 audit 2026-11-01
