name: Localize verified hospital images

# Localizes only exact-facility images from first-party hospital/provider sources.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/localize-hospital-images.yml'

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install image dependencies
        run: python3 -m pip install --quiet pillow requests

      - name: Localize exact verified facility images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images/hospitals /tmp/elajme-hospitals
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import io, zipfile, requests, re

          UA={'User-Agent':'Mozilla/5.0 (compatible; ElajmeIndiaImageVerifier/1.1)'}
          OUT=Path('assets/images/hospitals')

          def save_image(asset, data, source):
              im=Image.open(io.BytesIO(data)); im.verify()
              im=Image.open(io.BytesIO(data)); w,h=im.size
              if w < 350 or h < 220:
                  raise ValueError(f'image too small: {w}x{h}')
              ext={'JPEG':'.jpg','PNG':'.png','WEBP':'.webp'}.get((im.format or '').upper())
              if not ext: raise ValueError(f'unsupported format {im.format}')
              for old in OUT.glob(asset+'.*'): old.unlink()
              dest=OUT/(asset+ext); dest.write_bytes(data)
              print('localized',asset,source,'->',dest,w,h)
              return dest

          # Exact image exposed by the official Gleneagles Parel About page as
          # “Mumbai Hospitals Image 370x326px”. The CDN is the hospital site's
          # own managed Frontify media source referenced by that page.
          gleneagles='https://cdn-assets-eu.frontify.com/s3/frontify-enterprise-files-eu/eyJvYXV0aCI6eyJjbGllbnRfaWQiOiJjbGllbnQtY2hkcnR4NWphaHV0Y2hsdiJ9LCJwYXRoIjoiaWhoLWhlYWx0aGNhcmUtYmVyaGFkXC9maWxlXC9MejNreFloVnZ0V1JWTWJYNGI5Ti5qcGcifQ%3Aihh-healthcare-berhad%3AbdsF7grt2weDNfX-CTG3F7j3cTl58Rmy0YIz8nJ5HAw?crop=fp&fp=0.5%2C0.5&fp_zoom=1&height=326&width=370'
          try:
              r=requests.get(gleneagles,headers=UA,timeout=45); r.raise_for_status()
              save_image('gleneagles-parel',r.content,gleneagles)
          except Exception as e: print('Gleneagles exact image failed:',e)

          # Official Kokilaben press-kit archives. Choose a landscape/near-landscape
          # building/exterior candidate from each facility-specific archive; reject
          # logos, people, interiors and small assets.
          zips=[
            ('kokilaben-mumbai','https://kdahweb-static.kokilabenhospital.com/downloads/KDAH_Hospital.zip'),
            ('kokilaben-navi-mumbai','https://s3.us-west-2.amazonaws.com/kdahweb-static.kokilabenhospital.com/kdah-2019/navimumbai/hospital-building.zip'),
          ]
          for asset,url in zips:
              try:
                  r=requests.get(url,headers=UA,timeout=60); r.raise_for_status()
                  z=zipfile.ZipFile(io.BytesIO(r.content)); candidates=[]
                  for name in z.namelist():
                      low=name.lower()
                      if not re.search(r'\.(jpe?g|png|webp)$',low): continue
                      if any(x in low for x in ('logo','doctor','people','patient','room','icu','ot','interior','reception','lobby')): continue
                      try:
                          data=z.read(name); im=Image.open(io.BytesIO(data)); w,h=im.size
                          if w<600 or h<300: continue
                          score=(w*h/100000)+(25 if w>=h else 0)
                          if any(x in low for x in ('hospital','building','exterior','outdoor','front','main','entrance','kdah')): score+=80
                          candidates.append((score,name,data,w,h))
                      except Exception: pass
                  if not candidates:
                      print('No safe press-kit building image for',asset); continue
                  candidates.sort(reverse=True)
                  score,name,data,w,h=candidates[0]
                  save_image(asset,data,url+' :: '+name)
              except Exception as e: print(asset,'archive failed:',e)

          # Keep the already verified official Reliance Tower asset untouched.
          PY

      - name: Wire local images into English and Arabic profiles and directories
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          targets={
            'gleneagles-hospital-parel-mumbai':('gleneagles-parel','Gleneagles Hospital, Parel, Mumbai'),
            'kokilaben-dhirubhai-ambani-hospital-mumbai':('kokilaben-mumbai','Kokilaben Dhirubhai Ambani Hospital, Mumbai'),
            'kokilaben-dhirubhai-ambani-hospital-navi-mumbai':('kokilaben-navi-mumbai','Kokilaben Dhirubhai Ambani Hospital, Navi Mumbai'),
            'sir-hn-reliance-foundation-hospital-mumbai':('sir-hn-reliance-mumbai','Sir H. N. Reliance Foundation Hospital and Research Centre, Mumbai'),
          }
          for slug,(asset,alt) in targets.items():
              matches=list(Path('assets/images/hospitals').glob(asset+'.*'))
              if len(matches)!=1:
                  print('Skipping; no unique verified asset for',slug); continue
              src='/'+matches[0].as_posix()
              img=f'<img class="hospital-profile-image" src="{src}" alt="{alt}" loading="eager" decoding="async" style="width:100%;height:100%;min-height:240px;max-height:380px;object-fit:cover;border-radius:18px">'
              for page in (Path('hospitals')/slug/'index.html',Path('ar/hospitals')/slug/'index.html'):
                  if not page.exists(): continue
                  text=page.read_text(encoding='utf-8'); new=text
                  patterns=[
                    r'<div[^>]+class="[^"]*hospital-image-pending[^"]*"[^>]*>.*?</div>',
                    r'<div[^>]+class="[^"]*hospital-visual[^"]*"[^>]*>.*?</div>',
                    r'<div[^>]+class="[^"]*box note[^"]*"[^>]+role="img"[^>]*>.*?</div>',
                  ]
                  for pat in patterns:
                      new,n=re.subn(pat,img,new,count=1,flags=re.S)
                      if n: break
                  if new!=text: page.write_text(new,encoding='utf-8')

              for page in (Path('hospitals/index.html'),Path('ar/hospitals/index.html')):
                  if not page.exists(): continue
                  text=page.read_text(encoding='utf-8'); pos=text.find(slug)
                  if pos<0: continue
                  start=text.rfind('<article',0,pos)
                  if start<0: start=text.rfind('<div',0,pos)
                  if start<0: continue
                  end=text.find('</article>',pos); end=end+10 if end>=0 else min(len(text),pos+2500)
                  seg=text[start:end]
                  seg2=re.sub(r'src="[^"]*hospital-placeholder\.svg"',f'src="{src}"',seg,count=1)
                  if seg2!=seg: page.write_text(text[:start]+seg2+text[end:],encoding='utf-8')
          PY

      - name: Commit verified local assets
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo 'No changes.'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/hospitals hospitals ar/hospitals
          git commit -m 'Localize verified official hospital images'
          git push
