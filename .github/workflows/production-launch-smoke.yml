name: Production Launch Smoke Test
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-launch-smoke.yml'
      - 'index.html'
      - 'ar/index.html'
      - '404.html'
      - 'doctors/**'
      - 'ar/doctors/**'
      - 'hospitals/**'
      - 'ar/hospitals/**'
      - 'treatments/**'
      - 'ar/treatments/**'
      - 'contact/**'
      - 'ar/contact/**'
  workflow_dispatch:
    inputs:
      site_origin:
        description: 'Deployed site origin (include repository path if needed)'
        required: true
        default: 'https://elajmeindia.com'
        type: string
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: read
jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check production bilingual routes and critical assets
        env:
          SITE_ORIGIN: ${{ inputs.site_origin || vars.ELAJME_SITE_ORIGIN || 'https://elajmeindia.com' }}
        run: |
          python3 - <<'PY'
          import os,urllib.request,urllib.error,sys,re
          from urllib.parse import urljoin
          origin=os.environ['SITE_ORIGIN'].rstrip('/')+'/'
          routes=['','ar/','doctors/','ar/doctors/','hospitals/','ar/hospitals/','contact/','ar/contact/','treatments/','ar/treatments/']
          assets=['assets/js/mobile-header.js','assets/images/doctors/prof-dr-subhash-gupta.jpg','assets/images/hospitals/max-saket.webp']
          errors=[]
          def fetch(path):
              url=urljoin(origin,path)
              req=urllib.request.Request(url,headers={'User-Agent':'ElajmeIndia-ProductionSmoke/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=18) as res:
                      return res.status,res.read(900000).decode('utf-8','replace') if path not in assets else ''
              except urllib.error.HTTPError as exc:
                  if path=='**' and exc.code==404:
                      return 404,exc.read(900000).decode('utf-8','replace')
                  errors.append(f'{url}: HTTP {exc.code}');return exc.code,''
              except Exception as exc:
                  errors.append(f'{url}: {exc}');return 0,''
          for path in routes:
              status,body=fetch(path)
              if status!=200:errors.append(f'{path or "/"}: HTTP {status}')
              if not body:continue
              if '<html' not in body.lower():errors.append(f'{path or "/"}: not HTML')
              if path.startswith('ar/') and not re.search(r'<html[^>]*dir=["\']rtl["\']',body,re.I):errors.append(f'{path}: RTL missing')
              if path in ('','ar/','contact/','ar/contact/'):
                  if 'wa.me/917488955154' not in body:errors.append(f'{path or "/"}: Elajme WhatsApp missing')
              if path in ('','ar/') and 'patientEnquiryForm' not in body:errors.append(f'{path or "/"}: enquiry form missing')
              print(f'PAGE {path or "/"}: HTTP {status}')
          for path in assets:
              status,_=fetch(path)
              if status!=200:errors.append(f'{path}: HTTP {status}')
              print(f'ASSET {path}: HTTP {status}')
          # The malformed path is handled by a client-side redirect on the 404 page.
          # Confirm the recovery script is deployed without pretending it is an HTTP redirect.
          status,body=fetch('**')
          if status==404 and "location.replace('https://elajmeindia.com/')" not in body:
              errors.append('malformed homepage path: client-side recovery missing from 404 page')
          elif status==200 and "location.replace('https://elajmeindia.com/')" not in body:
              print('INFO: malformed path returned HTTP 200; inspect final browser URL to confirm recovery')
          print(f'MALFORMED PATH RECOVERY: HTTP {status}')
          for issue in errors:print('FAIL:',issue)
          print(f'PRODUCTION SMOKE TEST: {len(errors)} issues')
          if errors:sys.exit(1)
          PY
