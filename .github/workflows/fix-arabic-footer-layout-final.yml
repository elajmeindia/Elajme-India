name: Fix Arabic footer layout final
on:
  push:
    paths:
      - '.github/workflows/fix-arabic-footer-layout-final.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final footer CSS
        env:
          FOOTER_CSS_B64: 
        run: echo "$FOOTER_CSS_B64" | base64 -d >> assets/css/site-shell.css
      - name: Commit footer layout fix
        run: |
          git config user.name "Elajme India QA"
          git config user.email "actions@users.noreply.github.com"
          git add assets/css/site-shell.css
          git commit -m "Fix Arabic homepage footer visual parity"
          git push
