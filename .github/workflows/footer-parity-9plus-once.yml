name: Enforce exact approved homepage footers sitewide

on:
  push:
    paths:
      - ".github/workflows/footer-parity-9plus-once.yml"

permissions:
  contents: write

jobs:
  unify-footer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone the actual homepage footer markup to every page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          footer_re = re.compile(r'<footer\b[^>]*>.*?</footer>', re.I | re.S)

          def footer_from(path):
              text = Path(path).read_text(encoding='utf-8')
              m = footer_re.search(text)
              if not m:
                  raise SystemExit(f'No footer found in canonical homepage: {path}')
              return m.group(0)

          # These two homepage files are the ONLY footer sources of truth.
          EN = footer_from('index.html')
          AR = footer_from('ar/index.html')

          changed = 0
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts:
                  continue
              text = p.read_text(encoding='utf-8')
              is_ar = p.parts and p.parts[0] == 'ar'
              master = AR if is_ar else EN
              if footer_re.search(text):
                  new = footer_re.sub(lambda _m: master, text, count=1)
              else:
                  new = text.replace('</body>', master + '</body>', 1)
              if new != text:
                  p.write_text(new, encoding='utf-8')
                  changed += 1
          print(f'Cloned canonical homepage footer into {changed} HTML files')
          PY

      - name: Commit exact homepage footer propagation
        shell: bash
        run: |
          git config user.name "Elajme India QA"
          git config user.email "actions@users.noreply.github.com"
          git add -- '*.html' ':!node_modules'
          if git diff --cached --quiet; then
            echo "All pages already use the exact homepage footer markup"
            exit 0
          fi
          git commit -m "Clone exact approved homepage footers sitewide"
          git push
