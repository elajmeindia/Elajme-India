name: Production Arabic mobile and enquiry audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ar/**'
      - 'assets/css/**'
      - 'assets/js/**'
      - '.github/scripts/**'
      - '.github/workflows/production-arabic-mobile-enquiry-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Arabic directory and enquiry source
        run: node .github/scripts/arabic-directory-static-audit.cjs
      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test production Arabic pages at 360, 390 and 768px
        env:
          BASE_URL: https://elajmeindia.com
        run: node .github/scripts/production-arabic-mobile-enquiry-audit.cjs
      - name: Publish audit summary
        if: always()
        run: |
          if [ -f audit-results/report.json ]; then
            node -e "const r=require('./audit-results/report.json');const fs=require('fs');const lines=['## Arabic production mobile audit','Checked: '+r.checkedAt,'Checks: '+r.checks.length,'Failures: '+r.errors.length,...r.errors.map(x=>'- '+x)];fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\\n')+'\\n');"
          else
            echo "## Arabic production mobile audit" >> "$GITHUB_STEP_SUMMARY"
            echo "Browser report unavailable. Inspect the failed job step." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arabic-production-mobile-audit
          path: audit-results/
          if-no-files-found: ignore
