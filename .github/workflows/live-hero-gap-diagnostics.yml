name: Live bilingual hero internal gap diagnostics
on:
  pull_request:
    paths:
      - '.github/workflows/live-hero-gap-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Measure actual hero whitespace without changing design
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch();
            for(const width of [1363,900,390]){
              for(const path of ['/','/ar/']){
                const page=await browser.newPage({viewport:{width,height:936}});
                try{
                  await page.goto('https://elajmeindia.com'+path,{waitUntil:'domcontentloaded',timeout:20000});
                  const data=await page.evaluate(()=>{
                    const box=s=>{const e=document.querySelector(s);if(!e)return null;const r=e.getBoundingClientRect();return {top:Math.round(r.top),bottom:Math.round(r.bottom),height:Math.round(r.height),width:Math.round(r.width)}};
                    const hero=box('#home'),grid=box('#home .hero-grid'),copy=box('#home .hero-copy'),visual=box('#home .hero-photo'),form=box('#home .homepage-hero-form'),title=box('#home h1'),lead=box('#home .hero-lead'),actions=box('#home .hero-actions'),trust=box('#home .trust-row'),next=box('#home + section');
                    const gap=(a,b)=>a&&b?b.top-a.bottom:null;
                    return {hero,grid,copy,visual,form,title,lead,actions,trust,next,gaps:{titleToLead:gap(title,lead),leadToActions:gap(lead,actions),actionsToTrust:gap(actions,trust),copyToHeroBottom:gap(copy,hero),visualToHeroBottom:gap(visual,hero),formToHeroBottom:gap(form,hero),copyToForm:gap(copy,form),photoToForm:gap(visual,form),heroToNext:gap(hero,next)},overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2};
                  });
                  console.log('HERO_GAP_DIAGNOSTIC',width,path,JSON.stringify(data));
                  if(data.overflow)throw Error('Horizontal overflow');
                  if(width===1363 && (data.gaps.leadToActions>22||data.gaps.actionsToTrust>18))throw Error('Excessive desktop hero text gap: '+JSON.stringify(data.gaps));
                }finally{await page.close()}
              }
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
