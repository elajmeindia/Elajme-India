name: Apply site QA fixes
on:
  push:
    paths:
      - '.github/workflows/site-qa-fixes.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Localize verified remaining images and polish conversion headers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, urllib.request, html

          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              return urllib.request.urlopen(req,timeout=25).read().decode('utf-8','ignore')

          def og_image(url):
              try: page=fetch(url)
              except Exception: return None
              pats=[r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)',r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:image["\']']
              for pat in pats:
                  m=re.search(pat,page,re.I)
                  if m: return html.unescape(m.group(1))
              return None

          def download(url,dest):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':url})
                  data=urllib.request.urlopen(req,timeout=30).read()
                  if len(data)<5000: return False
                  Path(dest).parent.mkdir(parents=True,exist_ok=True)
                  Path(dest).write_bytes(data)
                  return True
              except Exception:
                  return False

          # Dr Abhideep Chaudhary: official Max Healthcare page and portrait metadata.
          doctor_page='https://www.maxhealthcare.in/doctor/abhideep-chaudhary'
          img=og_image(doctor_page)
          doctor_dest='assets/images/doctors/dr-abhideep-chaudhary.jpg'
          if img and download(img,doctor_dest):
              p=Path('doctors/dr-abhideep-chaudhary/index.html'); s=p.read_text(encoding='utf-8')
              tag='<img class="profile-photo" loading="lazy" src="../../assets/images/doctors/dr-abhideep-chaudhary.jpg" alt="Dr. Abhideep Chaudhary">'
              s=re.sub(r'<div class="profile-photo profile-photo-fallback"[^>]*>.*?</div>',tag,s,count=1,flags=re.S)
              if 'og:image' not in s:
                  s=s.replace('<meta property="og:type" content="profile">','<meta property="og:type" content="profile"><meta property="og:image" content="https://elajmeindia.com/assets/images/doctors/dr-abhideep-chaudhary.jpg">',1)
              p.write_text(s,encoding='utf-8')

          # Sir H. N. Reliance: only use official hospital metadata image if available.
          hospital_page='https://www.rfhospital.org/about-us/our-hospital'
          himg=og_image(hospital_page)
          hospital_dest='assets/images/hospitals/sir-hn-reliance.jpg'
          if himg and ('rfhospital.org' in himg or 'reliance' in himg.lower()) and download(himg,hospital_dest):
              p=Path('hospitals/sir-hn-reliance-foundation-hospital-mumbai/index.html'); s=p.read_text(encoding='utf-8')
              tag='<img class="hospital-photo" loading="lazy" src="../../assets/images/hospitals/sir-hn-reliance.jpg" alt="Sir H. N. Reliance Foundation Hospital, Mumbai">'
              s=re.sub(r'<div class="visual">.*?</div>',tag,s,count=1,flags=re.S)
              p.write_text(s,encoding='utf-8')

          # Add Elajme phone to doctor/hospital profile headers without adding WhatsApp clutter.
          phone='<a class="profile-phone" href="tel:+917488955154">+91 74889 55154</a>'
          for base in ('doctors','hospitals'):
              for p in Path(base).glob('*/index.html'):
                  s=p.read_text(encoding='utf-8')
                  if 'tel:+917488955154' not in s:
                      if '</div></header>' in s:
                          s=s.replace('</div></header>',phone+'</div></header>',1)
                  p.write_text(s,encoding='utf-8')

          # Responsive phone styling for both profile systems.
          for rel in ('assets/css/profile.css','assets/css/profile-directory.css'):
              p=Path(rel); s=p.read_text(encoding='utf-8')
              if '.profile-phone{' not in s:
                  s += '\n.profile-phone{font-weight:800;white-space:nowrap;color:#123b50}.profile-phone:hover{text-decoration:underline}@media(max-width:760px){.profile-phone{display:block;width:100%;text-align:center;padding:8px 10px;border:1px solid #dce7e9;border-radius:9px}}\n'
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'Elajme India Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Localize verified images and improve profile headers'
          git push
