name: Final homepage production visual verification
on:
  pull_request:
    paths: ['.github/workflows/final-homepage-visual.yml', 'scripts/final-homepage-visual.cjs']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit playwright@1.56.1 && npx playwright install chromium
      - shell: bash
        run: |
          mkdir -p evidence
          node scripts/final-homepage-visual.cjs | tee evidence/position.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-homepage-production-evidence
          path: evidence/
          retention-days: 7
