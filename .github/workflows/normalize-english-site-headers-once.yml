name: Normalize English site headers once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-english-site-headers-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Enforce homepage header dimensions without narrow desktop compression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/css/site-shell.css')
          text=p.read_text(encoding='utf-8')
          marker='/* homepage-master-no-compression-v5 */'
          block='''
          /* homepage-master-no-compression-v5 */
          @media(min-width:1041px){
            .shell-header{height:82px!important}
            .shell-header .shell-container{width:min(1160px,calc(100% - 40px))!important;margin-inline:auto!important}
            .shell-nav{height:100%!important;gap:22px!important;justify-content:space-between!important;overflow:visible!important}
            .shell-brand{gap:10px!important;overflow:visible!important}
            .shell-brand img{width:60px!important;height:60px!important;flex:0 0 60px!important}
            .shell-wordmark{display:flex!important;align-items:flex-start!important;text-align:left!important;overflow:visible!important}
            .shell-name{font-size:18px!important;line-height:1.05!important}
            .shell-ar{font-size:12px!important;margin-top:5px!important}
            .shell-links{gap:18px!important;overflow:visible!important}
            .shell-header .shell-links a{font-size:12px!important;padding:8px 6px!important;overflow:visible!important}
            .shell-header .shell-links a[href*="about"]{font-size:12px!important}
            .shell-header .shell-links a[href*="about"]:after{content:none!important;display:none!important}
            .shell-actions{gap:10px!important;overflow:visible!important}
            .shell-phone{font-size:12px!important;padding:8px 10px!important;overflow:visible!important}
            .shell-whatsapp{font-size:12px!important;padding:9px 12px!important;min-width:max-content!important;overflow:visible!important;filter:none!important;opacity:1!important}
            .shell-lang{font-size:13px!important;padding:9px 12px!important}
            .shell-cta{padding:11px 15px!important;min-width:max-content!important;overflow:visible!important}
            .shell-cta:after{font-size:12px!important}
          }
          '''
          if marker not in text:
              p.write_text(text+'\n'+block+'\n',encoding='utf-8')
          PY
      - name: Verify homepage master header parity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          css=Path('assets/css/site-shell.css').read_text(encoding='utf-8')
          for n in ['homepage-master-no-compression-v5','width:min(1160px,calc(100% - 40px))!important','gap:22px!important','gap:18px!important','font-size:18px!important']:
              assert n in css
          bad=[]; checked=0
          for p in Path('.').rglob('*.html'):
              s=p.as_posix()
              if s.startswith(('.git/','.github/','ar/')): continue
              t=p.read_text(encoding='utf-8')
              if '<header class="shell-header">' not in t: continue
              checked+=1
              h=t.split('<header class="shell-header">',1)[1].split('</header>',1)[0]
              for n in ['Home','Treatments','Hospitals','Doctors','International Patients','About Us','Contact','WhatsApp Us','Start Your Enquiry','+91 74889 55154']:
                  if n not in h: bad.append((s,n))
          print('Headers checked:',checked)
          if bad: raise SystemExit(str(bad))
          print('HOMEPAGE MASTER HEADER PARITY CLEAN')
          PY
          git diff --exit-code -- assets/css/footer-approved.css FOOTER-LOCK.md
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/site-shell.css
          git commit -m 'Remove subpage header compression'
          git push