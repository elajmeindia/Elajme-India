name: Localize doctor images
on:
  push:
    paths:
      - '.github/workflows/localize-doctor-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Permanently localize every remaining external doctor portrait
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images/doctors
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import quote
          import re, subprocess, unicodedata

          p=Path('doctors/index.html')
          s=p.read_text()

          class Parser(HTMLParser):
              def __init__(self): super().__init__(); self.items=[]
              def handle_starttag(self,tag,attrs):
                  if tag!='img': return
                  d=dict(attrs)
                  if 'photo' in d.get('class','').split() and d.get('src','').startswith(('http://','https://')):
                      self.items.append((d.get('alt','Doctor'),d['src']))
          parser=Parser(); parser.feed(s)
          print('External portraits remaining:',len(parser.items))
          if not parser.items:
              print('Nothing to localize'); raise SystemExit(0)

          failures=[]; changed=0
          for name,url in parser.items:
              slug=unicodedata.normalize('NFKD',name).encode('ascii','ignore').decode().lower()
              slug=re.sub(r'[^a-z0-9]+','-',slug).strip('-')
              dest=Path('assets/images/doctors')/(slug+'.jpg')
              # weserv acts only as a retrieval bridge. The resulting bytes are committed locally,
              # so the live site never depends on the proxy or hospital hotlink afterwards.
              source=url.split('://',1)[-1]
              proxy='https://images.weserv.nl/?url='+quote(source,safe='/:?=&%')+'&output=jpg&q=88&w=900&h=1100&fit=cover'
              commands=[
                  ['curl','-L','--fail','--retry','3','--connect-timeout','20','--max-time','120','-A','Mozilla/5.0',proxy,'-o',str(dest)],
                  ['curl','-L','--fail','--retry','3','--connect-timeout','20','--max-time','120','-A','Mozilla/5.0',url,'-o',str(dest)]
              ]
              ok=False
              for cmd in commands:
                  if subprocess.run(cmd).returncode==0 and dest.exists() and dest.stat().st_size>3000:
                      probe=subprocess.run(['file',str(dest)],capture_output=True,text=True).stdout.lower()
                      if any(x in probe for x in ('jpeg','png','webp','image')):
                          ok=True; break
              if not ok:
                  dest.unlink(missing_ok=True); failures.append(name); print('FAILED',name); continue
              pat=r'<img class="photo"[^>]*src="'+re.escape(url)+r'"[^>]*>'
              rep=f'<img class="photo" loading="lazy" src="../assets/images/doctors/{dest.name}?v=3" alt="{name}">'
              s,n=re.subn(pat,rep,s,count=1)
              if n!=1:
                  failures.append(name); dest.unlink(missing_ok=True); print('HTML MATCH FAILED',name); continue
              changed+=1; print('LOCALIZED',name,dest.stat().st_size)

          p.write_text(s)
          print('Localized:',changed,'Failures:',failures)
          if failures:
              raise SystemExit('Portrait localization failed for: '+', '.join(failures))
          PY
      - name: Verify no external doctor portraits remain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('doctors/index.html').read_text()
          external=re.findall(r'<img class="photo"[^>]*src="https?://[^\"]+',s)
          if external:
              raise SystemExit(f'{len(external)} external doctor portraits still remain')
          print('All doctor card portraits now use local repository files.')
          PY
      - name: Commit permanent doctor image fix
        run: |
          git config user.name 'Elajme India Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/images/doctors doctors/index.html
          if git diff --cached --quiet; then echo 'No changes required'; exit 0; fi
          git commit -m 'Host all remaining doctor portraits locally'
          git push
