              r.email=await email.evaluate(e=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e),span=e.querySelector('span').getBoundingClientRect();return{x:r.x,y:r.y,width:r.width,height:r.height,direction:s.direction,textWidth:span.width,textHeight:span.height}});
