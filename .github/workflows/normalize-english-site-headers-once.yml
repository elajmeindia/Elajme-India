name: Normalize English site headers once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-english-site-headers-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fix shared desktop header crowding and WhatsApp readability
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/css/site-shell.css')
          text=p.read_text(encoding='utf-8')
          marker='/* header-crowding-whatsapp-fix-v2 */'
          block=r'''
          /* header-crowding-whatsapp-fix-v2 */
          @media(min-width:1041px){
            .shell-container{width:min(1260px,calc(100% - 20px))!important}
            .shell-nav{gap:8px!important}
            .shell-links{gap:0!important}
            .shell-header .shell-links a{padding:10px 6px!important;font-size:11.5px!important}
            .shell-header .shell-links a[href*="about"]{font-size:11.5px!important}
            .shell-header .shell-links a[href*="about"]:after{content:none!important;display:none!important}
            .shell-actions{gap:6px!important}
            .shell-phone{font-size:10.5px!important;padding:8px 5px!important}
            .shell-whatsapp{font-size:11px!important;padding:9px 10px!important;min-width:max-content!important;overflow:visible!important;filter:none!important;opacity:1!important;text-shadow:none!important}
            .shell-whatsapp span{display:inline-block!important;margin-right:5px!important;font-size:12px!important;line-height:1!important;filter:none!important;opacity:1!important}
            .shell-lang{padding:9px 10px!important;font-size:11.5px!important}
            .shell-cta{padding:11px 12px!important}
            .shell-cta:after{font-size:10.5px!important}
          }
          @media(min-width:1041px) and (max-width:1180px){
            .shell-wordmark{display:none!important}
            .shell-header .shell-links a{font-size:10.5px!important;padding-inline:5px!important}
            .shell-whatsapp{font-size:10.5px!important;padding-inline:8px!important}
            .shell-phone{font-size:10px!important}
          }
          '''
          if marker not in text:
              p.write_text(text+'\n'+block+'\n',encoding='utf-8')
          PY
      - name: Verify shared header fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          css=Path('assets/css/site-shell.css').read_text(encoding='utf-8')
          assert 'header-crowding-whatsapp-fix-v2' in css
          assert 'a[href*="about"]:after{content:none!important' in css
          assert 'min-width:max-content!important' in css
          bad=[]; checked=0
          for p in Path('.').rglob('*.html'):
              s=p.as_posix()
              if s.startswith(('.git/','.github/','ar/')): continue
              t=p.read_text(encoding='utf-8')
              if '<header class="shell-header">' not in t: continue
              checked+=1
              h=t.split('<header class="shell-header">',1)[1].split('</header>',1)[0]
              for needle in ['WhatsApp Us','About Us','Contact','Start Your Enquiry','+91 74889 55154']:
                  if needle not in h: bad.append((s,needle))
          print('English shared headers checked:',checked)
          if bad: raise SystemExit(str(bad))
          print('HEADER WHATSAPP / CROWDING FIX CLEAN')
          PY
          git diff --exit-code -- assets/css/footer-approved.css FOOTER-LOCK.md
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/site-shell.css
          git commit -m 'Fix header crowding and WhatsApp readability'
          git push