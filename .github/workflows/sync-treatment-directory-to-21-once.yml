name: Sync treatment directory to 21 once
on:
  push:
    paths: ['.github/workflows/sync-treatment-directory-to-21-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Correct routes and expand to 21
        shell: python
        run: |
          from pathlib import Path

          # Existing specialty 18/19 canonical slugs created in the prior stage.
          recent=[
            ('bone-marrow-transplant-india','Bone Marrow &amp; Stem Cell Transplant','Specialist review and transplant-enquiry coordination for eligible haematology cases.'),
            ('bariatric-weight-loss-surgery-india','Bariatric &amp; Weight-Loss Surgery','Bariatric and metabolic surgery assessment and enquiry coordination.'),
            ('pulmonology-lung-treatment-india','Pulmonology &amp; Lung Care','Respiratory specialist review and lung-care enquiry coordination.'),
            ('dermatology-skin-treatment-india','Dermatology &amp; Skin Care','Dermatology specialist review and skin-care enquiry coordination.'),
            ('endocrinology-diabetes-care-india','Endocrinology &amp; Diabetes Care','Endocrinology review and coordination for diabetes, thyroid and hormonal conditions.'),
            ('pediatrics-child-health-india','Pediatrics &amp; Child Health','Pediatric specialist review and child-health enquiry coordination.')]

          # Create #20 Endocrinology from approved bilingual treatment shell.
          base=Path('treatments/bariatric-weight-loss-surgery-india/index.html').read_text(encoding='utf-8')
          e=base.replace('Bariatric Surgery in India | International Patients | Elajme India','Endocrinology & Diabetes Care in India | Elajme India').replace('Bariatric and weight-loss surgery enquiry coordination in India for international patients, with specialist review through Elajme India.','Endocrinology and diabetes-care enquiry coordination in India for international patients, including thyroid and hormonal conditions, through Elajme India.').replace('bariatric-weight-loss-surgery-india','endocrinology-diabetes-care-india').replace('Bariatric surgery coordination','Endocrinology coordination').replace('Bariatric and weight-loss surgery in India for international patients','Endocrinology and diabetes care in India for international patients').replace('Elajme India helps international patients coordinate bariatric and metabolic surgery enquiries with appropriate specialist teams in India. Suitability for surgery and the procedure choice require individual medical assessment.','Elajme India helps international patients coordinate endocrinology enquiries for diabetes, thyroid disorders and other hormonal conditions. Diagnosis and treatment planning require individual specialist assessment.').replace('Eligibility assessment','Clinical assessment').replace('The bariatric team evaluates weight history, BMI, obesity-related conditions, previous weight-management efforts and overall health.','The specialist reviews symptoms, diagnosis, previous treatment, relevant laboratory results and overall medical history.').replace('Procedure planning','Diabetes and metabolic care').replace('The treating surgeon determines whether surgery is appropriate and discusses suitable options based on the patient’s clinical profile.','The treating team determines appropriate investigations and an individualized management plan for diabetes and metabolic conditions.').replace('Nutrition and follow-up','Thyroid and hormonal care').replace('Dietary assessment, lifestyle preparation and long-term follow-up are important parts of bariatric care and are planned by the treating team.','Thyroid and other hormonal concerns are assessed according to symptoms, examination and test results.').replace('Useful information may include height and weight, BMI if known, medical history, diabetes or blood-pressure records, sleep-apnoea information, previous weight-loss treatment, recent blood tests, imaging where relevant and current medicines.','Useful records may include recent blood tests, glucose and HbA1c results, thyroid or hormone tests, relevant imaging, previous diagnoses, treatment history and current medicines.').replace('Start a bariatric surgery enquiry','Start an endocrinology enquiry')
          Path('treatments/endocrinology-diabetes-care-india').mkdir(parents=True,exist_ok=True); Path('treatments/endocrinology-diabetes-care-india/index.html').write_text(e,encoding='utf-8')
          abase=Path('ar/treatments/bariatric-weight-loss-surgery-india/index.html').read_text(encoding='utf-8')
          ae=abase.replace('جراحة السمنة في الهند للمرضى الدوليين | علاج مي إنديا','علاج الغدد الصماء والسكري في الهند | علاج مي إنديا').replace('تنسيق استفسارات جراحة السمنة وإنقاص الوزن في الهند للمرضى الدوليين مع مراجعة الفرق المتخصصة عبر علاج مي إنديا.','تنسيق استفسارات الغدد الصماء والسكري واضطرابات الغدة الدرقية والهرمونات في الهند للمرضى الدوليين عبر علاج مي إنديا.').replace('bariatric-weight-loss-surgery-india','endocrinology-diabetes-care-india').replace('جراحة السمنة وإنقاص الوزن في الهند للمرضى الدوليين','علاج الغدد الصماء والسكري في الهند للمرضى الدوليين').replace('تساعد علاج مي إنديا المرضى الدوليين في تنسيق استفسارات جراحة السمنة والتمثيل الغذائي مع الفرق المتخصصة المناسبة في الهند. تتطلب ملاءمة الجراحة واختيار الإجراء تقييماً طبياً فردياً.','تساعد علاج مي إنديا المرضى الدوليين في تنسيق استفسارات السكري واضطرابات الغدة الدرقية وغيرها من الحالات الهرمونية مع الفرق المتخصصة المناسبة في الهند. يعتمد التشخيص وخطة العلاج على التقييم الطبي الفردي.').replace('تقييم الأهلية','التقييم السريري').replace('يقيّم فريق السمنة تاريخ الوزن ومؤشر كتلة الجسم والأمراض المرتبطة بالسمنة والمحاولات السابقة لإنقاص الوزن والحالة الصحية العامة.','يراجع الطبيب الأعراض والتشخيص والعلاجات السابقة ونتائج التحاليل ذات الصلة والتاريخ الطبي العام.').replace('اختيار الإجراء','رعاية السكري والتمثيل الغذائي').replace('يحدد الجراح المعالج ما إذا كانت الجراحة مناسبة ويناقش الخيارات الملائمة وفق الحالة السريرية للمريض.','يحدد الفريق المعالج الفحوصات المناسبة وخطة الرعاية الفردية لحالات السكري واضطرابات التمثيل الغذائي.').replace('التغذية والمتابعة','الغدة الدرقية والهرمونات').replace('يعد التقييم الغذائي والاستعداد لتغيير نمط الحياة والمتابعة طويلة المدى أجزاء مهمة من رعاية جراحة السمنة.','تُقيّم اضطرابات الغدة الدرقية وغيرها من الاضطرابات الهرمونية وفق الأعراض والفحوصات والنتائج المخبرية.').replace('يمكن إرسال الطول والوزن ومؤشر كتلة الجسم إن كان معروفاً والتاريخ الطبي وتقارير السكري أو ضغط الدم ومعلومات انقطاع النفس أثناء النوم ومحاولات إنقاص الوزن السابقة والتحاليل الحديثة والأدوية الحالية.','يمكن إرسال تحاليل الدم الحديثة ونتائج السكر التراكمي ووظائف الغدة الدرقية أو الهرمونات والصور الطبية ذات الصلة وسجل العلاج والأدوية الحالية.').replace('ابدأ استفسار جراحة السمنة','ابدأ استفسار الغدد الصماء والسكري')
          Path('ar/treatments/endocrinology-diabetes-care-india').mkdir(parents=True,exist_ok=True); Path('ar/treatments/endocrinology-diabetes-care-india/index.html').write_text(ae,encoding='utf-8')

          # Create #21 Pediatrics from the same protected shell without changing locked UI assets.
          p=e.replace('Endocrinology & Diabetes Care in India | Elajme India','Pediatrics & Child Health in India | Elajme India').replace('Endocrinology and diabetes-care enquiry coordination in India for international patients, including thyroid and hormonal conditions, through Elajme India.','Pediatric and child-health enquiry coordination in India for international patients, with specialist review arranged through Elajme India.').replace('endocrinology-diabetes-care-india','pediatrics-child-health-india').replace('Endocrinology coordination','Pediatric care coordination').replace('Endocrinology and diabetes care in India for international patients','Pediatrics and child health in India for international patients').replace('Elajme India helps international patients coordinate endocrinology enquiries for diabetes, thyroid disorders and other hormonal conditions. Diagnosis and treatment planning require individual specialist assessment.','Elajme India helps international families coordinate pediatric and child-health enquiries with appropriate specialist teams in India. Diagnosis, investigations and treatment planning require individual pediatric assessment.').replace('Clinical assessment','Pediatric assessment').replace('The specialist reviews symptoms, diagnosis, previous treatment, relevant laboratory results and overall medical history.','The pediatric team reviews the child’s symptoms, diagnosis, growth and development, previous treatment and relevant medical history.').replace('Diabetes and metabolic care','Specialist pediatric care').replace('The treating team determines appropriate investigations and an individualized management plan for diabetes and metabolic conditions.','Depending on the condition, the child may be reviewed by general pediatrics or an appropriate pediatric subspecialty team.').replace('Thyroid and hormonal care','Family-centred follow-up').replace('Thyroid and other hormonal concerns are assessed according to symptoms, examination and test results.','The treating team explains investigations, treatment and follow-up requirements to the child’s parent or legal guardian.').replace('Useful records may include recent blood tests, glucose and HbA1c results, thyroid or hormone tests, relevant imaging, previous diagnoses, treatment history and current medicines.','Useful records may include the child’s diagnosis, age, growth information, recent pediatric notes, blood tests, imaging, discharge summaries, vaccination history when relevant, previous treatment and current medicines.').replace('Start an endocrinology enquiry','Start a pediatric care enquiry')
          Path('treatments/pediatrics-child-health-india').mkdir(parents=True,exist_ok=True); Path('treatments/pediatrics-child-health-india/index.html').write_text(p,encoding='utf-8')
          pa=ae.replace('علاج الغدد الصماء والسكري في الهند | علاج مي إنديا','طب الأطفال وصحة الطفل في الهند | علاج مي إنديا').replace('تنسيق استفسارات الغدد الصماء والسكري واضطرابات الغدة الدرقية والهرمونات في الهند للمرضى الدوليين عبر علاج مي إنديا.','تنسيق استفسارات طب الأطفال وصحة الطفل في الهند للعائلات الدولية عبر علاج مي إنديا.').replace('endocrinology-diabetes-care-india','pediatrics-child-health-india').replace('علاج الغدد الصماء والسكري في الهند للمرضى الدوليين','طب الأطفال وصحة الطفل في الهند للمرضى الدوليين').replace('تساعد علاج مي إنديا المرضى الدوليين في تنسيق استفسارات السكري واضطرابات الغدة الدرقية وغيرها من الحالات الهرمونية مع الفرق المتخصصة المناسبة في الهند. يعتمد التشخيص وخطة العلاج على التقييم الطبي الفردي.','تساعد علاج مي إنديا العائلات الدولية في تنسيق استفسارات طب الأطفال وصحة الطفل مع الفرق المتخصصة المناسبة في الهند. يعتمد التشخيص والفحوصات وخطة العلاج على تقييم طبي فردي للطفل.').replace('التقييم السريري','تقييم الطفل').replace('يراجع الطبيب الأعراض والتشخيص والعلاجات السابقة ونتائج التحاليل ذات الصلة والتاريخ الطبي العام.','يراجع فريق طب الأطفال أعراض الطفل وتشخيصه ونموه وتطوره والعلاجات السابقة والتاريخ الطبي ذي الصلة.').replace('رعاية السكري والتمثيل الغذائي','الرعاية التخصصية للأطفال').replace('يحدد الفريق المعالج الفحوصات المناسبة وخطة الرعاية الفردية لحالات السكري واضطرابات التمثيل الغذائي.','بحسب الحالة قد تتم المراجعة لدى طب الأطفال العام أو أحد التخصصات الدقيقة المناسبة للأطفال.').replace('الغدة الدرقية والهرمونات','المتابعة مع الأسرة').replace('تُقيّم اضطرابات الغدة الدرقية وغيرها من الاضطرابات الهرمونية وفق الأعراض والفحوصات والنتائج المخبرية.','يشرح الفريق المعالج الفحوصات والعلاج والمتابعة المطلوبة لوالدي الطفل أو وليه القانوني.').replace('يمكن إرسال تحاليل الدم الحديثة ونتائج السكر التراكمي ووظائف الغدة الدرقية أو الهرمونات والصور الطبية ذات الصلة وسجل العلاج والأدوية الحالية.','يمكن إرسال عمر الطفل والتشخيص ومعلومات النمو وتقارير طبيب الأطفال والتحاليل والصور الطبية وملخصات الخروج وسجل التطعيم عند الحاجة والعلاجات السابقة والأدوية الحالية.').replace('ابدأ استفسار الغدد الصماء والسكري','ابدأ استفسار طب الأطفال')
          Path('ar/treatments/pediatrics-child-health-india').mkdir(parents=True,exist_ok=True); Path('ar/treatments/pediatrics-child-health-india/index.html').write_text(pa,encoding='utf-8')

          # Rebuild visible tail of English directory from ENT onward to remove prior slug drift.
          en=Path('treatments/index.html'); s=en.read_text(encoding='utf-8')
          s=s.replace('Medical Treatment in India: 17 Specialties','Medical Treatment in India: 21 Specialties').replace('Explore 17 medical treatment areas','Explore 21 medical treatment areas')
          ent='<article class="card"><h3><a href="ent-treatment-india/">ENT &amp; Ear, Nose and Throat Care</a></h3><p>ENT specialist review and ear, nose, sinus, throat and voice-care enquiry coordination.</p></article>'
          tail=ent+''.join(f'<article class="card"><h3><a href="{slug}/">{name}</a></h3><p>{desc}</p></article>' for slug,name,desc in recent)
          start=s.find(ent); end=s.find('</div></div></section>',start)
          if start<0 or end<0: raise SystemExit('English directory treatment grid anchor missing')
          s=s[:start]+tail+s[end:]
          # Structured ItemList: append positions 18-21 after existing position 17.
          needle='{"@type":"ListItem","position":17,"name":"Bariatric & Weight-Loss Surgery","url":"https://elajmeindia.com/treatments/bariatric-weight-loss-surgery-india/"}'
          extra=',{"@type":"ListItem","position":18,"name":"Pulmonology & Lung Care","url":"https://elajmeindia.com/treatments/pulmonology-lung-treatment-india/"},{"@type":"ListItem","position":19,"name":"Dermatology & Skin Care","url":"https://elajmeindia.com/treatments/dermatology-skin-treatment-india/"},{"@type":"ListItem","position":20,"name":"Endocrinology & Diabetes Care","url":"https://elajmeindia.com/treatments/endocrinology-diabetes-care-india/"},{"@type":"ListItem","position":21,"name":"Pediatrics & Child Health","url":"https://elajmeindia.com/treatments/pediatrics-child-health-india/"}'
          if '"position":18' not in s: s=s.replace(needle,needle+extra)
          en.write_text(s,encoding='utf-8')

          # Arabic visible directory: append only missing cards after bariatric.
          ar=Path('ar/treatments/index.html'); a=ar.read_text(encoding='utf-8')
          anchor='<article class="card"><h3>جراحة السمنة وإنقاص الوزن</h3><p>تنسيق تقييم واستفسارات جراحة السمنة والتمثيل الغذائي مع الفرق المتخصصة.</p><a href="bariatric-weight-loss-surgery-india/">عرض التفاصيل</a></article>'
          additions=[('pulmonology-lung-treatment-india','أمراض الرئة والجهاز التنفسي','تنسيق مراجعة أمراض الرئة والتنفس مع الفرق المتخصصة.'),('dermatology-skin-treatment-india','الأمراض الجلدية والعناية بالبشرة','تنسيق مراجعة الحالات الجلدية والاستفسارات مع أطباء الجلدية.'),('endocrinology-diabetes-care-india','الغدد الصماء والسكري','تنسيق مراجعة حالات السكري والغدة الدرقية والاضطرابات الهرمونية.'),('pediatrics-child-health-india','طب الأطفال وصحة الطفل','تنسيق مراجعة حالات الأطفال وصحة الطفل مع الفرق المتخصصة.')]
          insert=''.join(f'<article class="card"><h3>{name}</h3><p>{desc}</p><a href="{slug}/">عرض التفاصيل</a></article>' for slug,name,desc in additions)
          if 'pediatrics-child-health-india/' not in a:
            # remove any partial 18-20 cards from failed/noncommitted attempts by none expected on main, then append canonical set
            a=a.replace(anchor,anchor+insert)
          ar.write_text(a,encoding='utf-8')

          # Sitemap all canonical recent EN/AR routes.
          sm=Path('sitemap.xml'); x=sm.read_text(encoding='utf-8'); add=''
          for slug,_,_ in recent:
            for prefix in ('/treatments/','/ar/treatments/'):
              url='https://elajmeindia.com'+prefix+slug+'/'
              if url not in x: add+=f'  <url><loc>{url}</loc></url>\n'
          sm.write_text(x.replace('</urlset>',add+'</urlset>'),encoding='utf-8')

          # Deterministic verification in Python, including actual existing canonical slugs.
          s=en.read_text(encoding='utf-8'); a=ar.read_text(encoding='utf-8'); x=sm.read_text(encoding='utf-8')
          assert '21 Specialties' in s
          for slug,_,_ in recent:
            assert Path('treatments',slug,'index.html').is_file(), slug+' EN missing'
            assert Path('ar/treatments',slug,'index.html').is_file(), slug+' AR missing'
            assert f'href="{slug}/"' in s, slug+' EN directory missing'
            assert f'href="{slug}/"' in a, slug+' AR directory missing'
            assert f'https://elajmeindia.com/treatments/{slug}/' in x
            assert f'https://elajmeindia.com/ar/treatments/{slug}/' in x
          print('Treatment directory synchronized: 21 bilingual specialties')
      - name: Commit synchronized expansion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add treatments ar/treatments sitemap.xml
          git commit -m 'Synchronize 21 bilingual treatment specialties'
          git push