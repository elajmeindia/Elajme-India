name: Add Nigeria to international patient hub once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/batch-treatment-trust-parity-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Nigeria to bilingual international patient hub
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          updates=[
          ('international-patients/mea/index.html',
           '<article class="card"><h3>Bahrain</h3><p>Arabic and English coordination for patients from Bahrain considering medical treatment in India.</p><a href="../../bahrain/treatment-in-india/">Bahrain patient guide →</a></article>',
           '<article class="card"><h3>Bahrain</h3><p>Arabic and English coordination for patients from Bahrain considering medical treatment in India.</p><a href="../../bahrain/treatment-in-india/">Bahrain patient guide →</a></article><article class="card"><h3>Nigeria</h3><p>Case review, hospital communication and treatment-visit coordination for patients and families travelling from Nigeria to India.</p><a href="../../nigeria/treatment-in-india/">Nigeria patient guide →</a></article>'),
          ('ar/international-patients/mea/index.html',
           '<article class="card"><h3>البحرين</h3><p>تنسيق بالعربية والإنجليزية للمرضى من البحرين الراغبين في العلاج في الهند.</p><a href="/ar/bahrain/treatment-in-india/">دليل المرضى من البحرين ←</a></article>',
           '<article class="card"><h3>البحرين</h3><p>تنسيق بالعربية والإنجليزية للمرضى من البحرين الراغبين في العلاج في الهند.</p><a href="/ar/bahrain/treatment-in-india/">دليل المرضى من البحرين ←</a></article><article class="card"><h3>نيجيريا</h3><p>تنسيق مراجعة الحالة والتواصل مع المستشفى ورحلة العلاج للمرضى والعائلات القادمين من نيجيريا إلى الهند.</p><a href="/ar/nigeria/treatment-in-india/">دليل المرضى من نيجيريا ←</a></article>')]
          changed=[]
          for fn,old,new in updates:
            p=Path(fn); text=p.read_text(); i=text.lower().find('<footer'); assert i>=0
            pre,footer=text[:i],text[i:]
            if new not in pre:
              assert old in pre, f'anchor missing: {fn}'
              p.write_text(pre.replace(old,new,1)+footer); changed.append(fn)
          # Explicitly expose Nigeria in metadata/service coverage too.
          for fn in ['international-patients/mea/index.html','ar/international-patients/mea/index.html']:
            p=Path(fn); text=p.read_text(); i=text.lower().find('<footer'); pre,footer=text[:i],text[i:]
            pre=pre.replace('"Bahrain","Middle East","Africa"','"Bahrain","Nigeria","Middle East","Africa"')
            p.write_text(pre+footer)
          for q in [Path('FOOTER-LOCK.md'),Path('assets/css/footer-approved.css')]: print('LOCK',q,hashlib.sha256(q.read_bytes()).hexdigest())
          print('Changed',changed)
          PY
      - name: Commit Nigeria hub visibility
        run: |
          if git diff --quiet -- international-patients/mea/index.html ar/international-patients/mea/index.html; then exit 0; fi
          git config user.name elajmeindia
          git config user.email shahzadalamnadwi@gmail.com
          git add international-patients/mea/index.html ar/international-patients/mea/index.html
          git commit -m 'Add Nigeria to international patient hub'
          git push
