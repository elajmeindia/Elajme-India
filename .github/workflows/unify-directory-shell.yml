name: Unify directory site shell
on:
  push:
    paths:
      - '.github/workflows/unify-directory-shell.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Standardize hospital and doctor headers and footers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          header='''<header class="directory-site-header"><div class="directory-shell"><a class="directory-brand" href="/" aria-label="Elajme India home"><img src="/Healthcare%20Travel%20Swoosh%20Emblem.png" alt="Elajme India logo" decoding="async"><span><strong>Elajme <em>India</em></strong><small lang="ar" dir="rtl">علاج مي إنديا</small></span></a><nav aria-label="Main navigation"><a href="/">Home</a><a href="/treatments/">Treatments</a><a href="/hospitals/">Hospitals</a><a href="/doctors/">Doctors</a><a href="/international-patients/mea/">International Patients</a><a href="/patient-guide/">Patient Guide</a><a href="/medical-visa/">Medical Visa</a><a href="/about/">About</a><a href="/contact/">Contact</a></nav><div class="directory-actions"><a class="directory-phone" href="tel:+917488955154">+91 74889 55154</a><a class="directory-lang" href="/ar/">العربية</a><a class="directory-cta" href="/#enquiry">Start Your Enquiry</a></div></div></header>'''
          footer='''<footer class="directory-site-footer"><div class="directory-footer-grid"><div class="directory-footer-brand"><a class="directory-brand" href="/"><img src="/Healthcare%20Travel%20Swoosh%20Emblem.png" alt="Elajme India logo" loading="lazy" decoding="async"><span><strong>Elajme <em>India</em></strong><small lang="ar" dir="rtl">علاج مي إنديا</small></span></a><p>International patient treatment coordination in India with Arabic and English communication support.</p><a class="directory-footer-cta" href="/#enquiry">Start Your Enquiry</a></div><div class="directory-footer-links"><a href="/">Home</a><a href="/treatments/">Treatments</a><a href="/hospitals/">Hospitals</a><a href="/doctors/">Doctors</a><a href="/international-patients/mea/">International Patients</a><a href="/patient-guide/">Patient Guide</a><a href="/medical-visa/">Medical Visa</a><a href="/about/">About Us</a><a href="/contact/">Contact</a><a href="/privacy.html">Privacy Policy</a><a href="/terms.html">Terms &amp; Medical Disclaimer</a><a href="tel:+917488955154">+91 74889 55154</a></div></div><div class="directory-footer-bottom"><span>© 2026 Elajme India</span><span>Elajme India provides coordination support and does not diagnose, prescribe treatment or guarantee medical, hospital or visa outcomes.</span></div></footer>'''

          changed=[]
          for root in ('hospitals','doctors'):
            for p in Path(root).rglob('index.html'):
              s=p.read_text(encoding='utf-8')
              if 'directory-shell.css' not in s:
                continue
              n=re.sub(r'<header\b[^>]*>.*?</header>', header, s, count=1, flags=re.S|re.I)
              n=re.sub(r'<footer\b[^>]*>.*?</footer>', footer, n, count=1, flags=re.S|re.I)
              if n!=s:
                p.write_text(n,encoding='utf-8')
                changed.append(str(p))
          print('Updated',len(changed),'directory pages')
          for x in changed: print(x)
          PY
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "Elajme India Site QA"
          git config user.email "actions@users.noreply.github.com"
          git add hospitals doctors
          git commit -m "Standardize hospital and doctor headers and footers"
          git push
