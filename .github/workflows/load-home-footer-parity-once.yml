name: Load English home footer parity CSS once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/load-home-footer-parity-once.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load isolated footer stylesheet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='<link rel="stylesheet" href="assets/css/home-footer-parity.css?v=1">'
          if marker not in s:
              s=s.replace('</head>', marker+'</head>')
              p.write_text(s)
          PY
          git config user.name 'Elajme India QA'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Load isolated English homepage footer parity CSS' || exit 0
          git push
