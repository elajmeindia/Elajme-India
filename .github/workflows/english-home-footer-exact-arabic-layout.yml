name: English homepage footer exact Arabic layout
on:
  push:
    paths:
      - '.github/workflows/english-home-footer-exact-arabic-layout.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make English homepage footer structurally match Arabic homepage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          start=s.index('<footer class="site-footer">')
          end=s.index('</footer>', start)+len('</footer>')
          footer='''<footer class="site-footer"><div class="container footer-wrap"><div class="footer-top"><div class="footer-brand"><img src="Healthcare%20Travel%20Swoosh%20Emblem.png" alt="" class="brand-icon" loading="lazy" decoding="async"><span class="brand-text"><strong>Elajme India</strong><span lang="ar" dir="rtl">علاج مي إنديا</span></span></div><nav class="footer-links" aria-label="Footer navigation"><a href="#home">Home</a><a href="treatments/">Treatments</a><a href="hospitals/">Hospitals</a><a href="doctors/">Doctors</a><a href="international-patients/mea/">International Patients</a><a href="privacy.html">Privacy Policy</a><a href="terms.html">Terms &amp; Medical Disclaimer</a></nav></div><div class="footer-bottom"><p>© <span id="year"></span> Elajme India. International patient coordination.</p></div></div></footer>'''
          p.write_text(s[:start]+footer+s[end:])
          PY
          cat >> styles.css <<'CSS'

          /* Exact EN homepage footer parity with the approved Arabic footer */
          .site-footer{background:#092f3b!important;color:#dce9ec!important;padding:38px 0 24px!important;border-top:0!important}
          .site-footer .footer-wrap{display:block!important;width:min(1160px,calc(100% - 40px))!important;margin:0 auto!important}
          .site-footer .footer-top{display:grid!important;grid-template-columns:minmax(210px,.8fr) minmax(0,2.2fr)!important;gap:72px!important;align-items:start!important;padding-bottom:30px!important}
          .site-footer .footer-brand{display:flex!important;align-items:center!important;gap:11px!important;color:#fff!important}
          .site-footer .footer-brand .brand-icon{width:60px!important;height:60px!important;flex:0 0 60px!important;object-fit:contain!important}
          .site-footer .footer-brand .brand-text{display:flex!important;flex-direction:column!important;align-items:flex-start!important;line-height:1.08!important;color:#fff!important}
          .site-footer .footer-brand .brand-text strong{font-size:16px!important;font-weight:800!important;color:#fff!important;white-space:nowrap!important}
          .site-footer .footer-brand .brand-text span{font-size:12px!important;font-weight:650!important;color:#fff!important;margin-top:4px!important;white-space:nowrap!important}
          .site-footer .footer-links{display:grid!important;grid-template-columns:repeat(3,minmax(150px,1fr))!important;gap:14px 42px!important;align-content:start!important;text-align:left!important}
          .site-footer .footer-links a{display:block!important;padding:0!important;margin:0!important;color:#d6e5e8!important;font-size:13px!important;font-weight:600!important;line-height:1.55!important;opacity:1!important}
          .site-footer .footer-links a:hover{color:#8fd8cf!important}
          .site-footer .footer-bottom{display:block!important;border-top:1px solid rgba(255,255,255,.16)!important;padding-top:20px!important;color:#d6e5e8!important;font-size:12.5px!important;line-height:1.7!important}
          .site-footer .footer-bottom p{margin:0!important;color:#d6e5e8!important;text-align:left!important;width:100%!important;max-width:none!important;white-space:normal!important}
          @media(max-width:820px){.site-footer .footer-top{grid-template-columns:1fr!important;gap:28px!important}.site-footer .footer-links{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
          @media(max-width:520px){.site-footer{padding:34px 0 20px!important}.site-footer .footer-links{grid-template-columns:1fr!important}}
          CSS
          git config user.name 'Elajme India QA'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html styles.css
          git commit -m 'Make English homepage footer match Arabic design exactly'
          git push
