name: Unify inner footers and dark CTA
on:
  push:
    paths:
      - '.github/workflows/unify-inner-footer-and-dark-cta-once.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply shared footer and CTA CSS
        env:
          FIX_CSS_B64: 
        run: echo "$FIX_CSS_B64" | base64 -d >> assets/css/site-shell.css
      - name: Commit fixes
        run: |
          git config user.name "Elajme India QA"
          git config user.email "actions@users.noreply.github.com"
          git add assets/css/site-shell.css
          git commit -m "Unify inner-page footers and fix dark CTA contrast"
          git push
