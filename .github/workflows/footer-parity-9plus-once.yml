name: Refresh English homepage approved footer only

on:
  push:
    paths:
      - ".github/workflows/footer-parity-9plus-once.yml"

permissions:
  contents: write

jobs:
  fix-home-footer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh only English homepage footer stylesheet
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          html=p.read_text(encoding='utf-8')
          html=re.sub(r'<link[^>]+footer-approved\.css[^>]*>', '<link rel="stylesheet" href="/assets/css/footer-approved.css?v=4">', html, count=1, flags=re.I)
          p.write_text(html,encoding='utf-8')
          print('Updated index.html only; no other page touched')
          PY
      - name: Commit homepage-only refresh
        shell: bash
        run: |
          git config user.name "Elajme India QA"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh approved footer CSS on English homepage only"
          git push
