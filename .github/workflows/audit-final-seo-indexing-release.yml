name: Audit final SEO indexing and release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-final-seo-indexing-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit indexability canonical hreflang sitemap and bilingual release readiness
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, urllib.parse, xml.etree.ElementTree as ET

          root=Path('.')
          pages=list(root.rglob('*.html'))
          blocking=[]; warnings=[]
          indexable=[]

          def route_for(p):
              s=p.as_posix()
              if s=='index.html': return '/'
              if s.endswith('/index.html'): return '/'+s[:-10]
              return '/'+s

          def exists_route(href):
              href=urllib.parse.urlsplit(href).path
              if not href.startswith('/') or href.startswith('//'): return True
              if href=='/': return (root/'index.html').is_file()
              p=root/href.lstrip('/')
              return p.is_file() or (p/'index.html').is_file()

          for p in pages:
              text=p.read_text(errors='ignore')
              low=text.lower()
              route=route_for(p)
              noindex=bool(re.search(r'<meta[^>]+name=["\']robots["\'][^>]+content=["\'][^"\']*noindex',text,re.I))
              redirect=('http-equiv="refresh"' in low or "http-equiv='refresh'" in low)
              if noindex or redirect: continue
              indexable.append(route)
              title=re.search(r'<title>(.*?)</title>',text,re.I|re.S)
              desc=re.search(r'<meta[^>]+name=["\']description["\'][^>]+content=["\']([^"\']+)',text,re.I)
              canon=re.search(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)',text,re.I)
              if not title or not title.group(1).strip(): blocking.append(f'MISSING_TITLE {p}')
              if not desc or len(desc.group(1).strip())<50: warnings.append(f'WEAK_DESCRIPTION {p}')
              if not canon: blocking.append(f'MISSING_CANONICAL {p}')
              else:
                  c=canon.group(1)
                  if not c.startswith('https://elajmeindia.com/'): blocking.append(f'BAD_CANONICAL {p}: {c}')
              # EN/AR pages should advertise both language alternates when a counterpart exists.
              is_ar=route.startswith('/ar/') or route=='/ar/'
              counterpart=None
              if is_ar:
                  counterpart=route[3:] or '/'
              elif route.startswith('/'):
                  counterpart='/ar'+route
              if counterpart and exists_route(counterpart):
                  en=bool(re.search(r'hreflang=["\']en["\']',text,re.I))
                  ar=bool(re.search(r'hreflang=["\']ar["\']',text,re.I))
                  xd=bool(re.search(r'hreflang=["\']x-default["\']',text,re.I))
                  if not (en and ar): blocking.append(f'HREFLANG_PAIR {p}')
                  if not xd: warnings.append(f'NO_XDEFAULT {p}')
              # root-relative links should resolve in repository, ignoring assets/anchors.
              for href in re.findall(r'href=["\']([^"\']+)',text,re.I):
                  if href.startswith(('/assets/','/#','/ar/#','#','mailto:','tel:','http://','https://','//')): continue
                  if href.startswith('/') and not exists_route(href): warnings.append(f'UNRESOLVED_LINK {p}: {href}')

          # Sitemap coverage for indexable canonical routes.
          sitemap=root/'sitemap.xml'
          if not sitemap.is_file(): blocking.append('MISSING_SITEMAP sitemap.xml')
          else:
              st=sitemap.read_text(errors='ignore')
              locs=set(re.findall(r'<loc>\s*(.*?)\s*</loc>',st,re.I))
              for route in indexable:
                  # exclude utility html aliases that intentionally canonicalize elsewhere
                  expected='https://elajmeindia.com'+route
                  if expected not in locs and route not in ('/404.html','/privacy.html','/terms.html','/ar/privacy.html','/ar/terms.html'):
                      warnings.append(f'NOT_IN_SITEMAP {route}')

          print('FINAL SEO + INDEXING + RELEASE AUDIT')
          print('HTML pages:',len(pages))
          print('Indexable pages checked:',len(indexable))
          print('Blocking issues:',len(blocking))
          for x in blocking[:100]: print('BLOCK',x)
          print('Review warnings:',len(warnings))
          for x in warnings[:150]: print('WARN',x)
          if blocking:
              raise SystemExit(f'Final release audit found {len(blocking)} blocking issue(s)')
          PY
      - name: Verify locked production assets unchanged
        run: |
          test -z "$(git status --porcelain -- assets/css/master-header.css assets/css/arabic-master-header.css assets/css/footer-approved.css FOOTER-LOCK.md)"
