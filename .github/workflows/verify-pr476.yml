name: PR 476 Arabic doctor links and live Mumbai blog
on:
  pull_request:
    paths: ['.github/workflows/verify-pr476.yml', 'scripts/verify-pr476.cjs']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit playwright@1.56.1 && npx playwright install chromium
      - shell: bash
        run: |
          mkdir -p evidence
          node scripts/verify-pr476.cjs | tee evidence/results.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr476-arabic-doctor-and-live-mumbai
          path: evidence/
          retention-days: 7
