name: Fix Arabic footer layout final
on:
  push:
    paths:
      - '.github/workflows/fix-arabic-footer-layout-final.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add final Arabic homepage footer layout
        run: |
          cat >> assets/css/site-shell.css <<'CSS'

/* Final Arabic homepage footer parity: mirror the English footer cleanly. */
[dir="rtl"] .site-footer .footer-wrap{
  display:grid!important;
  grid-template-columns:minmax(0,1.7fr) minmax(240px,.7fr)!important;
  grid-template-areas:"links brand" "copy copy"!important;
  column-gap:72px!important;
  row-gap:28px!important;
  align-items:start!important;
  direction:ltr!important;
  padding-top:0!important;
  padding-bottom:0!important;
}
[dir="rtl"] .site-footer .footer-brand{
  grid-area:brand!important;
  display:flex!important;
  align-items:center!important;
  justify-content:flex-start!important;
  gap:11px!important;
  direction:ltr!important;
  min-width:0!important;
}
[dir="rtl"] .site-footer .footer-brand .brand-icon{
  display:block!important;
  width:60px!important;
  height:60px!important;
  flex:0 0 60px!important;
  object-fit:contain!important;
}
[dir="rtl"] .site-footer .footer-brand .brand-text{
  display:flex!important;
  flex-direction:column!important;
  align-items:flex-start!important;
  justify-content:center!important;
  text-align:left!important;
  line-height:1.08!important;
  color:#fff!important;
}
[dir="rtl"] .site-footer .footer-brand .brand-text strong{
  font-size:14px!important;
  font-weight:800!important;
  color:#fff!important;
  white-space:nowrap!important;
}
[dir="rtl"] .site-footer .footer-brand .brand-text span{
  margin-top:3px!important;
  font-size:12px!important;
  color:#fff!important;
  direction:rtl!important;
  text-align:right!important;
  white-space:nowrap!important;
}
[dir="rtl"] .site-footer .footer-links{
  grid-area:links!important;
  display:grid!important;
  grid-template-columns:repeat(3,minmax(130px,1fr))!important;
  gap:14px 42px!important;
  direction:rtl!important;
  text-align:right!important;
  align-content:start!important;
}
[dir="rtl"] .site-footer .footer-links a{
  display:block!important;
  padding:0!important;
  margin:0!important;
  font-size:12px!important;
  line-height:1.55!important;
  color:#b8ced4!important;
  white-space:normal!important;
}
[dir="rtl"] .site-footer .footer-wrap>p{
  grid-area:copy!important;
  margin:0!important;
  padding-top:18px!important;
  border-top:1px solid rgba(255,255,255,.12)!important;
  color:#c3d6db!important;
  font-size:12px!important;
  line-height:1.7!important;
  direction:rtl!important;
  text-align:right!important;
}
@media(max-width:820px){
  [dir="rtl"] .site-footer .footer-wrap{
    grid-template-columns:1fr!important;
    grid-template-areas:"brand" "links" "copy"!important;
    row-gap:24px!important;
    direction:rtl!important;
  }
  [dir="rtl"] .site-footer .footer-brand{justify-content:flex-start!important;justify-self:stretch!important}
  [dir="rtl"] .site-footer .footer-links{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px 28px!important}
}
@media(max-width:520px){
  [dir="rtl"] .site-footer .footer-links{grid-template-columns:1fr!important}
}
CSS
      - name: Commit footer layout fix
        run: |
          git config user.name "Elajme India QA"
          git config user.email "actions@users.noreply.github.com"
          git add assets/css/site-shell.css
          git commit -m "Fix Arabic homepage footer visual parity"
          git push
