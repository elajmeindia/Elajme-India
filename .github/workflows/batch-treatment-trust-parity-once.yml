name: Align Arabic neurosurgery specialist links once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/batch-treatment-trust-parity-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align Arabic neurosurgery specialist links
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('ar/treatments/neurosurgery-india/index.html')
          text=p.read_text(); fi=text.lower().find('<footer'); assert fi>=0
          pre,foot=text[:fi],text[fi:]
          old='<h2>استكشف الأطباء والمستشفيات</h2><div class="related"><a href="/ar/doctors/">دليل الأطباء</a><a href="/ar/hospitals/">دليل المستشفيات</a><a href="/ar/international-patients/mea/">دليل المرضى الدوليين</a><a href="/ar/treatments/spine-surgery-india/">جراحة العمود الفقري</a></div>'
          new='<h2>استكشف الأطباء والمستشفيات</h2><div class="related"><a href="/ar/doctors/dr-aditya-gupta/">د. أديتيا غوبتا</a><a href="/ar/doctors/dr-jayesh-sardhara/">د. جايش ساردارا</a><a href="/ar/hospitals/blk-max-super-speciality-hospital-delhi/">BLK-Max دلهي</a><a href="/ar/hospitals/artemis-hospital-gurugram/">مستشفى أرتيمس، جوروجرام</a><a href="/ar/hospitals/max-super-speciality-hospital-noida/">ماكس نويدا</a><a href="/ar/hospitals/wockhardt-hospitals-mumbai-central/">ووكهارت مومباي سنترال</a><a href="/ar/treatments/spine-surgery-india/">جراحة العمود الفقري</a><a href="/ar/patient-guide/">دليل المريض الدولي</a></div>'
          if new not in pre:
              assert old in pre, 'expected Arabic neurosurgery related section not found'
              pre=pre.replace(old,new,1)
              p.write_text(pre+foot)
              print('Changed Arabic neurosurgery specialist links')
          else:
              print('Already aligned')
          for q in [Path('FOOTER-LOCK.md'),Path('assets/css/footer-approved.css')]: print('LOCK',q,hashlib.sha256(q.read_bytes()).hexdigest())
          PY
      - name: Commit Arabic neurosurgery parity
        run: |
          if git diff --quiet -- ar/treatments/neurosurgery-india/index.html; then echo 'No changes required'; exit 0; fi
          git config user.name 'elajmeindia'
          git config user.email 'shahzadalamnadwi@gmail.com'
          git add ar/treatments/neurosurgery-india/index.html
          git commit -m 'Align Arabic neurosurgery specialist links'
          git push
