name: Arabic footer parity one-time fix
on:
  push:
    paths:
      - '.github/workflows/arabic-footer-parity-once.yml'
permissions:
  contents: write
jobs:
  fix-footer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append Arabic homepage footer parity styles
        run: |
          cat >> assets/css/site-shell.css <<'CSS'

          /* Arabic homepage footer: mirror the English homepage footer geometry. */
          [dir="rtl"] .site-footer{padding:46px 0 28px!important;direction:rtl;text-align:right}
          [dir="rtl"] .site-footer .footer-grid{display:grid!important;grid-template-columns:1.15fr 2.85fr!important;gap:72px!important;align-items:start!important;direction:rtl!important;text-align:right!important}
          [dir="rtl"] .site-footer .brand{direction:ltr!important;justify-content:flex-start!important;margin:0 0 28px!important}
          [dir="rtl"] .site-footer .brand-icon{width:60px!important;height:60px!important;flex:0 0 60px!important}
          [dir="rtl"] .site-footer .brand-text{align-items:flex-end!important;text-align:right!important}
          [dir="rtl"] .site-footer .footer-links{display:grid!important;grid-template-columns:repeat(3,minmax(150px,1fr))!important;column-gap:64px!important;row-gap:18px!important;direction:rtl!important;text-align:right!important;align-items:start!important}
          [dir="rtl"] .site-footer .footer-links a{display:block!important;font-size:13px!important;line-height:1.55!important;color:#c9dadd!important;text-align:right!important;white-space:normal!important}
          [dir="rtl"] .site-footer .footer-bottom{display:grid!important;grid-template-columns:1.15fr 2.85fr!important;gap:72px!important;direction:rtl!important;text-align:right!important;align-items:start!important;margin-top:30px!important;padding-top:18px!important;font-size:13px!important;line-height:1.7!important;color:#d6e5e8!important}
          [dir="rtl"] .site-footer .footer-bottom>*{text-align:right!important;margin:0!important}
          @media(max-width:820px){[dir="rtl"] .site-footer .footer-grid,[dir="rtl"] .site-footer .footer-bottom{grid-template-columns:1fr!important;gap:26px!important}[dir="rtl"] .site-footer .footer-links{grid-template-columns:repeat(2,minmax(0,1fr))!important;column-gap:28px!important}}
          @media(max-width:520px){[dir="rtl"] .site-footer .footer-links{grid-template-columns:1fr!important}}
          CSS
      - name: Remove one-time workflow and commit fix
        run: |
          rm .github/workflows/arabic-footer-parity-once.yml
          git config user.name "Elajme India QA"
          git config user.email "actions@users.noreply.github.com"
          git add assets/css/site-shell.css .github/workflows/arabic-footer-parity-once.yml
          git commit -m "Match Arabic homepage footer to English layout"
          git push