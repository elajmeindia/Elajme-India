name: Inspect three official doctor portrait sources
on:
  push:
    paths:
      - '.github/workflows/inspect-three-doctor-portraits.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check official source images
        run: |
          python - <<'PY'
          import requests,re,html
          urls={
            'kanchan_profile_portrait':'https://drupal-cdn-hfaeddcdbng5hfbg.a01.azurefd.net/sites/default/files/2026-07/whatsapp-image-2026-07-31-at-13.28.29.jpeg',
            'nishchint_profile_portrait':'https://images.apollo247.in/doctors/9f3aed98-015d-45fc-b4ee-581f2a7b6d2f.jpg',
            'uma':'https://www.apollohospitals.com/doctors/nuclear-medicine-physician/delhi/dr-uma-ravishankar',
            'uma_cancer':'https://www.apollohospitals.com/cancer-treatment-centres/cancer-hospital/delhi/nuclear-medicine/dr-uma-ravishanka/bio/',
            'prasun':'https://www.apollohospitals.com/doctors/geriatrician/delhi/dr-prasun-chatterjee',
            'prasun_personal':'https://drprasunchatterjee.com/',
            'dhavendra':'https://www.qmul.ac.uk/whri/people/academic-staff/items/dhavendrakumar.html',
            'uma_apollo247':'https://www.apollo247.com/doctors/dr-uma-ravishankar-e1f97ad1-5301-40e0-8923-9ef7e52cd30a',
            'uma_alternative':'https://www.apollocancercentres.com/doctor/dr-uma-ravishankar/',
            'prasun_image':'https://drprasunchatterjee.com/wp-content/uploads/2026/05/dr-prasun-chatterjee.jpeg',
            'uma_image':'https://images.apollo247.in/doctors/bf9ef813-0c0e-47e6-99aa-bddba348b7f7.jpg',
            'achal_apollo247':'https://www.apollo247.com/doctors/dr-achal-bhagat-887f4694-b8d3-4e5c-a502-35ab1062d401',
            'adosh_apollo247':'https://www.apollo247.com/doctors/dr-adosh-lall-172a65ea-3b98-448d-8c5b-4e6c6cb30863',
            'dhavendra_image':'https://www.spirehealthcare.com/media/15482/kumar-dhavendra.jpg',
          }
          for name,url in urls.items():
            try:
              r=requests.get(url,timeout=15,headers={'User-Agent':'Mozilla/5.0'})
              print('PAGE',name,r.status_code,len(r.content),r.headers.get('Content-Type','unknown'))
              for pattern in [r'<meta[^>]+(?:og:image|twitter:image)[^>]+>',r'<img[^>]+(?:uma|prasun|dhavendra|kumar|doctor)[^>]*>']:
                for match in re.findall(pattern,r.text,re.I)[:8]:
                  print('IMAGE_CANDIDATE',name,html.unescape(match[:600]))
            except Exception as e:print('ERROR',name,str(e))
          PY
