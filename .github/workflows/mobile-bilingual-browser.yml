name: Mobile Bilingual Browser Journey
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-bilingual-browser.yml'
      - 'index.html'
      - 'ar/index.html'
      - 'assets/js/mobile-header.js'
      - 'doctors/**'
      - 'ar/doctors/**'
      - 'treatments/**'
      - 'ar/treatments/**'
      - 'assets/images/doctors/portrait-unavailable.svg'
  workflow_dispatch:
  schedule:
    - cron: '43 4 * * *'
permissions:
  contents: read
jobs:
  mobile-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test live English and Arabic mobile journeys
        env:
          SITE_ORIGIN: https://elajmeindia.com
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const origin=process.env.SITE_ORIGIN;
            const errors=[];
            for(const path of ['/','/ar/','/doctors/','/ar/doctors/','/hospitals/','/ar/hospitals/']){
              try{
                const response=await page.goto(origin+path,{waitUntil:'domcontentloaded',timeout:25000});
                if(!response||response.status()!==200)throw Error('HTTP '+(response?.status()??'none'));
                await page.waitForTimeout(500);
                const lang=path.startsWith('/ar/')?'ar':'en';
                const htmlLang=await page.locator('html').getAttribute('lang');
                if(htmlLang?.toLowerCase()!==lang)errors.push(path+': incorrect html language '+htmlLang);
                if(lang==='ar' && await page.locator('html').getAttribute('dir')!=='rtl')errors.push(path+': missing RTL');
                const overflow=await page.evaluate(()=>({
                  documentWidth:document.documentElement.scrollWidth,
                  viewportWidth:window.innerWidth
                }));
                if(overflow.documentWidth>overflow.viewportWidth+2)
                  errors.push(path+': horizontal overflow '+overflow.documentWidth+'px > '+overflow.viewportWidth+'px');
                const images=await page.locator('img').evaluateAll(nodes=>nodes.filter(img=>{
                  const rect=img.getBoundingClientRect();
                  return rect.width>0 && rect.height>0 && rect.top<window.innerHeight && rect.bottom>0 && img.complete && img.naturalWidth===0;
                }).slice(0,8).map(img=>img.getAttribute('src')));
                if(images.length)errors.push(path+': visible broken images '+images.join(', '));
                const menu=page.locator('.master-mobile-menu').first();
                if(await menu.count()){
                  await menu.click();
                  if(await menu.getAttribute('aria-expanded')!=='true')errors.push(path+': mobile menu did not open');
                  await menu.click();
                  if(await menu.getAttribute('aria-expanded')!=='false')errors.push(path+': mobile menu did not close');
                }else errors.push(path+': mobile menu not found');
                const wa=page.locator('a[href^="https://wa.me/917488955154"]').first();
                if(!await wa.count())errors.push(path+': Elajme WhatsApp link missing');
                if(path==='/'||path==='/ar/'){
                  if(!await page.locator('#patientEnquiryForm').count())errors.push(path+': patient enquiry form missing');
                }
                console.log('CHECK',path,'HTTP',response.status());
              }catch(e){errors.push(path+': '+e.message)}
            }
            // Scroll through directory cards so lazy-loaded external portraits are checked in a real browser.
            for(const path of ['/doctors/','/ar/doctors/','/hospitals/','/ar/hospitals/']){
              try{
                await page.goto(origin+path,{waitUntil:'domcontentloaded',timeout:25000});
                const result=await page.evaluate(async()=>{
                  const imgs=[...document.querySelectorAll('article img')];
                  for(const img of imgs){img.loading='eager';}
                  await Promise.all(imgs.map(img=>Promise.race([
                    img.decode().catch(()=>{}),
                    new Promise(resolve=>setTimeout(resolve,12000))
                  ])));
                  await new Promise(resolve=>setTimeout(resolve,900));
                  await Promise.all(imgs.filter(img=>!img.complete||img.naturalWidth===0).map(img=>img.decode().catch(()=>{})));
                  return {count:imgs.length,broken:imgs.filter(img=>!img.complete||img.naturalWidth===0).map(img=>({src:img.currentSrc||img.src,alt:img.alt})).slice(0,35),fallbacks:imgs.filter(img=>(img.currentSrc||img.src).includes('/portrait-unavailable.svg')).length,fallbackDoctors:imgs.filter(img=>(img.currentSrc||img.src).includes('/portrait-unavailable.svg')).map(img=>({name:img.closest('article')?.querySelector('h2')?.textContent?.trim()||img.alt,profile:img.closest('article')?.querySelector('a.outline, a[href*="dr-"]')?.getAttribute('href')||null}))};
                });
                console.log('PROVIDER DIRECTORY IMAGE SCAN',path,JSON.stringify(result));
                if(result.broken.length)errors.push(path+': '+result.broken.length+' broken provider directory images: '+JSON.stringify(result.broken));
                if((path==='/doctors/'||path==='/ar/doctors/')&&result.fallbacks>9)console.warn('EXTERNAL PORTRAIT AVAILABILITY WARNING',path,result.fallbacks,'fallbacks; verified best observed 9; remote CDN delivery varies');
              }catch(e){errors.push(path+': directory image scan '+e.message)}
            }
            // Check first-party profile pages for the doctors whose directory portraits needed fallbacks.
            const affected=['dr-aloy-j-mukherjee','dr-ameet-kishore','dr-anup-dhir','dr-geeta-kadayaprath','dr-kalyanpury-jawaharlal-choudhury','dr-deepa-sharma','dr-dinesh-talwar','dr-hardeep-singh','dr-jatin-ahuja','dr-kulbhushan-attri','dr-neeraj-singh','dr-sandip-agnihotri','dr-saveena-gulati-raheja','dr-sundeep-kumar-upadhyaya','dr-vinit-suri','dr-anil-mandhani'];
            for(const slug of affected){
              for(const prefix of ['/doctors/','/ar/doctors/']){
                const path=prefix+slug+'/';
                try{
                  const response=await page.goto(origin+path,{waitUntil:'domcontentloaded',timeout:25000});
                  if(response?.status()!==200){console.log('PROFILE PORTRAIT REVIEW',path,'HTTP '+response?.status());continue}
                  const result=await page.evaluate(async()=>{
                    const img=document.querySelector('img.profile-photo') || [...document.images].find(img=>img.getAttribute('fetchpriority')==='high' && img.alt?.trim()) || [...document.images].find(img=>img.getAttribute('onerror')?.includes('portrait-unavailable.svg')) || [...document.images].find(img=>img.src.startsWith('http') && /doctor|dr[. ]|طبيب/i.test(img.alt||''));
                    if(!img)return {missing:true};
                    await Promise.race([img.decode().catch(()=>{}),new Promise(resolve=>setTimeout(resolve,7000))]);
                    if(!img.complete||img.naturalWidth===0){await new Promise(resolve=>setTimeout(resolve,800));await img.decode().catch(()=>{});}
                    return {src:img.currentSrc||img.src,loaded:img.complete&&img.naturalWidth>0,placeholder:(img.currentSrc||img.src).includes('/portrait-unavailable.svg')};
                  });
                  console.log('PROFILE PORTRAIT REVIEW',path,JSON.stringify(result));
                  if(!result.loaded)errors.push(path+': broken profile portrait '+JSON.stringify(result));
                }catch(e){errors.push(path+': profile portrait scan '+e.message)}
              }
            }
            // Verify the two recently updated doctor portraits on both live language pages.
            for(const slug of ['dr-kanchan-bansode','dr-nishchint-jain']){
              for(const prefix of ['/doctors/','/ar/doctors/']){
                const path=prefix+slug+'/';
                try{
                  const response=await page.goto(origin+path,{waitUntil:'domcontentloaded',timeout:25000});
                  if(response?.status()!==200){errors.push(path+': HTTP '+response?.status());continue}
                  const result=await page.evaluate(async()=>{
                    const imgs=[...document.images].filter(img=>img.alt?.toLowerCase().includes('portrait'));
                    if(!imgs.length)return {error:'portrait element missing'};
                    const img=imgs[0];
                    await Promise.race([img.decode().catch(()=>{}),new Promise(resolve=>setTimeout(resolve,12000))]);
                    return {src:img.currentSrc||img.src,loaded:img.complete&&img.naturalWidth>0};
                  });
                  if(result.error||!result.loaded)errors.push(path+': portrait failed to render '+(result.error||result.src));
                  else console.log('PORTRAIT OK',path,result.src);
                }catch(e){errors.push(path+': portrait verification '+e.message)}
              }
            }
            for(const lang of ['en','ar']){
              const prefix=lang==='ar'?'/ar':'';
              const treatment=prefix+'/treatments/';
              const directory=prefix+'/doctors/';
              try{
                await page.goto(origin+treatment,{waitUntil:'domcontentloaded',timeout:25000});
                if(!await page.locator('a[href="'+directory+'"]').count())errors.push(treatment+': doctor directory route missing');
                await page.goto(origin+directory,{waitUntil:'domcontentloaded',timeout:25000});
                const hrefs=await page.locator('a[href]').evaluateAll(nodes=>nodes.map(n=>n.getAttribute('href')));
                const profileHref=hrefs.map(h=>{
                  try{return new URL(h,origin+directory)}catch{return null}
                }).find(u=>u && u.origin===new URL(origin).origin && u.pathname.startsWith(directory) && u.pathname!==directory && u.pathname.split('/').filter(Boolean).length===directory.split('/').filter(Boolean).length+1);
                if(!profileHref){errors.push(directory+': doctor profile link missing');continue}
                const response=await page.goto(profileHref.href,{waitUntil:'domcontentloaded',timeout:25000});
                if(response?.status()!==200)errors.push(profileHref.pathname+': profile HTTP '+response?.status());
                const enquiry=lang==='ar'?'/ar/#enquiry':'/#enquiry';
                if(!await page.locator('a[href="'+enquiry+'"]').count())errors.push(profileHref.pathname+': Elajme enquiry route missing');
                console.log('JOURNEY',treatment,'->',directory,'->',profileHref.pathname,'->',enquiry);
              }catch(e){errors.push(lang+': treatment-to-enquiry journey: '+e.message)}
            }
            for(const path of ['/','/ar/']){
              try{
                await page.goto(origin+path,{waitUntil:'domcontentloaded',timeout:25000});
                const generated=await page.evaluate(()=>{
                  const form=document.getElementById('patientEnquiryForm');
                  const fields={patientName:'Test Patient',patientCountry:'Test Country',patientMobile:'+971501234567',preferredLanguage:'Arabic'};
                  for(const [id,value] of Object.entries(fields)){const el=document.getElementById(id);if(!el)return {error:'missing '+id};el.value=value}
                  if(!form.checkValidity())return {error:'test form invalid'};
                  const original=window.open;
                  let target=null;
                  window.open=(url)=>{target=String(url);return {closed:false}};
                  try{form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}))}
                  catch(e){return {error:e.message}}
                  finally{window.open=original;for(const id of Object.keys(fields))document.getElementById(id).value=''}
                  return {target};
                });
                if(generated.error)errors.push(path+': enquiry routing '+generated.error);
                else if(!generated.target?.startsWith('https://wa.me/917488955154?text='))
                  errors.push(path+': enquiry does not route to Elajme WhatsApp');
                console.log('ENQUIRY DESTINATION',path,generated.error||'Elajme WhatsApp (intercepted; not sent)');
                const result=await page.locator('#patientEnquiryForm').evaluate(form=>{
                  const required=['patientName','patientCountry','patientMobile','preferredLanguage'];
                  const missing=required.filter(id=>!form.querySelector('#'+id));
                  const initiallyInvalid=!form.checkValidity();
                  const inputs=required.map(id=>form.querySelector('#'+id));
                  if(inputs.every(Boolean)){
                    inputs[0].value='Test Patient';
                    inputs[1].value='Test Country';
                    inputs[2].value='+971501234567';
                    inputs[3].value='Arabic';
                    inputs.forEach(el=>el.dispatchEvent(new Event('input',{bubbles:true})));
                  }
                  const validAfterFill=form.checkValidity();
                  inputs.forEach(el=>{if(el)el.value=el.tagName==='SELECT'?'English':''});
                  return {missing,initiallyInvalid,validAfterFill};
                });
                if(result.missing.length)errors.push(path+': missing enquiry fields '+result.missing.join(','));
                if(!result.initiallyInvalid)errors.push(path+': blank enquiry form should be invalid');
                if(!result.validAfterFill)errors.push(path+': valid enquiry form rejected');
                console.log('FORM VALIDATION',path,JSON.stringify(result),'NO SUBMISSION');
              }catch(e){errors.push(path+': enquiry validation: '+e.message)}
            }
            if(errors.length){
              const fs=require('fs');
              fs.mkdirSync('qa-artifacts',{recursive:true});
              fs.writeFileSync('qa-artifacts/failures.txt',errors.join('\n')+'\n');
              try{await page.screenshot({path:'qa-artifacts/last-mobile-page.png',fullPage:true})}catch(e){console.error('Screenshot unavailable:',e.message)}
            }
            await browser.close();
            errors.forEach(e=>console.error('FAIL',e));
            console.log('MOBILE BILINGUAL BROWSER:',errors.length,'issues');
            if(errors.length)process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-bilingual-failure-evidence
          path: qa-artifacts/
          if-no-files-found: ignore
          retention-days: 14
