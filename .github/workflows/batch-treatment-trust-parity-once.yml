name: Fix GCC bilingual country parity once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/batch-treatment-trust-parity-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix GCC language switches and Arabic treatment links
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re

          countries=['saudi-arabia','uae','oman','qatar','kuwait','bahrain']
          treatment_links='''<a href="/ar/treatments/cancer-treatment-india/">علاج السرطان</a><a href="/ar/treatments/heart-treatment-india/">علاج القلب</a><a href="/ar/treatments/liver-transplant-india/">زراعة الكبد</a><a href="/ar/treatments/kidney-transplant-india/">زراعة الكلى</a><a href="/ar/treatments/knee-replacement-india/">استبدال مفصل الركبة</a><a href="/ar/treatments/neurosurgery-india/">جراحة الأعصاب</a><a href="/ar/treatments/spine-surgery-india/">جراحة العمود الفقري</a><a href="/ar/treatments/urology-treatment-india/">المسالك البولية</a><a href="/ar/treatments/gastroenterology-treatment-india/">أمراض الجهاز الهضمي</a>'''
          locked_files=[Path('FOOTER-LOCK.md'),Path('assets/css/footer-approved.css')]
          locked={p:hashlib.sha256(p.read_bytes()).hexdigest() for p in locked_files}
          changed=[]

          for country in countries:
            p=Path('ar')/country/'treatment-in-india/index.html'
            if not p.exists(): raise SystemExit(f'Missing GCC Arabic page: {p}')
            text=p.read_text(); low=text.lower(); fi=low.find('<footer')
            if fi < 0: raise SystemExit(f'No footer boundary: {p}')
            before,footer=text[:fi],text[fi:]
            expected=f'/{country}/treatment-in-india/'
            before,n=re.subn(r'<a class="shell-lang" href="[^"]*">English</a>',f'<a class="shell-lang" href="{expected}">English</a>',before,count=1)
            if n != 1: raise SystemExit(f'English switch not found exactly once: {p}')

            # Strengthen treatment-level internal linking only where the page lacks direct Arabic treatment links.
            if '/ar/treatments/cancer-treatment-india/' not in before:
              generic='<a href="/ar/treatments/">العلاجات</a>'
              if generic in before:
                before=before.replace(generic,treatment_links+generic,1)
              else:
                raise SystemExit(f'Arabic treatments hub link not found: {p}')

            new=before+footer
            if new != text:
              p.write_text(new); changed.append(str(p))

          for p,h in locked.items():
            if hashlib.sha256(p.read_bytes()).hexdigest()!=h:
              raise SystemExit(f'LOCKED FOOTER FILE CHANGED: {p}')

          for country in countries:
            ar=Path('ar')/country/'treatment-in-india/index.html'
            en=Path(country)/'treatment-in-india/index.html'
            if not en.exists(): raise SystemExit(f'Missing English counterpart: {en}')
            text=ar.read_text(); pre=text[:text.lower().find('<footer')]
            expected=f'/{country}/treatment-in-india/'
            if f'<a class="shell-lang" href="{expected}">English</a>' not in pre:
              raise SystemExit(f'Wrong English language switch: {ar}')
            if not re.search(r'<html[^>]+lang="ar"[^>]+dir="rtl"|<html[^>]+dir="rtl"[^>]+lang="ar"',text,re.I):
              raise SystemExit(f'Arabic RTL failure: {ar}')
            if '/ar/#enquiry' not in pre: raise SystemExit(f'Elajme enquiry route missing: {ar}')
            for slug in ['cancer-treatment-india','heart-treatment-india','liver-transplant-india','kidney-transplant-india','knee-replacement-india','neurosurgery-india','spine-surgery-india','urology-treatment-india','gastroenterology-treatment-india']:
              if f'/ar/treatments/{slug}/' not in pre: raise SystemExit(f'Missing Arabic treatment link {slug}: {ar}')
          print(f'Changed pages: {len(changed)}')
          for p in changed: print(p)
          print('GCC BILINGUAL COUNTRY PARITY: CLEAN')
          PY
      - name: Commit GCC parity fixes
        shell: bash
        run: |
          if git diff --quiet -- ar; then
            echo 'No GCC page changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ar/saudi-arabia ar/uae ar/oman ar/qatar ar/kuwait ar/bahrain
          git commit -m 'Fix GCC bilingual navigation and treatment links'
          git push
