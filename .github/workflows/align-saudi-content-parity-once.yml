name: Strengthen Qatar patient search journey once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/align-saudi-content-parity-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add bilingual Qatar pre-travel decision guidance
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          changes={
          'qatar/treatment-in-india/index.html':(
            '<section class="sec"><div class="c"><h2>Explore treatment options in India</h2>',
            '<section class="sec"><div class="c"><h2>Before you decide to travel from Qatar</h2><div class="grid"><article class="card"><h3>Review the medical response</h3><p>Check the hospital or specialist response carefully, including whether more reports, tests or an in-person assessment are needed before a final treatment plan can be confirmed.</p></article><article class="card"><h3>Understand the preliminary estimate</h3><p>Review what the available hospital estimate includes. Final charges can change after examination, investigations, procedure selection, medicines, implants, complications or changes in length of stay.</p></article><article class="card"><h3>Confirm the practical plan</h3><p>Before booking travel, confirm the intended hospital, available appointment information, documents requested by the medical team and any preparation communicated for the visit.</p></article><article class="card"><h3>Prepare for medical travel</h3><p>Use the international patient guide and current medical-visa guidance to organise your records, hospital correspondence and practical treatment-visit documents.</p></article></div><div class="note">Elajme India can coordinate these steps, but clinical recommendations, hospital acceptance, final costs and visa decisions remain with the relevant medical teams and authorities.</div></div></section><section class="sec"><div class="c"><h2>Explore treatment options in India</h2>'
          ),
          'ar/qatar/treatment-in-india/index.html':(
            '<section class="sec"><div class="c"><h2>استكشف قبل إرسال الاستفسار</h2>',
            '<section class="sec"><div class="c"><h2>قبل اتخاذ قرار السفر من قطر</h2><div class="grid"><article class="card"><h3>راجع الرد الطبي</h3><p>راجع رد المستشفى أو الطبيب بعناية، بما في ذلك ما إذا كانت هناك حاجة إلى تقارير أو فحوصات إضافية أو تقييم حضوري قبل تأكيد الخطة العلاجية النهائية.</p></article><article class="card"><h3>افهم التقدير المبدئي للتكلفة</h3><p>راجع ما يشمله التقدير المتاح من المستشفى. قد تتغير التكلفة النهائية بعد الفحص أو الفحوصات أو اختيار الإجراء أو الأدوية أو المستلزمات أو المضاعفات أو مدة الإقامة.</p></article><article class="card"><h3>أكد الخطة العملية</h3><p>قبل حجز السفر، تأكد من المستشفى المقصود ومعلومات الموعد المتاحة والمستندات التي يطلبها الفريق الطبي وأي تحضيرات لازمة للزيارة.</p></article><article class="card"><h3>استعد للسفر الطبي</h3><p>استخدم دليل المريض الدولي ومعلومات التأشيرة الطبية الحالية لتنظيم التقارير ومراسلات المستشفى والمستندات العملية المرتبطة برحلة العلاج.</p></article></div><div class="note">يمكن لعلاج مي إنديا تنسيق هذه الخطوات، بينما تبقى التوصيات الطبية وقبول الحالة والتكلفة النهائية وقرارات التأشيرة من اختصاص الجهات الطبية والسلطات المعنية.</div></div></section><section class="sec"><div class="c"><h2>استكشف قبل إرسال الاستفسار</h2>'
          )}
          for fn,(marker,repl) in changes.items():
              p=Path(fn); s=p.read_text(); fi=s.lower().find('<footer'); assert fi>=0
              pre,foot=s[:fi],s[fi:]
              if repl in pre:
                  print('Already updated:',fn); continue
              if marker not in pre: raise SystemExit(f'Expected marker missing: {fn}')
              p.write_text(pre.replace(marker,repl,1)+foot)
              print('Updated:',fn)
          en=Path('qatar/treatment-in-india/index.html').read_text()
          ar=Path('ar/qatar/treatment-in-india/index.html').read_text()
          assert '../../#enquiry' in en and '/ar/#enquiry' in ar
          assert '../../medical-visa/' in en and '/ar/medical-visa/' in ar
          assert '../../patient-guide/' in en and '/ar/patient-guide/' in ar
          PY
          test -z "$(git status --porcelain -- assets/css/footer-approved.css FOOTER-LOCK.md)"
      - name: Commit Qatar search journey improvements
        shell: bash
        run: |
          if git diff --quiet -- qatar/treatment-in-india/index.html ar/qatar/treatment-in-india/index.html; then echo 'No content change required.'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qatar/treatment-in-india/index.html ar/qatar/treatment-in-india/index.html
          git commit -m 'Strengthen Qatar patient search journey'
          git push
