name: Optimize profile images once

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/optimize-profile-images-once.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y webp
      - name: Optimize large profile and hospital images safely
        shell: bash
        run: |
          set -euo pipefail
          BEFORE_FOOTER=$(sha256sum assets/css/footer-approved.css | cut -d' ' -f1)
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          root=Path('.')
          # Only optimize local raster assets >=350 KB that are actually referenced by HTML.
          html_files=list(root.rglob('*.html'))
          html_text='\n'.join(p.read_text(errors='ignore') for p in html_files)
          candidates=[]
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.jpg','.jpeg','.png'}: continue
              if p.name in {'Healthcare Travel Swoosh Emblem.png','Elajme India Healthcare Travel Banner.png'}: continue
              if p.stat().st_size < 350_000: continue
              rel=p.as_posix()
              # Match encoded or ordinary basename/path references.
              if rel not in html_text and p.name not in html_text and p.name.replace(' ','%20') not in html_text:
                  continue
              candidates.append(p)
          for src in candidates:
              dst=src.with_suffix('.webp')
              if src.suffix.lower()=='.png':
                  subprocess.run(['cwebp','-quiet','-q','82',str(src),'-o',str(dst)],check=True)
              else:
                  subprocess.run(['cwebp','-quiet','-q','82',str(src),'-o',str(dst)],check=True)
              # Only use WebP if materially smaller.
              if dst.stat().st_size >= src.stat().st_size*0.9:
                  dst.unlink(); continue
              old_variants={src.as_posix(),src.name,src.name.replace(' ','%20')}
              new_name=dst.name
              for hp in html_files:
                  text=hp.read_text(errors='ignore')
                  original=text
                  text=text.replace(src.as_posix(),dst.as_posix())
                  text=text.replace(src.name.replace(' ','%20'),new_name.replace(' ','%20'))
                  text=text.replace(src.name,new_name)
                  if text!=original:
                      hp.write_text(text)
              print(f'{src}: {src.stat().st_size} -> {dst.stat().st_size}')
          PY
          AFTER_FOOTER=$(sha256sum assets/css/footer-approved.css | cut -d' ' -f1)
          test "$BEFORE_FOOTER" = "$AFTER_FOOTER"
          # Hard guard: no footer stylesheet or lock file may be staged/changed.
          if git diff --name-only | grep -E '(^|/)(footer-approved\.css|FOOTER-LOCK\.md)$'; then
            echo 'Footer lock violation'; exit 1
          fi
      - name: Commit optimized assets
        run: |
          git config user.name 'Elajme India Performance'
          git config user.email 'actions@users.noreply.github.com'
          git add -- '*.html' '*.webp'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Optimize large hospital and doctor images'
          git push
