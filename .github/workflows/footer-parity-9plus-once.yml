name: Enforce locked master footer sitewide

on:
  push:
    paths:
      - ".github/workflows/footer-parity-9plus-once.yml"

permissions:
  contents: write

jobs:
  unify-footer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace every page footer with the locked homepage master
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          EN = '''<footer class="site-footer"><div class="container footer-wrap"><div class="footer-top"><div class="footer-brand"><img src="/Healthcare%20Travel%20Swoosh%20Emblem.png" alt="" class="brand-icon" loading="lazy" decoding="async"><span class="brand-text"><strong>Elajme India</strong><span lang="ar" dir="rtl">علاج مي إنديا</span></span></div><nav class="footer-links" aria-label="Footer navigation"><a href="/">Home</a><a href="/treatments/">Treatments</a><a href="/hospitals/">Hospitals</a><a href="/doctors/">Doctors</a><a href="/international-patients/mea/">International Patients</a><a href="/privacy.html">Privacy Policy</a><a href="/terms.html">Terms &amp; Medical Disclaimer</a></nav></div><div class="footer-bottom"><p>© 2026 Elajme India. International patient coordination.</p></div></div></footer>'''

          AR = '''<footer class="site-footer"><div class="container footer-wrap"><div class="footer-top"><div class="footer-brand"><img src="/Healthcare%20Travel%20Swoosh%20Emblem.png" alt="" class="brand-icon" loading="lazy" decoding="async"><span class="brand-text"><strong>Elajme India</strong><span lang="ar" dir="rtl">علاج مي إنديا</span></span></div><nav class="footer-links" aria-label="روابط التذييل"><a href="/ar/">الرئيسية</a><a href="/ar/treatments/">العلاجات</a><a href="/ar/hospitals/">المستشفيات</a><a href="/ar/doctors/">الأطباء</a><a href="/ar/international-patients/mea/">المرضى الدوليون</a><a href="/ar/privacy.html">سياسة الخصوصية</a><a href="/ar/terms.html">الشروط وإخلاء المسؤولية الطبية</a></nav></div><div class="footer-bottom"><p>© 2026 علاج مي إنديا. تنسيق المرضى الدوليين.</p></div></div></footer>'''

          footer_re = re.compile(r'<footer\b[^>]*>.*?</footer>', re.I | re.S)
          css_tag = '<link rel="stylesheet" href="/assets/css/home-footer-parity.css?v=2">'
          changed = 0
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts:
                  continue
              text = p.read_text(encoding='utf-8')
              is_ar = p.parts and p.parts[0] == 'ar'
              master = AR if is_ar else EN
              if footer_re.search(text):
                  new = footer_re.sub(master, text, count=1)
              else:
                  new = text.replace('</body>', master + '</body>', 1)
              if '/assets/css/home-footer-parity.css' not in new and 'assets/css/home-footer-parity.css' not in new:
                  new = new.replace('</head>', css_tag + '</head>', 1)
              if new != text:
                  p.write_text(new, encoding='utf-8')
                  changed += 1
          print(f'Unified footer on {changed} HTML files')
          PY

      - name: Commit sitewide footer parity
        shell: bash
        run: |
          git config user.name "Elajme India QA"
          git config user.email "actions@users.noreply.github.com"
          git add -- '*.html' ':!node_modules'
          if git diff --cached --quiet; then
            echo "No footer changes needed"
            exit 0
          fi
          git commit -m "Unify locked homepage footer across EN and AR pages"
          git push
