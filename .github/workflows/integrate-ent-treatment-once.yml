name: Integrate ENT treatment coverage once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/integrate-ent-treatment-once.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Integrate bilingual ENT coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re,hashlib
          locked_paths=[Path('assets/css/footer-approved.css'),Path('FOOTER-LOCK.md')]
          locked={p:hashlib.sha256(p.read_bytes()).hexdigest() for p in locked_paths}
          en=Path('treatments/index.html'); s=en.read_text(); assert 'ent-treatment-india/' not in s
          pre,sep,foot=s.partition('<footer')
          pre=pre.replace('Medical Treatment in India: 14 Specialties | Elajme India','Medical Treatment in India: 15 Specialties | Elajme India').replace('Explore 14 medical treatment areas in India','Explore 15 medical treatment areas in India')
          marker='</article></div></div></section><section class="sec alt">'
          card='<article class="card"><h3><a href="ent-treatment-india/">ENT &amp; Ear, Nose and Throat Care</a></h3><p>ENT specialist review and ear, nose, sinus, throat and voice-care enquiry coordination.</p></article>'
          assert marker in pre; pre=pre.replace(marker,'</article>'+card+'</div></div></section><section class="sec alt">',1)
          m=re.search(r'<script type="application/ld\+json">(.*?)</script>',pre); data=json.loads(m.group(1)); items=data['mainEntity']['itemListElement']; assert len(items)==14
          items.append({'@type':'ListItem','position':15,'name':'ENT & Ear, Nose and Throat Care','url':'https://elajmeindia.com/treatments/ent-treatment-india/'})
          pre=pre[:m.start(1)]+json.dumps(data,separators=(',',':'),ensure_ascii=False)+pre[m.end(1):]; en.write_text(pre+sep+foot)
          ar=Path('ar/treatments/index.html'); s=ar.read_text(); assert 'ent-treatment-india/' not in s
          pre,sep,foot=s.partition('<footer'); marker='</article></div><div class="note">'
          card='<article class="card"><h3>الأنف والأذن والحنجرة</h3><p>تنسيق مراجعة واستفسارات حالات الأذن والأنف والجيوب الأنفية والحنجرة والصوت.</p><a href="ent-treatment-india/">عرض التفاصيل</a></article>'
          assert marker in pre; pre=pre.replace(marker,'</article>'+card+'</div><div class="note">',1); ar.write_text(pre+sep+foot)
          sm=Path('sitemap.xml'); x=sm.read_text()
          for u in ['https://elajmeindia.com/treatments/ent-treatment-india/','https://elajmeindia.com/ar/treatments/ent-treatment-india/']:
              if u not in x: x=x.replace('</urlset>',f'  <url><loc>{u}</loc></url>\n</urlset>')
          sm.write_text(x)
          for p,h in locked.items(): assert hashlib.sha256(p.read_bytes()).hexdigest()==h
          assert 'ent-treatment-india/' in en.read_text() and 'ent-treatment-india/' in ar.read_text()
          print('ENT DIRECTORY + SCHEMA + SITEMAP INTEGRATION CLEAN')
          PY
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add treatments/index.html ar/treatments/index.html sitemap.xml
          git diff --cached --quiet && exit 0
          git commit -m 'Integrate bilingual ENT treatment coverage'
          git push
