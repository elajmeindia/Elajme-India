name: Keep only approved EN and AR homepage footers sitewide

on:
  push:
    paths:
      - ".github/workflows/footer-parity-9plus-once.yml"

permissions:
  contents: write

jobs:
  unify-footer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove footer overrides and clone approved homepage footers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          footer_re=re.compile(r'<footer\b[^>]*>.*?</footer>',re.I|re.S)
          lock_re=re.compile(r'<style id="approved-footer-lock">.*?</style>',re.I|re.S)
          parity_re=re.compile(r'<link[^>]+home-footer-parity\.css[^>]*>',re.I)
          def clean(s): return parity_re.sub('',lock_re.sub('',s))
          en=clean(Path('index.html').read_text(encoding='utf-8'))
          ar=clean(Path('ar/index.html').read_text(encoding='utf-8'))
          EN=footer_re.search(en).group(0)
          AR=footer_re.search(ar).group(0)
          changed=0
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts: continue
              old=p.read_text(encoding='utf-8')
              new=clean(old)
              master=AR if (p.parts and p.parts[0]=='ar') else EN
              if footer_re.search(new): new=footer_re.sub(lambda _:master,new,count=1)
              elif '</body>' in new: new=new.replace('</body>',master+'</body>',1)
              if new!=old:
                  p.write_text(new,encoding='utf-8'); changed+=1
          print('Cleaned',changed,'HTML files')
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "Elajme India QA"
          git config user.email "actions@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove conflicting footer overrides sitewide"
          git push
