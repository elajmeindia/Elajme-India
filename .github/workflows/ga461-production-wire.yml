name: Verify deployed GA4 wire privacy
on:
  pull_request:
    paths: ['.github/workflows/ga461-production-wire.yml', 'scripts/ga461-production-final.cjs']
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit playwright@1.56.1 && npx playwright install chromium
      - shell: bash
        run: |
          mkdir -p evidence
          node scripts/ga461-production-final.cjs | tee evidence/production-wire.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ga461-production-wire
          path: evidence/
          retention-days: 7
