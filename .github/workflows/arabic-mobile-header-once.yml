name: Arabic mobile header install once
on:
  push:
    paths:
      - '.github/workflows/arabic-mobile-header-once.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache-bust Arabic mobile header without touching footer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ar/index.html')
          s=p.read_text()
          footer_start=s.find('<footer')
          footer_end=s.find('</footer>',footer_start)
          if footer_start < 0 or footer_end < 0:
              raise SystemExit('Footer not found; refusing edit')
          footer_end += len('</footer>')
          footer_before=s[footer_start:footer_end]
          old_css='/assets/css/arabic-mobile-header.css?v=2'
          new_css='/assets/css/arabic-mobile-header.css?v=3'
          if old_css not in s:
              raise SystemExit('Expected Arabic mobile CSS v2 reference not found; refusing broad edit')
          s=s.replace(old_css,new_css,1)
          new_footer_start=s.find('<footer')
          new_footer_end=s.find('</footer>',new_footer_start)+len('</footer>')
          footer_after=s[new_footer_start:new_footer_end]
          if footer_before != footer_after:
              raise SystemExit('LOCK VIOLATION: footer markup changed')
          p.write_text(s)
          print('Arabic mobile CSS cache-busted; footer markup verified byte-identical.')
          PY
      - name: Verify scoped Arabic homepage change
        run: |
          git diff --check
          git diff -- ar/index.html
          python3 - <<'PY'
          from pathlib import Path
          d=Path('ar/index.html').read_text()
          if '/assets/css/arabic-mobile-header.css?v=3' not in d:
              raise SystemExit('Cache-bust verification failed')
          PY
      - name: Commit
        run: |
          if git diff --quiet -- ar/index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ar/index.html
          git commit -m 'Load fixed Arabic mobile navigation CSS'
          git push
