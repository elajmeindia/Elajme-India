name: Audit international positioning phase 4
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-country-positioning-phase4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Audit country positioning and Nigeria parity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          en=Path('index.html').read_text()
          ar=Path('ar/index.html').read_text()
          nigeria=Path('nigeria/treatment-in-india/index.html').read_text()
          ar_nigeria=Path('ar/nigeria/treatment-in-india/index.html').read_text()
          mea=Path('international-patients/mea/index.html').read_text()
          assert '/nigeria/treatment-in-india/' in en, 'English homepage Nigeria link missing'
          assert 'Dedicated patient pages' in en, 'English country strip label missing'
          assert 'International patient coordination in India' in en, 'English international positioning missing'
          assert 'Nigeria' in en and 'Africa' in en, 'English Nigeria/Africa positioning missing'
          assert 'rel="canonical"' in nigeria and 'hreflang="en"' in nigeria and 'hreflang="ar"' in nigeria, 'Nigeria hreflang/canonical incomplete'
          assert '/#enquiry' in nigeria and '/assets/css/footer-approved.css' in nigeria, 'Nigeria routing/footer incomplete'
          assert 'lang="ar"' in ar and 'dir="rtl"' in ar, 'Arabic homepage language architecture missing'
          assert '/ar/nigeria/treatment-in-india/' in ar and 'نيجيريا' in ar, 'Arabic homepage Nigeria link missing'
          assert '/assets/css/footer-approved.css' in ar, 'Arabic homepage approved footer missing'
          assert 'lang="ar"' in ar_nigeria and 'dir="rtl"' in ar_nigeria and '/ar/#enquiry' in ar_nigeria, 'Arabic Nigeria page routing/RTL incomplete'
          assert 'Nigeria' in mea and 'Africa' in mea and 'International' in mea, 'International patient hub not inclusive'
          assert '/nigeria/treatment-in-india/' in mea and '/#enquiry' in mea, 'International patient hub Nigeria/enquiry route missing'
          print('PHASE 4 INTERNATIONAL POSITIONING AUDIT CLEAN')
          PY
