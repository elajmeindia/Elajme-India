name: Align remaining GCC Arabic treatment discovery once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/batch-treatment-trust-parity-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align Qatar Kuwait Bahrain Arabic treatment links
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib

          files = [
            Path('ar/qatar/treatment-in-india/index.html'),
            Path('ar/kuwait/treatment-in-india/index.html'),
            Path('ar/bahrain/treatment-in-india/index.html'),
          ]
          links = '''<div class="related"><a href="/ar/treatments/cancer-treatment-india/">علاج السرطان</a><a href="/ar/treatments/heart-treatment-india/">علاج القلب</a><a href="/ar/treatments/liver-transplant-india/">زراعة الكبد</a><a href="/ar/treatments/kidney-transplant-india/">زراعة الكلى</a><a href="/ar/treatments/knee-replacement-india/">استبدال مفصل الركبة</a><a href="/ar/treatments/neurosurgery-india/">جراحة الأعصاب</a><a href="/ar/treatments/spine-surgery-india/">جراحة العمود الفقري</a><a href="/ar/treatments/urology-treatment-india/">المسالك البولية</a><a href="/ar/treatments/gastroenterology-treatment-india/">أمراض الجهاز الهضمي</a><a href="/ar/treatments/">جميع مجالات العلاج</a><a href="/ar/hospitals/">دليل المستشفيات</a><a href="/ar/doctors/">دليل الأطباء</a><a href="/ar/medical-visa/">معلومات التأشيرة الطبية</a><a href="/ar/patient-guide/">دليل المريض الدولي</a><a href="/ar/international-patients/mea/">دعم مرضى الخليج والمرضى الدوليين</a></div>'''
          changed=[]
          for p in files:
              text=p.read_text()
              fi=text.lower().find('<footer')
              assert fi>=0, p
              pre, foot=text[:fi], text[fi:]
              # Replace the final related-links block before the footer. Country pages use this as their discovery section.
              matches=list(re.finditer(r'<div class="related">.*?</div>', pre, flags=re.S))
              assert matches, p
              m=matches[-1]
              newpre=pre[:m.start()]+links+pre[m.end():]
              new=newpre+foot
              assert foot==text[fi:], 'footer changed'
              assert new.count('/ar/treatments/cancer-treatment-india/')>=1
              assert new.count('/ar/treatments/gastroenterology-treatment-india/')>=1
              assert 'href="/ar/#enquiry"' in new
              assert 'hreflang="en"' in new and 'hreflang="ar"' in new
              if new!=text:
                  p.write_text(new)
                  changed.append(str(p))
          print('Changed:', changed)
          for p in [Path('FOOTER-LOCK.md'), Path('assets/css/footer-approved.css')]:
              print('LOCK', p, hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Commit GCC parity improvements
        run: |
          if git diff --quiet -- ar/qatar/treatment-in-india/index.html ar/kuwait/treatment-in-india/index.html ar/bahrain/treatment-in-india/index.html; then echo 'No changes required'; exit 0; fi
          git config user.name 'elajmeindia'
          git config user.email 'shahzadalamnadwi@gmail.com'
          git add ar/qatar/treatment-in-india/index.html ar/kuwait/treatment-in-india/index.html ar/bahrain/treatment-in-india/index.html
          git commit -m 'Align remaining GCC Arabic treatment discovery'
          git push
