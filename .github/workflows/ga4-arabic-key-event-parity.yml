name: GA4 enquiry event parity
on:
  pull_request:
    paths: ['.github/workflows/ga4-arabic-key-event-parity.yml', 'index.html', 'ar/index.html', 'script.js', 'assets/js/arabic-enquiry-analytics.js']
  push:
    branches: [main]
    paths: ['.github/workflows/ga4-arabic-key-event-parity.yml', 'index.html', 'ar/index.html', 'script.js', 'assets/js/arabic-enquiry-analytics.js']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify strict homepage revision comparison
        run: |
          cat > /tmp/elajme-homepage-compare.py <<'PY'
          import re
          import sys
          from pathlib import Path
          
          EMAIL = "care@elajmeindia.com"
          HREF = re.compile(r'href="/cdn-cgi/l/email-protection#([0-9a-fA-F]+)"')
          DECODER = re.compile(r'<script(?: defer(?:="")?)? data-cfasync="false"(?: defer(?:="")?)? src="/cdn-cgi/scripts/[0-9a-fA-F]+/cloudflare-static/email-decode\.min\.js"(?: defer(?:="")?)?></script>')
          
          def normalized_delivery(html):
              def restore(match):
                  data = bytes.fromhex(match.group(1))
                  if len(data) < 2:
                      raise ValueError("Invalid Cloudflare email payload")
                  address = bytes(value ^ data[0] for value in data[1:]).decode("utf-8")
                  if address != EMAIL:
                      raise ValueError("Unexpected protected email destination")
                  return 'href="mailto:' + address + '"'
              html, addresses = HREF.subn(restore, html)
              html, scripts = DECODER.subn("", html)
              if addresses > 1 or scripts > 1 or (scripts and not addresses):
                  raise ValueError("Unexpected email-protection transformation")
              return html
          
          def self_test():
              source = '<a href="https://wa.me/917488955154">WhatsApp</a><a href="mailto:' + EMAIL + '">mail</a>'
              assert normalized_delivery(source) == source
              for key in [7, 189]:
                  payload = bytes([key]) + bytes(value ^ key for value in EMAIL.encode())
                  live = source.replace('href="mailto:' + EMAIL + '"', 'href="/cdn-cgi/l/email-protection#' + payload.hex() + '"')
                  live += '<script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script>'
                  assert normalized_delivery(live) == source
                  assert normalized_delivery(live.replace('data-cfasync="false" src=', 'data-cfasync="false" defer src=')) == source
                  assert normalized_delivery(live.replace("917488955154", "111111111111")) != source
                  assert normalized_delivery(live + '<script src="/unapproved.js"></script>') != source
                  assert normalized_delivery(live + '<meta name="robots" content="noindex">') != source
              bad = "wrong@example.com"
              payload = bytes([7]) + bytes(value ^ 7 for value in bad.encode())
              try:
                  normalized_delivery('href="/cdn-cgi/l/email-protection#' + payload.hex() + '"')
              except ValueError:
                  pass
              else:
                  raise AssertionError("Unexpected email destination was accepted")
              print("Revision comparator passed: plain/obfuscated HTML accepted; changed routes, metadata, scripts and email rejected")
          
          if __name__ == "__main__":
              if sys.argv[1:] == ["--self-test"]:
                  self_test()
              else:
                  expected = Path(sys.argv[1]).read_bytes().decode("utf-8")
                  try:
                      actual = normalized_delivery(Path(sys.argv[2]).read_bytes().decode("utf-8"))
                  except (ValueError, UnicodeError):
                      sys.exit(1)
                  if actual != expected:
                      print("Homepage differs beyond the known Cloudflare email transformation")
                      sys.exit(1)
          PY
          python3 /tmp/elajme-homepage-compare.py --self-test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check anonymous event emission without sending enquiries
        run: |
          python3 -m http.server 8765 --directory . >/tmp/elajme-test.log 2>&1 &
          sleep 2
          cat > ga4-check.cjs <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const origin=process.env.SITE_ORIGIN || 'http://127.0.0.1:8765';
            const browser=await chromium.launch();
            let failed=false;
            const cases = [
              ['/', true, 'en'],
              ['/', false, 'en'],
              ['/ar/', true, 'ar'],
              ['/ar/', false, 'ar'],
              ['/ar/oman/treatment-in-india/', false, 'ar']
            ];
            for(const [path, form, language] of cases){
              const page=await browser.newPage({viewport:{width:390,height:844}});
              const recorded=[];
              page.on('console',msg=>{if(msg.text().startsWith('GA4_CAPTURE:')){try{recorded.push(JSON.parse(msg.text().slice(12)));}catch(e){}}});
              await page.addInitScript(()=>{
                window.__testEvents=[];
                const arr=[];
                arr.push=function(...args){
                  for(const a of args){if(a&&a[0]==='event')window.__testEvents.push({name:a[1],params:a[2]||{}}),console.log('GA4_CAPTURE:'+JSON.stringify({name:a[1],params:a[2]||{}}));}
                  return Array.prototype.push.apply(this,args);
                };
                window.dataLayer=arr;
              });
              await page.context().route('**/*', route => {
                const request=route.request();
                return request.method()==='GET' && new URL(request.url()).origin===origin ? route.continue() : route.abort();
              });
              page.setDefaultTimeout(7000); 
              await page.goto(origin+path,{waitUntil:'domcontentloaded',timeout:15000});
              await page.waitForTimeout(900);
              if(!form){
                const link=page.locator('a[href^="https://wa.me/917488955154"]').first();
                await link.evaluate(el=>el.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true})));
              }else{
                await page.locator('#patientName').fill('Test Person');
                await page.locator('#patientCountry').fill('Oman');
                await page.locator('#patientMobile').fill('+968 9000 0000');
                if(path==='/') await page.locator('#preferredLanguage').selectOption('Arabic');
                await page.locator('#patientEnquiryForm').evaluate(el=>el.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true})));
              }
              await page.waitForTimeout(300);
              const names=recorded.map(x=>x.name);
              const allowed=new Set(['contact_method','page_path','language','lead_source','traffic_source']);
              const canonical=recorded.filter(x=>x.name==='whatsapp_enquiry_click');
              const intents=recorded.filter(x=>x.name==='whatsapp_handoff_intent');
              const ok=canonical.length===1 && intents.length===(form?1:0)
                && [...canonical,...intents].every(({params})=>params.page_path===path && params.language===language
                  && Object.keys(params).every(key=>allowed.has(key)))
                && !names.includes('generate_lead')
                && !/Test Person|9000 0000/.test(JSON.stringify(recorded));
              console.log(JSON.stringify({path,form,names,ok}));
              if(!ok)failed=true;
              await page.close();
            }
            await browser.close();
            if(failed)process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
          node ga4-check.cjs
      - name: Verify the deployed analytics without sending enquiries
        if: github.event_name == 'push'
        env:
          SITE_ORIGIN: https://elajmeindia.com
        run: |
          ready=false
          for attempt in {1..12}; do
            if curl -fsS --max-time 10 "$SITE_ORIGIN/" -o /tmp/elajme-en.html &&
               curl -fsS --max-time 10 "$SITE_ORIGIN/ar/" -o /tmp/elajme-ar.html &&
               python3 /tmp/elajme-homepage-compare.py index.html /tmp/elajme-en.html &&
               python3 /tmp/elajme-homepage-compare.py ar/index.html /tmp/elajme-ar.html; then
              ready=true
              break
            fi
            sleep 10
          done
          if [ "$ready" != true ]; then
            echo 'Production homepages do not match this revision'
            exit 1
          fi
          node ga4-check.cjs
