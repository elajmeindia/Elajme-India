name: Normalize English site headers once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-english-site-headers-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Make homepage the master English header
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/css/site-shell.css')
          text=p.read_text(encoding='utf-8')
          marker='/* homepage-master-header-v4 */'
          block=r'''
          /* homepage-master-header-v4 */
          @media(min-width:1041px){
            .shell-header{height:82px!important;background:rgba(255,255,255,.97)!important;border-bottom:1px solid #e4e8e9!important;box-shadow:0 5px 24px rgba(18,59,80,.055)!important;backdrop-filter:blur(16px)!important}
            .shell-header .shell-container{width:min(1160px,calc(100% - 40px))!important;margin-inline:auto!important}
            .shell-nav{height:100%!important;display:flex!important;align-items:center!important;justify-content:space-between!important;gap:22px!important;flex-wrap:nowrap!important}
            .shell-brand{display:flex!important;align-items:center!important;gap:10px!important;min-width:max-content!important;flex:0 0 auto!important}
            .shell-brand img{display:block!important;width:60px!important;height:60px!important;object-fit:contain!important;flex:0 0 60px!important}
            .shell-wordmark{display:flex!important;flex-direction:column!important;align-items:flex-start!important;justify-content:center!important;line-height:1.05!important;text-align:left!important;min-width:max-content!important}
            .shell-name{font-size:18px!important;font-weight:800!important;letter-spacing:-.025em!important;line-height:1.05!important;white-space:nowrap!important}
            .shell-ar{font-size:12px!important;margin-top:5px!important;font-weight:650!important;line-height:1.05!important;text-align:left!important}
            .shell-links{display:flex!important;align-items:center!important;justify-content:center!important;gap:18px!important;min-width:0!important;flex:1 1 auto!important}
            .shell-header .shell-links a{font-size:12px!important;font-weight:700!important;padding:8px 6px!important;border-radius:8px!important;line-height:1.25!important;white-space:nowrap!important}
            .shell-header .shell-links a[href*="about"]{font-size:12px!important}
            .shell-header .shell-links a[href*="about"]:after{content:none!important;display:none!important}
            .shell-actions{display:flex!important;align-items:center!important;gap:10px!important;flex:0 0 auto!important}
            .shell-phone{font-size:12px!important;font-weight:750!important;padding:8px 10px!important;white-space:nowrap!important}
            .shell-whatsapp{font-size:12px!important;font-weight:800!important;min-height:40px!important;padding:9px 12px!important;min-width:max-content!important;overflow:visible!important;filter:none!important;opacity:1!important;text-shadow:none!important}
            .shell-whatsapp span{display:inline-block!important;margin-right:5px!important;filter:none!important;opacity:1!important}
            .shell-lang{font-size:13px!important;padding:9px 12px!important;white-space:nowrap!important}
            .shell-cta{min-height:42px!important;padding:11px 15px!important;white-space:nowrap!important}
            .shell-cta:after{font-size:12px!important;font-weight:800!important}
          }
          @media(min-width:1041px) and (max-width:1320px){
            .shell-header .shell-container{width:calc(100% - 24px)!important}
            .shell-nav{gap:10px!important}
            .shell-links{gap:7px!important}
            .shell-header .shell-links a{font-size:11px!important;padding-inline:4px!important}
            .shell-actions{gap:6px!important}
            .shell-phone{font-size:10px!important;padding-inline:4px!important}
            .shell-whatsapp{font-size:10.5px!important;padding-inline:8px!important}
            .shell-lang{font-size:11px!important;padding-inline:9px!important}
            .shell-cta{padding-inline:10px!important}.shell-cta:after{font-size:10px!important}
          }
          '''
          if marker not in text:
              p.write_text(text+'\n'+block+'\n',encoding='utf-8')
          PY
      - name: Verify homepage master header rules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          css=Path('assets/css/site-shell.css').read_text(encoding='utf-8')
          for needle in ['homepage-master-header-v4','width:min(1160px,calc(100% - 40px))!important','gap:22px!important','gap:18px!important','width:60px!important','font-size:18px!important']:
              assert needle in css, needle
          bad=[]; checked=0
          for p in Path('.').rglob('*.html'):
              s=p.as_posix()
              if s.startswith(('.git/','.github/','ar/')): continue
              t=p.read_text(encoding='utf-8')
              if '<header class="shell-header">' not in t: continue
              checked+=1
              h=t.split('<header class="shell-header">',1)[1].split('</header>',1)[0]
              for needle in ['Home','Treatments','Hospitals','Doctors','International Patients','About Us','Contact','WhatsApp Us','العربية','Start Your Enquiry','+91 74889 55154']:
                  if needle not in h: bad.append((s,needle))
          print('English shared headers checked:',checked)
          if bad: raise SystemExit(str(bad))
          print('HOMEPAGE MASTER HEADER APPLIED CLEANLY')
          PY
          git diff --exit-code -- assets/css/footer-approved.css FOOTER-LOCK.md
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/site-shell.css
          git commit -m 'Use homepage as master English header'
          git push