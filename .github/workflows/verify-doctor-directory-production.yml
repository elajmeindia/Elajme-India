name: Verify doctor directory production parity
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compare approved doctor directory notices with production
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from html.parser import HTMLParser

          class VisibleText(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.excluded = 0
                  self.parts = []
              def handle_starttag(self, tag, attrs):
                  if tag in ('script', 'style', 'template'):
                      self.excluded += 1
              def handle_endtag(self, tag):
                  if tag in ('script', 'style', 'template') and self.excluded:
                      self.excluded -= 1
              def handle_data(self, data):
                  if not self.excluded:
                      self.parts.append(data)
              def text(self):
                  return ' '.join(' '.join(self.parts).split())

          checks = [
              ('doctors/index.html', 'https://elajmeindia.com/doctors/',
               'Photo note: Placeholder images do not depict the actual doctor.'),
              ('ar/doctors/index.html', 'https://elajmeindia.com/ar/doctors/',
               'ملاحظة الصور: الصور البديلة لا تمثل الطبيب الفعلي'),
          ]
          failed = []
          for path, url, marker in checks:
              local = Path(path).read_text(encoding='utf-8')
              local_parser = VisibleText()
              local_parser.feed(local)
              assert marker in local_parser.text(), f'Source marker missing: {path}'
              request = Request(url, headers={'User-Agent': 'ElajmeProductionParityAudit/1.0',
                                              'Cache-Control': 'no-cache'})
              try:
                  with urlopen(request, timeout=25) as response:
                      status = response.status
                      html = response.read().decode('utf-8', errors='replace')
                  live_parser = VisibleText()
                  live_parser.feed(html)
                  if status != 200 or marker not in live_parser.text():
                      failed.append(f'{url}: expected current visible notice missing (HTTP {status})')
                  else:
                      print(f'PASS {url}: current notice visible')
              except Exception as exc:
                  failed.append(f'{url}: request failed: {exc}')
          # Confirm the latest Arabic placeholder accessibility correction is live.
          try:
              request = Request('https://elajmeindia.com/ar/doctors/',
                                headers={'User-Agent': 'ElajmeProductionParityAudit/1.0',
                                         'Cache-Control': 'no-cache'})
              with urlopen(request, timeout=25) as response:
                  arabic_html = response.read().decode('utf-8', errors='replace')
              expected_alt = 'صورة بديلة؛ الصورة الفعلية للدكتور أنوب دير غير متاحة'
              if expected_alt not in arabic_html:
                  failed.append('Arabic Dr Anup Dhir placeholder alt text not yet deployed')
              else:
                  print('PASS Arabic Dr Anup Dhir placeholder description')
          except Exception as exc:
              failed.append(f'Arabic placeholder verification failed: {exc}')
          if failed:
              raise SystemExit('Production directory parity not confirmed:\\n' + '\\n'.join(failed))
          print('Doctor directory production parity confirmed for both languages.')
          PY
