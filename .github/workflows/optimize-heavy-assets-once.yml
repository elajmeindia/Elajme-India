name: Optimize heavy assets once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-heavy-assets-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y webp
      - name: Optimize remaining heavy assets and update safe references
        shell: bash
        run: |
          set -euo pipefail
          BEFORE_FOOTER=$(sha256sum assets/css/footer-approved.css | cut -d' ' -f1)
          BEFORE_LOCK=$(sha256sum FOOTER-LOCK.md | cut -d' ' -f1)
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          root=Path('.')
          html=list(root.rglob('*.html'))

          # Convert any raster asset over 800 KB to WebP, including currently
          # unreferenced legacy originals, so the repository itself passes the
          # performance weight gate. Existing WebP >800 KB is recompressed.
          for src in list(root.rglob('*')):
              if not src.is_file() or src.stat().st_size <= 800_000:
                  continue
              ext=src.suffix.lower()
              if ext not in {'.png','.jpg','.jpeg','.webp'}:
                  continue
              if src.as_posix() == 'assets/css/footer-approved.css':
                  continue
              if ext == '.webp':
                  tmp=src.with_name(src.stem + '.optimized.webp')
                  subprocess.run(['cwebp','-quiet','-q','76',str(src),'-o',str(tmp)],check=True)
                  if tmp.stat().st_size < src.stat().st_size:
                      tmp.replace(src)
                  else:
                      tmp.unlink()
                  continue
              dst=src.with_suffix('.webp')
              tmp=src.with_name(src.stem + '.optimized.webp') if dst.exists() else dst
              subprocess.run(['cwebp','-quiet','-q','76',str(src),'-o',str(tmp)],check=True)
              if dst.exists() and tmp != dst:
                  if tmp.stat().st_size < dst.stat().st_size:
                      tmp.replace(dst)
                  else:
                      tmp.unlink()
              # Replace HTML references only when a WebP exists.
              if dst.exists():
                  variants=[
                      (src.as_posix(),dst.as_posix()),
                      (src.name.replace(' ','%20'),dst.name.replace(' ','%20')),
                      (src.name,dst.name),
                  ]
                  for page in html:
                      text=page.read_text(errors='ignore')
                      original=text
                      for old,new in variants:
                          text=text.replace(old,new)
                      if text != original:
                          page.write_text(text)

          # Existing optimized branding WebP files are already present. Switch
          # HTML image references from the heavyweight emblem PNG to WebP.
          for page in html:
              text=page.read_text(errors='ignore')
              original=text
              text=text.replace('Healthcare%20Travel%20Swoosh%20Emblem.png','Healthcare%20Travel%20Swoosh%20Emblem.webp')
              text=text.replace('Healthcare Travel Swoosh Emblem.png','Healthcare Travel Swoosh Emblem.webp')
              if text != original:
                  page.write_text(text)
          PY
          AFTER_FOOTER=$(sha256sum assets/css/footer-approved.css | cut -d' ' -f1)
          AFTER_LOCK=$(sha256sum FOOTER-LOCK.md | cut -d' ' -f1)
          test "$BEFORE_FOOTER" = "$AFTER_FOOTER"
          test "$BEFORE_LOCK" = "$AFTER_LOCK"
          if git diff --name-only | grep -E '(^|/)(footer-approved\.css|FOOTER-LOCK\.md)$'; then
            echo 'Footer lock violation'; exit 1
          fi
      - name: Verify no raster asset remains over 800 KB
        run: |
          python3 - <<'PY'
          from pathlib import Path
          bad=[]
          for p in Path('.').rglob('*'):
              if p.is_file() and p.suffix.lower() in {'.png','.jpg','.jpeg','.webp','.gif','.avif'} and p.stat().st_size>800_000:
                  bad.append((p.stat().st_size,p.as_posix()))
          for size,path in sorted(bad,reverse=True): print(f'{size/1024:.0f}KB {path}')
          if bad: raise SystemExit(f'{len(bad)} image(s) still over 800KB')
          PY
      - name: Commit targeted performance improvements
        run: |
          git config user.name 'Elajme India Performance'
          git config user.email 'actions@users.noreply.github.com'
          git add -- '*.html' '*.webp'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Optimize remaining heavy site assets'
          git push
