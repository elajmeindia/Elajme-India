name: Unify inner footers and Arabic CTA contrast
on:
  push:
    paths:
      - '.github/workflows/unify-inner-footer-and-dark-cta-once.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add shared inner-page footer parity and dark CTA contrast
        shell: bash
        run: |
          cat >> assets/css/site-shell.css <<'CSS'

/* 9+ inner-page footer parity: same visual system as the homepage in EN and AR. */
.shell-footer{background:#092f3b!important;color:#dce9ec!important;padding:46px 0 24px!important;border-top:4px solid #1c827e!important}
.shell-footer .shell-container{width:min(1160px,calc(100% - 40px))!important}
.shell-footer-grid{display:grid!important;grid-template-columns:minmax(210px,.8fr) minmax(0,1.55fr) minmax(240px,.85fr)!important;gap:48px!important;align-items:start!important;direction:ltr!important}
.shell-footer-grid>div{min-width:0!important}
.shell-footer .shell-brand{margin:0 0 14px!important;gap:11px!important}
.shell-footer .shell-brand img{width:60px!important;height:60px!important;flex:0 0 60px!important}
.shell-footer .shell-name{font-size:16px!important;color:#fff!important}.shell-footer .shell-ar{font-size:12px!important;color:#fff!important;margin-top:4px!important}
.shell-footer p{color:#d6e5e8!important;font-size:12.5px!important;line-height:1.7!important}
.shell-footer h3{color:#fff!important;font-size:13px!important;margin:0 0 12px!important;font-weight:800!important}
.shell-footer-links{display:grid!important;grid-template-columns:repeat(3,minmax(110px,1fr))!important;gap:12px 22px!important;align-content:start!important}
.shell-footer .shell-footer-links a{color:#d6e5e8!important;font-size:13px!important;font-weight:600!important;line-height:1.55!important;opacity:1!important;white-space:normal!important}
.shell-footer .shell-footer-links a:hover{color:#8fd8cf!important}
.shell-footer-bottom{border-top:1px solid rgba(255,255,255,.16)!important;margin-top:28px!important;padding-top:18px!important;display:grid!important;grid-template-columns:minmax(180px,.7fr) minmax(0,2.3fr)!important;gap:36px!important;color:#d6e5e8!important;font-size:12.5px!important;line-height:1.7!important;align-items:start!important}
.shell-footer-bottom>*{margin:0!important;color:#d6e5e8!important}.shell-disclaimer{max-width:none!important;text-align:right!important}
[dir="rtl"] .shell-footer-grid{direction:rtl!important;grid-template-columns:minmax(210px,.8fr) minmax(0,1.55fr) minmax(240px,.85fr)!important;text-align:right!important}
[dir="rtl"] .shell-footer .shell-brand{direction:ltr!important;justify-content:flex-start!important}
[dir="rtl"] .shell-footer-links{direction:rtl!important;text-align:right!important}
[dir="rtl"] .shell-footer-bottom{direction:rtl!important;grid-template-columns:minmax(180px,.7fr) minmax(0,2.3fr)!important;text-align:right!important}
[dir="rtl"] .shell-disclaimer{text-align:left!important}
@media(max-width:900px){.shell-footer-grid{grid-template-columns:1fr 1fr!important}.shell-footer-grid>div:first-child{grid-column:1/-1!important}.shell-footer-links{grid-template-columns:repeat(2,minmax(0,1fr))!important}.shell-footer-bottom{grid-template-columns:1fr!important;gap:10px!important}.shell-disclaimer,[dir="rtl"] .shell-disclaimer{text-align:start!important}}
@media(max-width:560px){.shell-footer{padding:34px 0 20px!important}.shell-footer-grid{grid-template-columns:1fr!important;gap:26px!important}.shell-footer-grid>div:first-child{grid-column:auto!important}.shell-footer-links{grid-template-columns:1fr!important}}

/* Guarantee readable text/headings in every dark CTA/banner on shared-shell pages. */
.site-shell :is(.final-cta,.cta,.dark-cta,.cta-section,.contact-cta,.enquiry-cta){color:#fff!important}
.site-shell :is(.final-cta,.cta,.dark-cta,.cta-section,.contact-cta,.enquiry-cta) :is(h1,h2,h3,strong){color:#fff!important;text-shadow:none!important}
.site-shell :is(.final-cta,.cta,.dark-cta,.cta-section,.contact-cta,.enquiry-cta) p{color:#e5f4f3!important}
.site-shell :is(.final-cta,.cta,.dark-cta,.cta-section,.contact-cta,.enquiry-cta) a:not(.button-light):not(.btn-light){color:#fff!important}
CSS
          git config user.name 'Elajme India QA'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/css/site-shell.css
          git commit -m 'Unify inner-page footers and fix dark CTA contrast'
          git push
