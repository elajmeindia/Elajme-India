name: Localize doctor images
on:
  push:
    paths:
      - '.github/workflows/localize-doctor-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Localize every downloadable external doctor portrait
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images/doctors
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import quote
          import re, subprocess, unicodedata
          p=Path('doctors/index.html'); s=p.read_text()
          class Parser(HTMLParser):
              def __init__(self): super().__init__(); self.items=[]
              def handle_starttag(self,tag,attrs):
                  if tag!='img': return
                  d=dict(attrs)
                  if 'photo' in d.get('class','').split() and d.get('src','').startswith(('http://','https://')):
                      self.items.append((d.get('alt','Doctor'),d['src']))
          parser=Parser(); parser.feed(s)
          failures=[]; changed=0
          for name,url in parser.items:
              slug=unicodedata.normalize('NFKD',name).encode('ascii','ignore').decode().lower()
              slug=re.sub(r'[^a-z0-9]+','-',slug).strip('-')
              dest=Path('assets/images/doctors')/(slug+'.jpg')
              source=url.split('://',1)[-1]
              proxy='https://images.weserv.nl/?url='+quote(source,safe='/:?=&%')+'&output=jpg&q=88&w=900&h=1100&fit=cover'
              ok=False
              for candidate in (proxy,url):
                  cmd=['curl','-L','--fail','--retry','2','--connect-timeout','20','--max-time','90','-A','Mozilla/5.0',candidate,'-o',str(dest)]
                  if subprocess.run(cmd).returncode==0 and dest.exists() and dest.stat().st_size>3000:
                      probe=subprocess.run(['file',str(dest)],capture_output=True,text=True).stdout.lower()
                      if any(x in probe for x in ('jpeg','png','webp','image')): ok=True; break
              if not ok:
                  dest.unlink(missing_ok=True); failures.append(name); print('STILL BLOCKED',name); continue
              pat=r'<img class="photo"[^>]*src="'+re.escape(url)+r'"[^>]*>'
              rep=f'<img class="photo" loading="lazy" src="../assets/images/doctors/{dest.name}?v=4" alt="{name}">'
              s,n=re.subn(pat,rep,s,count=1)
              if n==1: changed+=1; print('LOCALIZED',name)
              else: dest.unlink(missing_ok=True); failures.append(name)
          p.write_text(s)
          Path('/tmp/doctor-failures.txt').write_text('\n'.join(failures))
          print('Localized:',changed,'Still blocked:',failures)
          PY
      - name: Commit all successfully recovered portraits
        run: |
          git config user.name 'Elajme India Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/images/doctors doctors/index.html
          if git diff --cached --quiet; then echo 'No new portraits recovered'; exit 0; fi
          git commit -m 'Localize seven additional doctor portraits'
          git push
      - name: Report remaining blocked portraits
        run: |
          if [ -s /tmp/doctor-failures.txt ]; then
            echo 'Still blocked:'
            cat /tmp/doctor-failures.txt
          else
            echo 'All doctor portraits localized.'
          fi
