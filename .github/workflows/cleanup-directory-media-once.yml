name: Cleanup directory media markup once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-directory-media-once.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove redundant Harsh fallback and verify directory media
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('doctors/index.html')
          s=p.read_text(encoding='utf-8')
          old=' onerror="this.onerror=null;this.src=\'/assets/images/doctors/dr-harsh-dua.webp\'"'
          if old in s:
              s=s.replace(old,'',1)
              p.write_text(s,encoding='utf-8')
          s=p.read_text(encoding='utf-8')
          assert 'src="/assets/images/doctors/dr-harsh-dua.webp"' in s
          assert 'https://www.fortishealthcare.com/azblob/files/styles/experts_image/azblob/doctors/dr-anil--mandhani-1879.jpg?itok=ZyR0xaHZ' in s
          assert 'URLSearchParams' in s
          assert '/#enquiry' in s
          assert 'footer-approved.css' in s
          print('DIRECTORY MEDIA MARKUP CLEAN')
          PY
      - name: Commit cleanup if changed
        shell: bash
        run: |
          if git diff --quiet; then echo 'No change required'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add doctors/index.html
          git commit -m 'Clean redundant doctor directory image fallback'
          git push
