name: Live bilingual treatment context deployment
on:
  pull_request:
    paths:
      - '.github/workflows/live-cancer-context-deployment.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-cancer-context-deployment.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify production treatment-aware sticky enquiry
        shell: bash
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch();
            const failures=[];
            for(const [path,expected] of [
              ['/treatments/cancer-treatment-india/','/?treatment=cancer-treatment-india#enquiry'],
              ['/ar/treatments/cancer-treatment-india/','/ar/?treatment=cancer-treatment-india#enquiry'],
              ['/treatments/heart-treatment-india/','/?treatment=heart-treatment-india#enquiry'],
              ['/ar/treatments/heart-treatment-india/','/ar/?treatment=heart-treatment-india#enquiry'],
              ['/treatments/kidney-transplant-india/','/?treatment=kidney-transplant-india#enquiry'],
              ['/ar/treatments/kidney-transplant-india/','/ar/?treatment=kidney-transplant-india#enquiry'],
              ['/treatments/gastroenterology-treatment-india/','/?treatment=gastroenterology-treatment-india#enquiry'],
              ['/ar/treatments/gastroenterology-treatment-india/','/ar/?treatment=gastroenterology-treatment-india#enquiry'],
              ['/treatments/knee-replacement-india/','/?treatment=knee-replacement-india#enquiry'],
              ['/ar/treatments/knee-replacement-india/','/ar/?treatment=knee-replacement-india#enquiry'],
              ['/treatments/liver-transplant-india/','/?treatment=liver-transplant-india#enquiry'],
              ['/ar/treatments/liver-transplant-india/','/ar/?treatment=liver-transplant-india#enquiry'],
              ['/treatments/neurosurgery-india/','/?treatment=neurosurgery-india#enquiry'],
              ['/ar/treatments/neurosurgery-india/','/ar/?treatment=neurosurgery-india#enquiry']
            ]){
              const page=await browser.newPage({viewport:{width:390,height:844}});
              try{
                const response=await page.goto('https://elajmeindia.com'+path,{waitUntil:'domcontentloaded',timeout:45000});
                await page.waitForFunction(()=>document.querySelector('.elajme-bottom-actions .elajme-bottom-enquiry')?.getAttribute('href')?.includes('?treatment='),null,{timeout:15000});
                const r=await page.evaluate(()=>{
                  const enq=document.querySelector('.elajme-bottom-enquiry'),wa=document.querySelector('.elajme-bottom-wa'),bar=document.querySelector('.elajme-bottom-actions');
                  return {href:enq?.getAttribute('href'),whatsapp:new URL(wa.href).pathname,barCount:document.querySelectorAll('.elajme-bottom-actions').length,fixed:getComputedStyle(bar).position==='fixed',overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2};
                });
                const pass=response.status()===200&&r.href===expected&&r.whatsapp==='/917488955154'&&r.barCount===1&&r.fixed&&!r.overflow;
                console.log('LIVE_TREATMENT_CONTEXT',path,JSON.stringify({...r,pass}));
                if(!pass)failures.push(path);
              }catch(e){failures.push(path+': '+e.message)}
              await page.close();
            }
            await browser.close();
            if(failures.length){console.error(failures.join('\n'));process.exitCode=1}
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
