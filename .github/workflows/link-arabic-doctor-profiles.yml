name: Strengthen Nigeria patient conversion journey once

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/link-arabic-doctor-profiles.yml'

permissions:
  contents: write

jobs:
  strengthen-nigeria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add bilingual Nigeria treatment and case-submission guidance safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          protected=(Path('assets/css/footer-approved.css'),Path('FOOTER-LOCK.md'))
          hashes={p:hashlib.sha256(p.read_bytes()).hexdigest() for p in protected}

          jobs={
            Path('nigeria/treatment-in-india/index.html'):(
              '<section class="sec alt"><div class="c"><h2>From Nigeria to treatment in India</h2>',
              '<section class="sec alt"><div class="c"><h2>Treatment areas Nigerian patients can explore</h2><p>The appropriate specialty, hospital and doctor depend on the diagnosis and medical review. These treatment pages can help you understand common care pathways before submitting a case.</p><div class="related"><a href="/treatments/cancer-treatment-india/">Cancer treatment</a><a href="/treatments/heart-treatment-india/">Heart treatment</a><a href="/treatments/kidney-transplant-india/">Kidney transplant</a><a href="/treatments/liver-transplant-india/">Liver transplant</a><a href="/treatments/knee-replacement-india/">Knee replacement</a><a href="/treatments/neurosurgery-india/">Neurosurgery</a><a href="/treatments/spine-surgery-india/">Spine surgery</a><a href="/treatments/urology-treatment-india/">Urology</a><a href="/treatments/gastroenterology-treatment-india/">Gastroenterology</a></div><div class="note">The treating medical team determines the appropriate specialty, investigations and treatment after reviewing the individual case.</div></div></section><section class="sec"><div class="c"><h2>What to send for an initial review</h2><div class="grid"><article class="card"><h3>Medical summary</h3><p>Diagnosis if known, current medical concern, symptoms and relevant medical history.</p></article><article class="card"><h3>Recent reports</h3><p>Relevant laboratory, pathology, biopsy, discharge or specialist reports where available.</p></article><article class="card"><h3>Scans and imaging</h3><p>MRI, CT, PET-CT, X-ray, ultrasound or other relevant imaging reports and files when available.</p></article><article class="card"><h3>Previous treatment</h3><p>Details of previous surgery, medicines, chemotherapy, radiotherapy or other treatment where applicable.</p></article></div><p><a class="btn" href="/#enquiry">Send your case to Elajme India</a></p></div></section><section class="sec alt"><div class="c"><h2>From Nigeria to treatment in India</h2>'
            ),
            Path('ar/nigeria/treatment-in-india/index.html'):(
              '<section class="sec"><div class="c"><h2>كيف ننسق رحلة العلاج؟</h2>',
              '<section class="sec"><div class="c"><h2>مجالات علاج يمكن للمرضى من نيجيريا استكشافها</h2><p>يعتمد اختيار التخصص والمستشفى والطبيب على التشخيص ومراجعة الحالة الطبية. تساعد صفحات العلاج التالية على فهم مسارات الرعاية العامة قبل إرسال الحالة.</p><div class="related"><a href="/ar/treatments/cancer-treatment-india/">علاج السرطان</a><a href="/ar/treatments/heart-treatment-india/">علاج القلب</a><a href="/ar/treatments/kidney-transplant-india/">زراعة الكلى</a><a href="/ar/treatments/liver-transplant-india/">زراعة الكبد</a><a href="/ar/treatments/knee-replacement-india/">استبدال الركبة</a><a href="/ar/treatments/neurosurgery-india/">جراحة الأعصاب</a><a href="/ar/treatments/spine-surgery-india/">جراحة العمود الفقري</a><a href="/ar/treatments/urology-treatment-india/">المسالك البولية</a><a href="/ar/treatments/gastroenterology-treatment-india/">الجهاز الهضمي</a></div><div class="note">يحدد الفريق الطبي المعالج التخصص والفحوصات والخطة العلاجية المناسبة بعد مراجعة الحالة الفردية.</div></div></section><section class="sec alt"><div class="c"><h2>ما الذي يُفضل إرساله للمراجعة الأولية؟</h2><div class="grid"><div class="card"><h3>ملخص طبي</h3><p>التشخيص إن كان معروفاً والمشكلة الطبية الحالية والأعراض والتاريخ الطبي ذي الصلة.</p></div><div class="card"><h3>التقارير الحديثة</h3><p>التحاليل وتقارير الخزعة أو علم الأمراض وملخصات الخروج وتقارير الأطباء ذات الصلة عند توفرها.</p></div><div class="card"><h3>صور الأشعة</h3><p>تقارير وملفات الرنين المغناطيسي أو الأشعة المقطعية أو PET-CT أو الأشعة السينية أو الموجات فوق الصوتية عند توفرها.</p></div><div class="card"><h3>العلاج السابق</h3><p>تفاصيل العمليات والأدوية والعلاج الكيميائي أو الإشعاعي أو أي علاج سابق عند انطباق ذلك.</p></div></div><p><a class="btn" href="/ar/#enquiry">أرسل حالتك إلى علاج مي إنديا</a></p></div></section><section class="sec"><div class="c"><h2>كيف ننسق رحلة العلاج؟</h2>'
            )
          }

          for path,(marker,replacement) in jobs.items():
              s=path.read_text(encoding='utf-8')
              pre,sep,footer=s.partition('<footer')
              if not sep: raise SystemExit(f'Footer missing: {path}')
              if 'Treatment areas Nigerian patients can explore' in pre or 'مجالات علاج يمكن للمرضى من نيجيريا استكشافها' in pre:
                  print('Already updated:',path); continue
              if marker not in pre: raise SystemExit(f'Marker missing: {path}')
              pre=pre.replace(marker,replacement,1)
              path.write_text(pre+sep+footer,encoding='utf-8')
              print('Updated:',path)

          for p,h in hashes.items():
              if hashlib.sha256(p.read_bytes()).hexdigest()!=h:
                  raise SystemExit(f'Protected footer file changed: {p}')
          print('Footer lock files unchanged.')
          PY
      - name: Verify Nigeria bilingual conversion and commit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          checks={
            'nigeria/treatment-in-india/index.html':['Treatment areas Nigerian patients can explore','What to send for an initial review','href="/#enquiry"','/treatments/cancer-treatment-india/','/treatments/spine-surgery-india/'],
            'ar/nigeria/treatment-in-india/index.html':['مجالات علاج يمكن للمرضى من نيجيريا استكشافها','ما الذي يُفضل إرساله للمراجعة الأولية؟','href="/ar/#enquiry"','/ar/treatments/cancer-treatment-india/','/ar/treatments/spine-surgery-india/']
          }
          for f,needles in checks.items():
              s=Path(f).read_text(encoding='utf-8')
              for n in needles: assert n in s,(f,n)
          print('Nigeria bilingual treatment and case-submission journey verified.')
          PY
          if git diff --quiet; then echo 'No content change required.'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nigeria/treatment-in-india/index.html ar/nigeria/treatment-in-india/index.html
          git commit -m 'Strengthen Nigeria patient conversion journey'
          git push
