name: Phase 2 Lighthouse mobile verification
on:
  pull_request:
    paths:
      - '.github/workflows/phase2-lighthouse-mobile.yml'
permissions:
  contents: read
jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing Lighthouse and Chromium versions
        run: |
          npm install --no-save lighthouse@12.8.2 playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Compare pinned baseline and CLS-fix previews on the same runner
        run: |
          mkdir -p audit-results
          export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          node <<'NODE'
          const fs=require('fs'),{execFileSync}=require('child_process');
          const results=[];
          const origins={baseline:'https://0cba6f08.elajme-india.pages.dev',candidate:'https://b08bf7af.elajme-india.pages.dev'};
          for(let round=1;round<=3;round++)for(const lang of ['en','ar'])for(const variant of (round===2?['candidate','baseline']:['baseline','candidate'])){
           const url=origins[variant]+(lang==='ar'?'/ar/':'/'),id=`${lang}-${variant}-${round}`,file=`audit-results/${id}.json`;
           const flags=['--only-categories=performance,accessibility,best-practices,seo','--form-factor=mobile','--screenEmulation.mobile','--screenEmulation.width=390','--screenEmulation.height=844','--screenEmulation.deviceScaleFactor=1','--throttling-method=simulate','--chrome-flags=--headless --no-sandbox --disable-dev-shm-usage','--save-assets','--output=json','--output-path='+file,'--quiet','--blocked-url-patterns=*google-analytics.com/*','--blocked-url-patterns=*analytics.google.com/*','--blocked-url-patterns=*doubleclick.net/*','--blocked-url-patterns=*cloudflareinsights.com/*'];
           execFileSync('./node_modules/.bin/lighthouse',[url,...flags],{stdio:'inherit',timeout:150000});
           const r=JSON.parse(fs.readFileSync(file));if(r.runtimeError||r.audits['http-status-code']?.score!==1)throw Error('Invalid benchmark '+id);
           const a=r.audits,result={id,lang,variant,round,url,version:r.lighthouseVersion,browser:r.environment.networkUserAgent,lcpMs:a['largest-contentful-paint'].numericValue,cls:a['cumulative-layout-shift'].numericValue,tbtMs:a['total-blocking-time'].numericValue,ttfbMs:a['server-response-time'].numericValue,scores:Object.fromEntries(Object.entries(r.categories).map(([k,v])=>[k,Math.round(v.score*100)])),lcpElement:a['lcp-breakdown-insight']?.details?.items?.find(x=>x.type==='node')?.selector};
           if(!result.lcpElement?.endsWith('h1'))throw Error('Unexpected LCP document '+id);results.push(result);fs.writeFileSync('audit-results/paired-results.json',JSON.stringify(results,null,2));console.log('PAIRED',JSON.stringify(result));
          }
          const median=a=>a.sort((a,b)=>a-b)[Math.floor(a.length/2)],summary=[];
          for(const lang of ['en','ar'])for(const variant of ['baseline','candidate']){const rows=results.filter(r=>r.lang===lang&&r.variant===variant);summary.push({lang,variant,lcpSamples:rows.map(r=>r.lcpMs),medianLcpMs:median(rows.map(r=>r.lcpMs)),cls:rows.map(r=>r.cls),scores:rows.map(r=>r.scores)})}
          console.log('SUMMARY',JSON.stringify(summary));fs.writeFileSync('audit-results/summary.json',JSON.stringify(summary,null,2));fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'## Paired preview mobile measurements\n\n'+JSON.stringify(summary,null,2)+'\n\nPreview noindex headers may affect SEO scores; production SEO must be checked separately. This branch changes only this workflow and must not be merged.\n');
          NODE
      - name: Upload comparable Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tablet-cls-paired-lighthouse
          path: audit-results/
