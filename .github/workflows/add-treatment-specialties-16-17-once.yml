name: Add treatment specialties 16 and 17 once
on:
  push:
    paths:
      - '.github/workflows/add-treatment-specialties-16-17-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  expand-treatment-directory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add bilingual BMT and bariatric treatment coverage
        shell: python
        run: |
          from pathlib import Path

          en_header='''<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'''
          en_shell='''<link rel="stylesheet" href="../../assets/css/treatment.css"><link rel="stylesheet" href="/assets/css/footer-approved.css?v=1"><link rel="stylesheet" href="/assets/css/mobile-header.css?v=3"><link rel="stylesheet" href="/assets/css/master-header.css?v=6"></head><body><header class="master-site-header"><div class="master-header-inner"><a class="master-brand" href="/" aria-label="Elajme India Home"><img src="/Healthcare%20Travel%20Swoosh%20Emblem.webp" alt="" width="60" height="60"><span class="master-brand-text"><span class="master-brand-main"><span>Elajme</span><b>India</b></span><span class="master-brand-ar" lang="ar" dir="rtl">علاج مي إنديا</span></span></a><nav class="master-nav" aria-label="Main navigation"><a href="/">Home</a><a href="/treatments/" aria-current="page">Treatments</a><a href="/hospitals/">Hospitals</a><a href="/doctors/">Doctors</a><a href="/international-patients/mea/">International Patients</a><a href="/about/">About Us</a><a href="/contact/">Contact</a></nav><div class="master-actions"><a class="master-phone" href="tel:+917488955154">+91 74889 55154</a><a class="master-whatsapp" href="https://wa.me/917488955154" target="_blank" rel="noopener">◉&nbsp; WhatsApp Us</a><a class="master-lang" href="/ar/">العربية</a><a class="master-cta" href="/#enquiry">Start Your Enquiry</a></div></div></header>'''
          en_footer='''<footer class="site-footer"><div class="container footer-wrap"><div class="footer-top"><div class="footer-brand"><img src="/Healthcare%20Travel%20Swoosh%20Emblem.png" alt="" class="brand-icon" loading="lazy" decoding="async"><span class="brand-text"><strong>Elajme India</strong><span lang="ar" dir="rtl">علاج مي إنديا</span></span></div><nav class="footer-links" aria-label="Footer navigation"><a href="/">Home</a><a href="/treatments/">Treatments</a><a href="/hospitals/">Hospitals</a><a href="/doctors/">Doctors</a><a href="/international-patients/mea/">International Patients</a><a href="/privacy.html">Privacy Policy</a><a href="/terms.html">Terms &amp; Medical Disclaimer</a></nav></div><div class="footer-bottom"><p>© 2026 Elajme India. International patient coordination.</p></div></div></footer><script src="/assets/js/mobile-header.js?v=3" defer></script></body></html>'''

          def en_page(slug,title,desc,ey,h1,lead,cards,records,cta):
            card_html=''.join(f'<article class="card"><h3>{h}</h3><p>{p}</p></article>' for h,p in cards)
            return en_header+f'<title>{title}</title><meta name="description" content="{desc}"><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="https://elajmeindia.com/treatments/{slug}/"><link rel="alternate" hreflang="en" href="https://elajmeindia.com/treatments/{slug}/"><link rel="alternate" hreflang="ar" href="https://elajmeindia.com/ar/treatments/{slug}/"><link rel="alternate" hreflang="x-default" href="https://elajmeindia.com/treatments/{slug}/">'+en_shell+f'''<main><section class="hero"><div class="c"><span class="ey">{ey}</span><h1>{h1}</h1><p class="lead">{lead}</p><a class="btn" href="/#enquiry">Request coordination through Elajme India</a></div></section><section class="sec"><div class="c"><h2>Care depends on individual assessment</h2><div class="grid">{card_html}</div><div class="note">Elajme India provides international patient coordination and general information. We do not diagnose conditions, prescribe treatment or guarantee treatment acceptance or outcomes.</div></div></section><section class="sec alt"><div class="c"><h2>What to share for an initial review</h2><p class="lead">{records}</p><div class="grid"><article class="card"><h3>1. Send available records</h3><p>Share the diagnosis, current medical concern and relevant available records with Elajme India.</p></article><article class="card"><h3>2. Coordinate specialist review</h3><p>We can coordinate submission to an appropriate hospital or specialist team for preliminary review.</p></article><article class="card"><h3>3. Confirm next steps</h3><p>Investigations, treatment options, timing, eligibility and estimates remain subject to the treating provider’s review.</p></article></div><div class="related"><a href="../../hospitals/">Explore hospitals</a><a href="../../doctors/">Browse doctors</a><a href="../../patient-guide/">Patient guide</a><a href="/#enquiry">Request a medical opinion</a></div></div></section><section class="cta"><div class="c"><h2>{cta}</h2><p>Share the medical concern, available reports and your country. Elajme India can coordinate the next enquiry step with an appropriate medical team.</p><a class="btn" href="/#enquiry">Send your enquiry</a></div></section></main>'''+en_footer

          Path('treatments/bone-marrow-transplant-india').mkdir(parents=True,exist_ok=True)
          Path('treatments/bone-marrow-transplant-india/index.html').write_text(en_page('bone-marrow-transplant-india','Bone Marrow Transplant in India | International Patients | Elajme India','Bone marrow and stem cell transplant enquiry coordination in India for international patients, with specialist review arranged through Elajme India.','Bone marrow transplant coordination','Bone marrow transplant in India for international patients','Elajme India helps international patients coordinate enquiries for bone marrow and hematopoietic stem cell transplant assessment with appropriate specialist teams in India. Eligibility and treatment planning depend on individual clinical review.',[('Transplant assessment','Specialist teams review the diagnosis, disease status, previous treatment, general health and transplant indication before recommending a pathway.'),('Donor and transplant planning','Depending on the condition, the treating team may assess donor options, compatibility testing and the appropriate transplant approach.'),('Pre-transplant and follow-up care','Required investigations, infection screening, admission planning and follow-up are determined by the transplant centre after assessment.')],'Useful records may include diagnosis and pathology reports, bone marrow reports, blood tests, imaging, treatment history, chemotherapy records, HLA or donor testing if already performed, and current medicines.','Start a bone marrow transplant enquiry'),encoding='utf-8')

          Path('treatments/bariatric-weight-loss-surgery-india').mkdir(parents=True,exist_ok=True)
          Path('treatments/bariatric-weight-loss-surgery-india/index.html').write_text(en_page('bariatric-weight-loss-surgery-india','Bariatric Surgery in India | International Patients | Elajme India','Bariatric and weight-loss surgery enquiry coordination in India for international patients, with specialist review through Elajme India.','Bariatric surgery coordination','Bariatric and weight-loss surgery in India for international patients','Elajme India helps international patients coordinate bariatric and metabolic surgery enquiries with appropriate specialist teams in India. Suitability for surgery and the procedure choice require individual medical assessment.',[('Eligibility assessment','The bariatric team evaluates weight history, BMI, obesity-related conditions, previous weight-management efforts and overall health.'),('Procedure planning','The treating surgeon determines whether surgery is appropriate and discusses suitable options based on the patient’s clinical profile.'),('Nutrition and follow-up','Dietary assessment, lifestyle preparation and long-term follow-up are important parts of bariatric care and are planned by the treating team.')],'Useful information may include height and weight, BMI if known, medical history, diabetes or blood-pressure records, sleep-apnoea information, previous weight-loss treatment, recent blood tests, imaging where relevant and current medicines.','Start a bariatric surgery enquiry'),encoding='utf-8')

          ar_shell='''<link rel="stylesheet" href="/assets/css/ar-core.css"><link rel="stylesheet" href="/assets/css/footer-approved.css?v=1"><link rel="stylesheet" href="/assets/css/mobile-header.css?v=3"><link rel="stylesheet" href="/assets/css/master-header.css?v=6"><link rel="stylesheet" href="/assets/css/arabic-master-header.css?v=2"></head><body><header class="master-site-header"><div class="master-header-inner"><a class="master-brand" href="/ar/" aria-label="علاج مي إنديا - الرئيسية"><img src="/Healthcare%20Travel%20Swoosh%20Emblem.webp" alt="" width="60" height="60"><span class="master-brand-text"><span class="master-brand-main"><span>Elajme</span><b>India</b></span><span class="master-brand-ar" lang="ar" dir="rtl">علاج مي إنديا</span></span></a><nav class="master-nav" aria-label="التنقل الرئيسي"><a href="/ar/">الرئيسية</a><a href="/ar/treatments/" aria-current="page">العلاجات</a><a href="/ar/hospitals/">المستشفيات</a><a href="/ar/doctors/">الأطباء</a><a href="/ar/international-patients/mea/">المرضى الدوليون</a><a href="/ar/about/">من نحن</a><a href="/ar/contact/">تواصل معنا</a></nav><div class="master-actions"><a class="master-phone" href="tel:+917488955154"><bdi>+91 74889 55154</bdi></a><a class="master-whatsapp" href="https://wa.me/917488955154" target="_blank" rel="noopener">◉&nbsp; واتساب</a><a class="master-lang" href="/">English</a><a class="master-cta" href="/ar/#enquiry">ابدأ استفسارك</a></div></div></header>'''
          ar_footer='''<footer class="site-footer"><div class="container footer-wrap"><div class="footer-top"><div class="footer-brand"><img src="/Healthcare%20Travel%20Swoosh%20Emblem.png" alt="" class="brand-icon" loading="lazy" decoding="async"><span class="brand-text"><strong>Elajme India</strong><span lang="ar" dir="rtl">علاج مي إنديا</span></span></div><nav class="footer-links" aria-label="روابط التذييل"><a href="/ar/">الرئيسية</a><a href="/ar/treatments/">العلاجات</a><a href="/ar/hospitals/">المستشفيات</a><a href="/ar/doctors/">الأطباء</a><a href="/ar/international-patients/mea/">المرضى الدوليون</a><a href="/ar/privacy.html">سياسة الخصوصية</a><a href="/ar/terms.html">الشروط وإخلاء المسؤولية الطبية</a></nav></div><div class="footer-bottom"><p>© 2026 علاج مي إنديا. تنسيق المرضى الدوليين.</p></div></div></footer><script src="/assets/js/mobile-header.js?v=3" defer></script></body></html>'''
          def ar_page(slug,title,desc,h1,lead,cards,records,cta):
            cards_html=''.join(f'<article class="card"><h3>{h}</h3><p>{p}</p></article>' for h,p in cards)
            return f'''<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{title}</title><meta name="description" content="{desc}"><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="https://elajmeindia.com/ar/treatments/{slug}/"><link rel="alternate" hreflang="en" href="https://elajmeindia.com/treatments/{slug}/"><link rel="alternate" hreflang="ar" href="https://elajmeindia.com/ar/treatments/{slug}/"><link rel="alternate" hreflang="x-default" href="https://elajmeindia.com/treatments/{slug}/">'''+ar_shell+f'''<main><section class="hero"><div class="c"><h1>{h1}</h1><p class="lead">{lead}</p><a class="btn" href="/ar/#enquiry">اطلب التنسيق عبر علاج مي إنديا</a></div></section><section class="sec"><div class="c"><h2>تحديد الرعاية يعتمد على التقييم الفردي</h2><div class="grid">{cards_html}</div><div class="note">تقدم علاج مي إنديا خدمات تنسيق المرضى الدوليين ومعلومات عامة، ولا تقدم تشخيصاً أو وصفاً للعلاج ولا تضمن قبول الحالة أو النتائج العلاجية.</div></div></section><section class="sec alt"><div class="c"><h2>ما الذي يمكن إرساله للمراجعة الأولية؟</h2><p class="lead">{records}</p><div class="grid"><article class="card"><h3>1. إرسال التقارير المتوفرة</h3><p>أرسل التشخيص والمشكلة الطبية الحالية والتقارير ذات الصلة إلى علاج مي إنديا.</p></article><article class="card"><h3>2. تنسيق مراجعة الفريق المختص</h3><p>يمكننا تنسيق إرسال الحالة إلى مستشفى أو فريق متخصص مناسب للمراجعة الأولية.</p></article><article class="card"><h3>3. تأكيد الخطوات التالية</h3><p>تخضع الفحوصات وخيارات العلاج والتوقيت والأهلية والتكلفة التقديرية لمراجعة الجهة الطبية المعالجة.</p></article></div><div class="related"><a href="/ar/hospitals/">المستشفيات</a><a href="/ar/doctors/">الأطباء</a><a href="/ar/patient-guide/">دليل المريض</a><a href="/ar/#enquiry">طلب رأي طبي</a></div></div></section><section class="cta"><div class="c"><h2>{cta}</h2><p>أرسل وصف الحالة والتقارير المتوفرة وبلد الإقامة، ويمكن لعلاج مي إنديا تنسيق الخطوة التالية مع فريق طبي مناسب.</p><a class="btn" href="/ar/#enquiry">أرسل استفسارك</a></div></section></main>'''+ar_footer

          Path('ar/treatments/bone-marrow-transplant-india').mkdir(parents=True,exist_ok=True)
          Path('ar/treatments/bone-marrow-transplant-india/index.html').write_text(ar_page('bone-marrow-transplant-india','زراعة نخاع العظم في الهند للمرضى الدوليين | علاج مي إنديا','تنسيق استفسارات زراعة نخاع العظم والخلايا الجذعية في الهند للمرضى الدوليين مع مراجعة الفرق المتخصصة عبر علاج مي إنديا.','زراعة نخاع العظم في الهند للمرضى الدوليين','تساعد علاج مي إنديا المرضى الدوليين في تنسيق استفسارات تقييم زراعة نخاع العظم والخلايا الجذعية المكوّنة للدم مع الفرق المتخصصة المناسبة في الهند. تعتمد الأهلية وخطة العلاج على التقييم السريري الفردي.',[('تقييم الحاجة للزراعة','يراجع الفريق المختص التشخيص وحالة المرض والعلاجات السابقة والصحة العامة ومدى الحاجة إلى الزراعة.'),('تقييم المتبرع وخطة الزراعة','بحسب الحالة قد يقيّم الفريق خيارات المتبرعين وفحوصات التوافق ونوع الزراعة المناسب.'),('التحضير والمتابعة','يحدد مركز الزراعة الفحوصات المطلوبة وفحوص العدوى وخطة الدخول والمتابعة بعد التقييم.')],'يمكن إرسال التشخيص وتقارير علم الأمراض وتقارير نخاع العظم وتحاليل الدم والصور الطبية وسجل العلاجات والعلاج الكيميائي وفحوص التوافق أو المتبرع إن وجدت وقائمة الأدوية الحالية.','ابدأ استفسار زراعة نخاع العظم'),encoding='utf-8')
          Path('ar/treatments/bariatric-weight-loss-surgery-india').mkdir(parents=True,exist_ok=True)
          Path('ar/treatments/bariatric-weight-loss-surgery-india/index.html').write_text(ar_page('bariatric-weight-loss-surgery-india','جراحة السمنة في الهند للمرضى الدوليين | علاج مي إنديا','تنسيق استفسارات جراحة السمنة وإنقاص الوزن في الهند للمرضى الدوليين مع مراجعة الفرق المتخصصة عبر علاج مي إنديا.','جراحة السمنة وإنقاص الوزن في الهند للمرضى الدوليين','تساعد علاج مي إنديا المرضى الدوليين في تنسيق استفسارات جراحة السمنة والتمثيل الغذائي مع الفرق المتخصصة المناسبة في الهند. تتطلب ملاءمة الجراحة واختيار الإجراء تقييماً طبياً فردياً.',[('تقييم الأهلية','يقيّم فريق السمنة تاريخ الوزن ومؤشر كتلة الجسم والأمراض المرتبطة بالسمنة والمحاولات السابقة لإنقاص الوزن والحالة الصحية العامة.'),('اختيار الإجراء','يحدد الجراح المعالج ما إذا كانت الجراحة مناسبة ويناقش الخيارات الملائمة وفق الحالة السريرية للمريض.'),('التغذية والمتابعة','يعد التقييم الغذائي والاستعداد لتغيير نمط الحياة والمتابعة طويلة المدى أجزاء مهمة من رعاية جراحة السمنة.')],'يمكن إرسال الطول والوزن ومؤشر كتلة الجسم إن كان معروفاً والتاريخ الطبي وتقارير السكري أو ضغط الدم ومعلومات انقطاع النفس أثناء النوم ومحاولات إنقاص الوزن السابقة والتحاليل الحديثة والأدوية الحالية.','ابدأ استفسار جراحة السمنة'),encoding='utf-8')

          # Patch English directory and structured ItemList.
          p=Path('treatments/index.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('Medical Treatment in India: 15 Specialties','Medical Treatment in India: 17 Specialties').replace('Explore 15 medical treatment areas','Explore 17 medical treatment areas')
          marker='''{"@type":"ListItem","position":15,"name":"ENT & Ear, Nose and Throat Care","url":"https://elajmeindia.com/treatments/ent-treatment-india/"}'''
          replacement=marker+''',{"@type":"ListItem","position":16,"name":"Bone Marrow & Stem Cell Transplant","url":"https://elajmeindia.com/treatments/bone-marrow-transplant-india/"},{"@type":"ListItem","position":17,"name":"Bariatric & Weight-Loss Surgery","url":"https://elajmeindia.com/treatments/bariatric-weight-loss-surgery-india/"}'''
          if 'bone-marrow-transplant-india' not in s: s=s.replace(marker,replacement)
          card_marker='''<article class="card"><h3><a href="ent-treatment-india/">ENT &amp; Ear, Nose and Throat Care</a></h3><p>ENT specialist review and ear, nose, sinus, throat and voice-care enquiry coordination.</p></article>'''
          new_cards=card_marker+'''<article class="card"><h3><a href="bone-marrow-transplant-india/">Bone Marrow &amp; Stem Cell Transplant</a></h3><p>Specialist review and transplant-enquiry coordination for eligible haematology cases.</p></article><article class="card"><h3><a href="bariatric-weight-loss-surgery-india/">Bariatric &amp; Weight-Loss Surgery</a></h3><p>Bariatric and metabolic surgery assessment and enquiry coordination.</p></article>'''
          if 'bariatric-weight-loss-surgery-india/' not in s: s=s.replace(card_marker,new_cards)
          p.write_text(s,encoding='utf-8')

          # Patch Arabic directory.
          p=Path('ar/treatments/index.html'); s=p.read_text(encoding='utf-8')
          card_marker='''<article class="card"><h3>الأنف والأذن والحنجرة</h3><p>تنسيق مراجعة واستفسارات حالات الأذن والأنف والجيوب الأنفية والحنجرة والصوت.</p><a href="ent-treatment-india/">عرض التفاصيل</a></article>'''
          new_cards=card_marker+'''<article class="card"><h3>زراعة نخاع العظم والخلايا الجذعية</h3><p>تنسيق مراجعة حالات أمراض الدم واستفسارات زراعة نخاع العظم والخلايا الجذعية.</p><a href="bone-marrow-transplant-india/">عرض التفاصيل</a></article><article class="card"><h3>جراحة السمنة وإنقاص الوزن</h3><p>تنسيق تقييم واستفسارات جراحة السمنة والتمثيل الغذائي مع الفرق المتخصصة.</p><a href="bariatric-weight-loss-surgery-india/">عرض التفاصيل</a></article>'''
          if 'bone-marrow-transplant-india/' not in s: s=s.replace(card_marker,new_cards)
          p.write_text(s,encoding='utf-8')

          # Add all four canonical routes to sitemap without disturbing existing entries.
          p=Path('sitemap.xml'); s=p.read_text(encoding='utf-8')
          urls=['https://elajmeindia.com/treatments/bone-marrow-transplant-india/','https://elajmeindia.com/ar/treatments/bone-marrow-transplant-india/','https://elajmeindia.com/treatments/bariatric-weight-loss-surgery-india/','https://elajmeindia.com/ar/treatments/bariatric-weight-loss-surgery-india/']
          additions=''.join(f'  <url><loc>{u}</loc></url>\n' for u in urls if u not in s)
          s=s.replace('</urlset>',additions+'</urlset>')
          p.write_text(s,encoding='utf-8')
      - name: Verify additions
        run: |
          test -f treatments/bone-marrow-transplant-india/index.html
          test -f ar/treatments/bone-marrow-transplant-india/index.html
          test -f treatments/bariatric-weight-loss-surgery-india/index.html
          test -f ar/treatments/bariatric-weight-loss-surgery-india/index.html
          grep -q '17 Specialties' treatments/index.html
          grep -q 'bone-marrow-transplant-india' ar/treatments/index.html
          grep -q 'bariatric-weight-loss-surgery-india' ar/treatments/index.html
      - name: Commit expansion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add treatments ar/treatments sitemap.xml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Expand treatment directory to 17 bilingual specialties'
          git push