name: Map verified profile images
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/map-local-profile-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  map-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Propagate verified doctor portraits to English and Arabic directories
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Sources already verified on the corresponding Elajme India doctor profiles.
          verified = {
              'dr-abhideep-chaudhary': 'https://d35oenyzp35321.cloudfront.net/Dr_Abhideep_Chaudhary_9f61965dec.jpg',
              'dr-anil-mandhani': 'https://www.fortishealthcare.com/azblob/files/styles/experts_image/azblob/doctors/dr-anil--mandhani-1879.jpg?itok=ZyR0xaHZ',
              'prof-dr-subhash-gupta': 'https://d35oenyzp35321.cloudfront.net/Dr_SG_da91d515bc.jpg',
              'dr-sanjay-gogoi': '/assets/images/doctors/dr-sanjay-gogoi.png',
          }

          def replace_card_image(text, slug, src, css_class):
              # Match a directory card by its profile href, then replace only that card's image.
              href_slugs = [slug]
              if slug.startswith('prof-dr-'):
                  href_slugs.append(slug.replace('prof-dr-', 'dr-', 1))
              cards = list(re.finditer(r'<article class="card".*?</article>', text, re.S))
              for m in reversed(cards):
                  card = m.group(0)
                  if not any((s + '/') in card for s in href_slugs):
                      continue
                  h2 = re.search(r'<h2>(.*?)</h2>', card, re.S)
                  alt = re.sub(r'<[^>]+>', '', h2.group(1)).strip() if h2 else slug.replace('-', ' ').title()
                  img = f'<img class="{css_class}" loading="lazy" src="{src}" alt="{alt}" decoding="async">'
                  newcard, n = re.subn(rf'<img class="{re.escape(css_class)}"[^>]*>', img, card, count=1)
                  if n:
                      text = text[:m.start()] + newcard + text[m.end():]
              return text

          changed=[]
          targets=[
              (Path('doctors/index.html'), 'photo'),
              (Path('ar/doctors/index.html'), 'directory-photo'),
          ]
          for p, cls in targets:
              if not p.exists():
                  continue
              text=p.read_text(encoding='utf-8')
              old=text
              for slug, src in verified.items():
                  text=replace_card_image(text, slug, src, cls)
              if text != old:
                  p.write_text(text, encoding='utf-8')
                  changed.append(str(p))

          # Also map every exact same-slug local portrait onto any remaining placeholder cards.
          assets=Path('assets/images/doctors')
          image_exts={'.jpg','.jpeg','.png','.webp','.avif'}
          local={p.stem.lower(): '/assets/images/doctors/'+p.name for p in assets.iterdir() if p.is_file() and p.suffix.lower() in image_exts}
          for p, cls in targets:
              if not p.exists():
                  continue
              text=p.read_text(encoding='utf-8'); old=text
              for slug, src in local.items():
                  text=replace_card_image(text, slug, src, cls)
              if text != old:
                  p.write_text(text, encoding='utf-8')
                  changed.append(str(p))

          print('Updated:')
          for p in sorted(set(changed)):
              print(' -',p)
          PY
      - name: Commit directory portrait propagation
        shell: bash
        run: |
          git config user.name 'Elajme India Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add doctors/index.html ar/doctors/index.html
          if git diff --cached --quiet; then
            echo 'No directory portrait changes were needed.'
            exit 0
          fi
          git commit -m 'Propagate verified doctor portraits to directories'
          git push
