name: Route treatment pages to relevant hospitals once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/route-treatment-hospitals-once.yml']
permissions:
  contents: write
jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Add treatment-aware hospital discovery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          terms={
          'cancer-treatment-india':'oncology','heart-treatment-india':'cardiac','knee-replacement-india':'orthopaedics','neurosurgery-india':'neurosurgery','urology-treatment-india':'urology','gastroenterology-treatment-india':'gastroenterology','kidney-transplant-india':'kidney transplant','liver-transplant-india':'liver transplant','spine-surgery-india':'spine','fertility-ivf-treatment-india':'fertility','dental-treatment-india':'dental','cosmetic-surgery-india':'plastic surgery','eye-treatment-india':'ophthalmology','womens-health-gynaecology-india':'gynaecology','ent-treatment-india':'ENT'}
          locked=[Path('assets/css/footer-approved.css'),Path('FOOTER-LOCK.md')]
          before={p:hashlib.sha256(p.read_bytes()).hexdigest() for p in locked}
          changed=[]
          for lang in ('en','ar'):
            for slug,term in terms.items():
              p=Path('treatments' if lang=='en' else 'ar/treatments')/slug/'index.html'
              s=p.read_text(encoding='utf-8'); pre,sep,foot=s.partition('<footer')
              base='/hospitals/' if lang=='en' else '/ar/hospitals/'
              target=base+'?q='+term.replace(' ','%20')
              label='Find hospitals for this treatment' if lang=='en' else 'ابحث عن مستشفيات لهذا العلاج'
              # Replace the generic hospital discovery link while preserving Elajme-only enquiry routing.
              patterns=[r'href="(?:\.\./)+hospitals/"[^>]*>[^<]*</a>',r'href="/hospitals/"[^>]*>[^<]*</a>',r'href="/ar/hospitals/"[^>]*>[^<]*</a>']
              done=False
              for pat in patterns:
                if re.search(pat,pre):
                  pre=re.sub(pat,f'href="{target}">{label}</a>',pre,count=1); done=True; break
              if not done:
                marker='<div class="related">'
                assert marker in pre, f'{p}: related navigation missing'
                pre=pre.replace(marker,marker+f'<a href="{target}">{label}</a>',1)
              assert target in pre, f'{p}: hospital route missing'
              enquiry='/#enquiry' if lang=='en' else '/ar/#enquiry'
              assert enquiry in pre, f'{p}: Elajme enquiry route missing'
              out=pre+sep+foot
              if out!=s: p.write_text(out,encoding='utf-8'); changed.append(str(p))
          for p,h in before.items(): assert hashlib.sha256(p.read_bytes()).hexdigest()==h, f'LOCK VIOLATION {p}'
          print(f'TREATMENT HOSPITAL ROUTING CLEAN: {len(changed)} pages updated')
          PY
      - name: Commit treatment hospital routing
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add treatments ar/treatments
          git diff --cached --quiet && exit 0
          git commit -m 'Route bilingual treatment pages to relevant hospitals'
          git push
