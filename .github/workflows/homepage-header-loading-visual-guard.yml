name: English mobile header loading experiment visual guard
on:
  push:
    branches: [experiment/homepage-header-css-loading-20261117]
    paths: ['index.html', '.github/workflows/homepage-header-loading-visual-guard.yml']
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: main
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and image comparison tools
        working-directory: candidate
        run: |
          npm install --no-save playwright@1.56.1 pixelmatch@6.0.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Compare English above-the-fold baseline and experiment
        working-directory: candidate
        run: |
          python3 -m http.server 8765 --directory ../baseline >/tmp/baseline.log 2>&1 &
          python3 -m http.server 8766 --directory . >/tmp/candidate.log 2>&1 &
          sleep 2
          node - <<'NODE'
          const {chromium}=require('playwright');
          const {default:pixelmatch}=require('pixelmatch');
          const {PNG}=require('pngjs');
          (async()=>{
            const browser=await chromium.launch();
            let failed=false;
            for(const viewport of [{width:390,height:844},{width:1440,height:900}]){
              const results=[];
              for(const port of [8765,8766]){
                const page=await browser.newPage({viewport,deviceScaleFactor:1});
                page.setDefaultTimeout(10000);
                console.log('Starting viewport '+viewport.width+' port '+port);
                await page.addInitScript(()=>{window.__shift=0;new PerformanceObserver(list=>{for(const e of list.getEntries())if(!e.hadRecentInput)window.__shift+=e.value}).observe({type:'layout-shift',buffered:true})});
                await page.goto('http://127.0.0.1:'+port+'/',{waitUntil:'domcontentloaded',timeout:20000});
                await page.waitForTimeout(1200);
                await page.evaluate(()=>Promise.race([document.fonts.ready,new Promise(resolve=>setTimeout(resolve,3000))]));
                const footer=page.locator('body');
                
                await page.waitForTimeout(1000);
                const shot=PNG.sync.read(await page.screenshot({timeout:10000,animations:'disabled'}));
                const style=await page.locator('header').first().evaluate(el=>({height:el.getBoundingClientRect().height,links:el.querySelectorAll('a').length,background:getComputedStyle(el).backgroundColor}));
                results.push({shot,style,cls:await page.evaluate(()=>window.__shift)});
                await page.close();
              }
              const [a,b]=results;
              const sameSize=a.shot.width===b.shot.width&&a.shot.height===b.shot.height;
              const diff=sameSize?pixelmatch(a.shot.data,b.shot.data,null,a.shot.width,a.shot.height,{threshold:0.1})/(a.shot.width*a.shot.height):1;
              const sameStyle=JSON.stringify(a.style)===JSON.stringify(b.style);
              console.log(JSON.stringify({viewport,pixelDifference:diff,sameStyle,baselineCls:a.cls,candidateCls:b.cls,baseline:a.style,candidate:b.style}));
              if(!sameStyle||diff>0.001||b.cls>a.cls+0.005)failed=true;
            }
            await browser.close();
            console.log('Comparison finished');
            if(failed)process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1;process.exit();});
          NODE
