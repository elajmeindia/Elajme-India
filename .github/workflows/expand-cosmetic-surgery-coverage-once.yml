name: Expand cosmetic surgery treatment coverage once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/expand-cosmetic-surgery-coverage-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Create bilingual cosmetic surgery pages and connect discovery
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          locked=['assets/css/footer-approved.css','FOOTER-LOCK.md']
          before={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in locked}
          def footer(path):
              s=Path(path).read_text(encoding='utf-8'); i=s.find('<footer')
              if i<0: raise SystemExit('footer missing: '+path)
              return s[i:]
          ef=footer('treatments/dental-treatment-india/index.html')
          af=footer('ar/treatments/dental-treatment-india/index.html')
          en='''<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cosmetic Surgery in India | International Patients | Elajme India</title><meta name="description" content="Cosmetic and reconstructive surgery enquiry coordination in India for international patients, with preliminary record review through Elajme India."><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="https://elajmeindia.com/treatments/cosmetic-surgery-india/"><link rel="alternate" hreflang="en" href="https://elajmeindia.com/treatments/cosmetic-surgery-india/"><link rel="alternate" hreflang="ar" href="https://elajmeindia.com/ar/treatments/cosmetic-surgery-india/"><link rel="alternate" hreflang="x-default" href="https://elajmeindia.com/treatments/cosmetic-surgery-india/"><link rel="stylesheet" href="../../assets/css/treatment.css"><link rel="stylesheet" href="/assets/css/footer-approved.css?v=1"></head><body><header class="head"><div class="c nav"><a class="brand" href="../../">Elajme India</a><a href="../">Treatments</a><a href="../../doctors/">Doctors</a><a href="../../hospitals/">Hospitals</a><a href="../../patient-guide/">Patient Guide</a><a href="../../ar/treatments/cosmetic-surgery-india/" lang="ar" dir="rtl">العربية</a><a class="wa" href="/#enquiry">Start Your Enquiry</a></div></header><main><section class="hero"><div class="c"><span class="ey">Plastic and cosmetic surgery coordination</span><h1>Cosmetic surgery in India for international patients</h1><p class="lead">Elajme India helps international patients coordinate enquiries with qualified plastic and reconstructive surgery teams in India. Suitability, procedure choice, risks and expected results require individual specialist assessment.</p><a class="btn" href="/#enquiry">Request coordination through Elajme India</a></div></section><section class="sec"><div class="c"><h2>Specialist assessment comes first</h2><div class="grid"><article class="card"><h3>Cosmetic procedures</h3><p>A qualified specialist can assess the patient's goals, medical history and anatomy before discussing appropriate cosmetic options.</p></article><article class="card"><h3>Reconstructive surgery</h3><p>Reconstructive needs after injury, surgery or other conditions require case-specific clinical review and planning.</p></article><article class="card"><h3>Safety and recovery</h3><p>The treating team determines investigations, anaesthesia considerations, recovery expectations and whether a procedure is appropriate.</p></article></div><div class="note">Elajme India provides coordination and general information. We do not recommend a specific cosmetic procedure, guarantee suitability or promise aesthetic or clinical outcomes.</div></div></section><section class="sec alt"><div class="c"><h2>What to share for an initial review</h2><p class="lead">Useful information may include the main concern or goal, relevant medical and surgical history, current medicines, previous procedure records and any images specifically requested by the treating team. Do not send intimate images unless a verified medical team specifically requires them through an appropriate channel.</p><div class="grid"><article class="card"><h3>1. Share the medical context</h3><p>Send a brief description of the concern and relevant available records to Elajme India.</p></article><article class="card"><h3>2. Coordinate specialist review</h3><p>We can coordinate submission to an appropriate plastic or reconstructive surgery team for preliminary review.</p></article><article class="card"><h3>3. Confirm next steps</h3><p>Consultation availability, investigations, procedure options, timing, recovery and estimates remain subject to the treating provider's review.</p></article></div><div class="related"><a href="../../hospitals/">Explore hospitals</a><a href="../../patient-guide/">Patient guide</a><a href="../../medical-visa/">Medical visa guide</a></div></div></section><section class="cta"><div class="c"><h2>Start a cosmetic-surgery enquiry</h2><p>Share the medical context, available records and your country. Elajme India can coordinate the next enquiry step with an appropriate specialist team.</p><a class="btn" href="/#enquiry">Send your enquiry</a></div></section></main>'''+ef
          ar='''<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جراحة التجميل في الهند للمرضى الدوليين | علاج مي إنديا</title><meta name="description" content="تنسيق استفسارات جراحة التجميل والجراحة الترميمية في الهند للمرضى الدوليين مع مراجعة أولية للحالة عبر علاج مي إنديا."><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="https://elajmeindia.com/ar/treatments/cosmetic-surgery-india/"><link rel="alternate" hreflang="en" href="https://elajmeindia.com/treatments/cosmetic-surgery-india/"><link rel="alternate" hreflang="ar" href="https://elajmeindia.com/ar/treatments/cosmetic-surgery-india/"><link rel="alternate" hreflang="x-default" href="https://elajmeindia.com/treatments/cosmetic-surgery-india/"><link rel="stylesheet" href="../../../assets/css/treatment.css"><link rel="stylesheet" href="../../../assets/css/ar-core.css"><link rel="stylesheet" href="/assets/css/site-shell.css"><link rel="stylesheet" href="/assets/css/footer-approved.css?v=1"></head><body class="site-shell"><header class="head"><div class="c nav"><a class="brand" href="/ar/">علاج مي إنديا</a><a href="/ar/treatments/">العلاجات</a><a href="/ar/doctors/">الأطباء</a><a href="/ar/hospitals/">المستشفيات</a><a href="/ar/patient-guide/">دليل المريض</a><a href="/treatments/cosmetic-surgery-india/">English</a><a class="wa" href="/ar/#enquiry">ابدأ استفسارك</a></div></header><main><section class="hero"><div class="c"><span class="ey">تنسيق جراحة التجميل والترميم</span><h1>جراحة التجميل في الهند للمرضى الدوليين</h1><p class="lead">تساعد علاج مي إنديا المرضى الدوليين في تنسيق الاستفسارات مع فرق مؤهلة في جراحة التجميل والجراحة الترميمية في الهند. ويحتاج تحديد الملاءمة ونوع الإجراء والمخاطر والنتائج المتوقعة إلى تقييم فردي من الطبيب المختص.</p><a class="btn" href="/ar/#enquiry">اطلب التنسيق عبر علاج مي إنديا</a></div></section><section class="sec"><div class="c"><h2>التقييم الطبي المتخصص هو الخطوة الأولى</h2><div class="grid"><article class="card"><h3>الإجراءات التجميلية</h3><p>يقيّم الطبيب المؤهل الهدف والتاريخ الطبي والحالة الفردية قبل مناقشة الخيارات المناسبة.</p></article><article class="card"><h3>الجراحة الترميمية</h3><p>تحتاج الحالات الترميمية بعد إصابة أو جراحة أو حالات أخرى إلى مراجعة وتخطيط طبي خاص بكل حالة.</p></article><article class="card"><h3>السلامة والتعافي</h3><p>يحدد الفريق المعالج الفحوصات ومتطلبات التخدير والتعافي ومدى ملاءمة الإجراء بعد التقييم.</p></article></div><div class="note">تقدم علاج مي إنديا خدمات التنسيق والمعلومات العامة، ولا توصي بإجراء تجميلي محدد ولا تضمن ملاءمة الإجراء أو النتائج التجميلية أو الطبية.</div></div></section><section class="sec alt"><div class="c"><h2>ما الذي يمكن إرساله للمراجعة الأولية؟</h2><p class="lead">قد تفيد مشاركة وصف مختصر للحالة أو الهدف والتاريخ الطبي والجراحي والأدوية الحالية وسجلات الإجراءات السابقة. لا ترسل صوراً خاصة أو حميمة إلا إذا طلبها فريق طبي موثوق عبر قناة مناسبة.</p><div class="grid"><article class="card"><h3>1. إرسال المعلومات الطبية</h3><p>أرسل وصفاً مختصراً للحالة والمستندات الطبية المتوفرة إلى علاج مي إنديا.</p></article><article class="card"><h3>2. تنسيق مراجعة الاختصاصي</h3><p>يمكننا تنسيق إرسال الحالة إلى فريق مناسب في جراحة التجميل أو الترميم للمراجعة الأولية.</p></article><article class="card"><h3>3. تأكيد الخطوات التالية</h3><p>تبقى الاستشارة والفحوصات وخيارات الإجراء والمواعيد والتعافي والتقديرات خاضعة لمراجعة الجهة الطبية المعالجة.</p></article></div><div class="related"><a href="/ar/hospitals/">المستشفيات</a><a href="/ar/patient-guide/">دليل المريض</a><a href="/ar/medical-visa/">دليل التأشيرة الطبية</a></div></div></section><section class="cta"><div class="c"><h2>ابدأ استفسار جراحة التجميل</h2><p>أرسل المعلومات الطبية المتوفرة وبلد الإقامة، ويمكن لعلاج مي إنديا تنسيق الخطوة التالية مع فريق متخصص مناسب.</p><a class="btn" href="/ar/#enquiry">أرسل استفسارك</a></div></section></main>'''+af
          Path('treatments/cosmetic-surgery-india').mkdir(parents=True,exist_ok=True); Path('treatments/cosmetic-surgery-india/index.html').write_text(en,encoding='utf-8')
          Path('ar/treatments/cosmetic-surgery-india').mkdir(parents=True,exist_ok=True); Path('ar/treatments/cosmetic-surgery-india/index.html').write_text(ar,encoding='utf-8')
          p=Path('treatments/index.html'); s=p.read_text(encoding='utf-8'); pre,sep,ft=s.partition('<footer')
          if 'cosmetic-surgery-india/' not in pre:
              anchor='<article class="card"><h3><a href="dental-treatment-india/">Dental Care</a></h3><p>Dental specialist review and treatment-enquiry coordination.</p></article>'
              card='<article class="card"><h3><a href="cosmetic-surgery-india/">Cosmetic &amp; Reconstructive Surgery</a></h3><p>Plastic, cosmetic and reconstructive surgery enquiry coordination.</p></article>'
              pre=pre.replace(anchor,anchor+card,1).replace('Medical Treatment in India: 11 Specialties','Medical Treatment in India: 12 Specialties').replace('Explore 11 medical treatment areas','Explore 12 medical treatment areas')
              marker='{"@type":"ListItem","position":11,"name":"Dental Care","url":"https://elajmeindia.com/treatments/dental-treatment-india/"}'
              pre=pre.replace(marker,marker+',{"@type":"ListItem","position":12,"name":"Cosmetic & Reconstructive Surgery","url":"https://elajmeindia.com/treatments/cosmetic-surgery-india/"}',1)
              p.write_text(pre+sep+ft,encoding='utf-8')
          p=Path('ar/treatments/index.html'); s=p.read_text(encoding='utf-8'); pre,sep,ft=s.partition('<footer')
          if 'cosmetic-surgery-india/' not in pre:
              anchor='<article class="card"><h3>علاج الأسنان</h3><p>تنسيق مراجعة حالات الأسنان والتواصل مع فرق طب الأسنان.</p><a href="dental-treatment-india/">عرض التفاصيل</a></article>'
              card='<article class="card"><h3>جراحة التجميل والترميم</h3><p>تنسيق استفسارات جراحة التجميل والجراحة الترميمية مع الفرق المتخصصة.</p><a href="cosmetic-surgery-india/">عرض التفاصيل</a></article>'
              pre=pre.replace(anchor,anchor+card,1); p.write_text(pre+sep+ft,encoding='utf-8')
          p=Path('sitemap.xml'); s=p.read_text(encoding='utf-8')
          for u in ['https://elajmeindia.com/treatments/cosmetic-surgery-india/','https://elajmeindia.com/ar/treatments/cosmetic-surgery-india/']:
              if u not in s: s=s.replace('</urlset>',f'  <url><loc>{u}</loc></url>\n</urlset>')
          p.write_text(s,encoding='utf-8')
          for p,h in before.items():
              if hashlib.sha256(Path(p).read_bytes()).hexdigest()!=h: raise SystemExit('LOCKED FOOTER FILE CHANGED: '+p)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add treatments/cosmetic-surgery-india/index.html ar/treatments/cosmetic-surgery-india/index.html treatments/index.html ar/treatments/index.html sitemap.xml
          git diff --cached --quiet && exit 0
          git commit -m 'Add bilingual cosmetic surgery treatment coverage'
          git push
