name: Add favicon and Cloudflare readiness safeguards once

on:
  push:
    paths:
      - '.github/workflows/add-favicon-cloudflare-readiness-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Add existing brand emblem as favicon to EN and AR homepages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          protected=['assets/css/footer-approved.css','FOOTER-LOCK.md']
          before={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in protected}
          targets=[Path('index.html'),Path('ar/index.html')]
          href='/Healthcare%20Travel%20Swoosh%20Emblem.webp'
          tag=f'<link rel="icon" type="image/webp" href="{href}">'
          for p in targets:
              text=p.read_text()
              if 'rel="icon"' in text or "rel='icon'" in text or 'shortcut icon' in text.lower():
                  print(f'{p}: favicon already present')
                  continue
              marker='<link rel="canonical"'
              if marker not in text:
                  raise SystemExit(f'{p}: canonical marker missing; refusing unsafe edit')
              text=text.replace(marker, tag+'\n'+marker, 1)
              p.write_text(text)
              print(f'{p}: favicon added using existing Elajme brand emblem')
          after={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in protected}
          if before != after:
              raise SystemExit('Locked footer files changed')
          PY
      - name: Verify favicon references and Cloudflare-safe static structure
        shell: bash
        run: |
          test -f 'Healthcare Travel Swoosh Emblem.webp'
          grep -q 'rel="icon"' index.html
          grep -q 'rel="icon"' ar/index.html
          test -f index.html
          test -f 404.html
          test -f robots.txt
          test -f sitemap.xml
          test -z "$(git status --porcelain -- assets/css/footer-approved.css FOOTER-LOCK.md)"
      - name: Commit changes if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ar/index.html
          git commit -m 'Add Elajme favicon to bilingual homepages'
          git push
