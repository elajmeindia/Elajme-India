name: Audit bilingual directory media and parity once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-directory-media-parity-once.yml'
      - 'doctors/index.html'
      - 'ar/doctors/index.html'
      - 'hospitals/index.html'
      - 'ar/hospitals/index.html'
      - 'assets/images/doctors/**'
      - 'assets/images/hospitals/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit doctor and hospital directory media/parity/performance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          problems=[]; report=[]
          pairs=[('doctors/index.html','ar/doctors/index.html','doctor'),('hospitals/index.html','ar/hospitals/index.html','hospital')]
          for enpath,arpath,kind in pairs:
              en=Path(enpath).read_text(encoding='utf-8'); ar=Path(arpath).read_text(encoding='utf-8')
              en_pre=en.partition('<footer')[0]; ar_pre=ar.partition('<footer')[0]
              for path,text,full,lang in ((enpath,en_pre,en,'en'),(arpath,ar_pre,ar,'ar')):
                  if 'id="q"' not in text: problems.append(f'{path}: missing search input')
                  if 'URLSearchParams' not in full: problems.append(f'{path}: URL query initialization missing')
                  expected='/#enquiry' if lang=='en' else '/ar/#enquiry'
                  if expected not in text: problems.append(f'{path}: Elajme enquiry route missing')
                  if 'footer-approved.css' not in full: problems.append(f'{path}: approved footer CSS missing')
              if kind=='doctor':
                  en_slugs=set(re.findall(r'href="(?:/doctors/)?(dr-[a-z0-9-]+)/?"',en_pre))
                  ar_slugs=set(re.findall(r'href="(?:/ar/doctors/)?(dr-[a-z0-9-]+)/?"',ar_pre))
              else:
                  en_slugs=set(re.findall(r'href="(?:/hospitals/)?([a-z0-9][a-z0-9-]+)/?"',en_pre))
                  ar_slugs=set(re.findall(r'href="(?:/ar/hospitals/)?([a-z0-9][a-z0-9-]+)/?"',ar_pre))
              if en_slugs-ar_slugs: problems.append(f'{kind}: missing AR entries: {sorted(en_slugs-ar_slugs)}')
              if ar_slugs-en_slugs: problems.append(f'{kind}: missing EN entries: {sorted(ar_slugs-en_slugs)}')
              report.append(f'{kind}: EN={len(en_slugs)} AR={len(ar_slugs)}')
          external=[]; placeholders=[]; media_issues=[]
          for path in ('doctors/index.html','ar/doctors/index.html','hospitals/index.html','ar/hospitals/index.html'):
              text=Path(path).read_text(encoding='utf-8').partition('<footer')[0]
              # Performance rules apply to directory card media, not the above-the-fold site logo.
              imgs=[tag for tag in re.findall(r'<img\b[^>]*>',text,re.I) if re.search(r'class="[^"]*(?:photo|directory-photo)[^"]*"',tag,re.I)]
              for tag in imgs:
                  m=re.search(r'\ssrc="([^"]+)"',tag,re.I)
                  if not m: continue
                  src=m.group(1)
                  if src.startswith(('http://','https://')):
                      external.append((path,src))
                  if 'placeholder' in src.lower(): placeholders.append((path,src))
                  if src.startswith('/assets/'):
                      clean=src.split('?',1)[0].lstrip('/')
                      if not Path(clean).exists(): problems.append(f'{path}: missing local image: {src}')
                  if 'loading="lazy"' not in tag: media_issues.append((path,src,'missing loading=lazy'))
                  if 'decoding="async"' not in tag: media_issues.append((path,src,'missing decoding=async'))
                  if src.startswith('/assets/') and not ('width="' in tag and 'height="' in tag):
                      media_issues.append((path,src,'missing width/height'))
          if media_issues: problems.append(f'directory media performance issues: {media_issues}')
          # External images and honest unavailable-portrait artwork are review items,
          # not proof of broken media. The Playwright browser journey tests actual rendering.
          if external: print('EXTERNAL IMAGE REVIEW: live browser rendering required')
          if placeholders: print('PORTRAIT ARTWORK REVIEW: verified photos still needed')
          print('\n'.join(report))
          print(f'EXTERNAL DIRECTORY IMAGES TO VERIFY IN BROWSER={len(external)}')
          print(f'DIRECTORY PLACEHOLDERS={len(placeholders)}')
          print(f'DIRECTORY MEDIA PERFORMANCE ISSUES={len(media_issues)}')
          if problems:
              print('DIRECTORY MEDIA/PARITY/PERFORMANCE ISSUES:'); print('\n'.join(problems)); sys.exit(1)
          print('BILINGUAL DIRECTORY MEDIA/PARITY/PERFORMANCE AUDIT CLEAN')
          PY