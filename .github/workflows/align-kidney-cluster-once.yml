name: Align liver transplant cluster parity once
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/align-kidney-cluster-once.yml'
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align Arabic liver transplant links with English
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ar/treatments/liver-transplant-india/index.html')
          s=p.read_text()
          old='<h2>استكشف الأطباء والمستشفيات</h2><div class="related"><a href="/ar/doctors/">دليل الأطباء</a><a href="/ar/hospitals/">دليل المستشفيات</a><a href="/ar/patient-guide/">دليل المريض</a><a href="/ar/treatments/">جميع العلاجات</a></div>'
          new='<h2>اختصاصيو زراعة الكبد ذوو الصلة</h2><div class="related"><a href="/ar/doctors/dr-arvinder-singh-soin/">د. أرفيندر سينغ سوين</a><a href="/ar/doctors/prof-dr-subhash-gupta/">البروفيسور د. سوبهاش غوبتا</a><a href="/ar/doctors/">دليل الأطباء</a></div><h2>استكشف المستشفيات</h2><div class="related"><a href="/ar/hospitals/medanta-the-medicity-gurugram/">ميدانتا، جوروجرام</a><a href="/ar/hospitals/gleneagles-hospital-parel-mumbai/">مستشفى جلين إيجلز، باريل</a><a href="/ar/hospitals/fortis-hospital-mulund-mumbai/">مستشفى فورتيس، مولوند</a><a href="/ar/hospitals/">دليل المستشفيات</a><a href="/ar/patient-guide/">دليل المريض</a><a href="/ar/treatments/">جميع العلاجات</a></div>'
          if old not in s:
              raise SystemExit('Expected liver related-links block not found')
          before=s.split('<footer',1)[1]
          s=s.replace(old,new,1)
          after=s.split('<footer',1)[1]
          if before != after:
              raise SystemExit('Footer changed')
          p.write_text(s)
          PY
      - name: Commit content update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ar/treatments/liver-transplant-india/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Align liver transplant specialist links'
          git push
