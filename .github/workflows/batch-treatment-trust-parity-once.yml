name: Align Arabic international hub with GCC and Africa coverage once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/batch-treatment-trust-parity-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Arabic international patient market framing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('ar/international-patients/mea/index.html')
          text=p.read_text(); i=text.lower().find('<footer'); assert i>=0
          pre,footer=text[:i],text[i:]
          before={q:hashlib.sha256(Path(q).read_bytes()).hexdigest() for q in ['FOOTER-LOCK.md','assets/css/footer-approved.css']}
          replacements={
            'العلاج في الهند لمرضى الخليج والمرضى الدوليين | علاج مي إنديا':'العلاج في الهند لمرضى الخليج وأفريقيا والمرضى الدوليين | علاج مي إنديا',
            'تنسيق العلاج في الهند للمرضى من السعودية والإمارات وعُمان وقطر والكويت والبحرين ودول أخرى، مع دعم التواصل بالعربية والإنجليزية عبر علاج مي إنديا.':'تنسيق العلاج في الهند للمرضى من السعودية والإمارات وعُمان وقطر والكويت والبحرين ونيجيريا ودول أخرى، مع دعم التواصل بالعربية والإنجليزية عبر علاج مي إنديا.',
            'العلاج في الهند لمرضى الخليج والمرضى الدوليين':'العلاج في الهند لمرضى الخليج وأفريقيا والمرضى الدوليين',
            'هل تخطط للعلاج في الهند من إحدى دول الخليج أو من خارج الهند؟':'هل تخطط للعلاج في الهند من الخليج أو أفريقيا أو من خارج الهند؟',
            'نستقبل استفسارات المرضى من السعودية والإمارات وعُمان وقطر والكويت والبحرين ودول أخرى. قبول الحالة والتوصيات العلاجية يخضعان لمراجعة الجهة الطبية.':'نستقبل استفسارات المرضى من السعودية والإمارات وعُمان وقطر والكويت والبحرين ونيجيريا ودول وأسواق دولية أخرى. قبول الحالة والتوصيات العلاجية يخضعان لمراجعة الجهة الطبية.',
            'دعم المرضى من دول الخليج':'مسارات المرضى من الخليج وأفريقيا',
            'يساعد التواصل باللغة العربية في فهم خطوات التنسيق والتقارير والردود والترتيبات العملية. وتبقى القرارات الطبية مسؤولية المستشفى والفريق الطبي المؤهل بشكل مستقل عن دور علاج مي إنديا في التنسيق.':'تدعم علاج مي إنديا المرضى الدوليين عبر اللغات والحدود. يتوفر التنسيق بالعربية والإنجليزية لمرضى الخليج، ويمكن للمرضى من نيجيريا والأسواق الأخرى استخدام مسار مراجعة الحالة وتنسيق رحلة العلاج نفسه. وتبقى القرارات الطبية مسؤولية المستشفى والفريق الطبي المؤهل.'
          }
          for old,new in replacements.items():
            assert old in pre, f'Missing expected text: {old}'
            pre=pre.replace(old,new,1)
          updated=pre+footer
          if updated!=text: p.write_text(updated)
          after={q:hashlib.sha256(Path(q).read_bytes()).hexdigest() for q in before}
          assert before==after, 'Locked footer assets changed'
          out=p.read_text()
          assert 'مسارات المرضى من الخليج وأفريقيا' in out
          assert '/ar/nigeria/treatment-in-india/' in out
          print('Arabic international hub aligned; footer locks unchanged')
          PY
      - name: Commit Arabic hub alignment
        run: |
          if git diff --quiet -- ar/international-patients/mea/index.html; then exit 0; fi
          git config user.name elajmeindia
          git config user.email shahzadalamnadwi@gmail.com
          git add ar/international-patients/mea/index.html
          git commit -m 'Align Arabic international hub with GCC and Africa coverage'
          git push
