name: Expand fertility and IVF treatment coverage once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/expand-fertility-ivf-coverage-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Create bilingual IVF pages and connect discovery
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          locked=['assets/css/footer-approved.css','FOOTER-LOCK.md']
          before={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in locked}
          def footer_of(path):
              t=Path(path).read_text(encoding='utf-8'); i=t.find('<footer');
              if i<0: raise SystemExit('footer missing '+path)
              return t[i:]
          en_footer=footer_of('treatments/heart-treatment-india/index.html')
          ar_footer=footer_of('ar/treatments/heart-treatment-india/index.html')
          en='''<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IVF & Fertility Treatment in India | International Patients | Elajme India</title><meta name="description" content="IVF and fertility treatment coordination in India for international patients, including preliminary record review and consultation requests through Elajme India."><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="https://elajmeindia.com/treatments/fertility-ivf-treatment-india/"><link rel="alternate" hreflang="en" href="https://elajmeindia.com/treatments/fertility-ivf-treatment-india/"><link rel="alternate" hreflang="ar" href="https://elajmeindia.com/ar/treatments/fertility-ivf-treatment-india/"><link rel="alternate" hreflang="x-default" href="https://elajmeindia.com/treatments/fertility-ivf-treatment-india/"><link rel="stylesheet" href="../../assets/css/treatment.css"><link rel="stylesheet" href="/assets/css/footer-approved.css?v=1"></head><body><header class="head"><div class="c nav"><a class="brand" href="../../">Elajme India</a><a href="../">Treatments</a><a href="../../doctors/">Doctors</a><a href="../../hospitals/">Hospitals</a><a href="../../patient-guide/">Patient Guide</a><a href="../../ar/treatments/fertility-ivf-treatment-india/" lang="ar" dir="rtl">العربية</a><a class="wa" href="/#enquiry">Start Your Enquiry</a></div></header><main><section class="hero"><div class="c"><span class="ey">Fertility care coordination</span><h1>IVF and fertility treatment in India for international patients</h1><p class="lead">Elajme India helps international patients coordinate fertility-care enquiries with hospitals and qualified specialist teams in India. The appropriate evaluation and treatment pathway depends on the individual patient or couple and is determined by the treating team.</p><a class="btn" href="/#enquiry">Request coordination through Elajme India</a></div></section><section class="sec"><div class="c"><h2>Fertility care is individual</h2><div class="grid"><article class="card"><h3>Specialist consultation</h3><p>A fertility specialist may review medical history, previous treatment and available investigations before advising next steps.</p></article><article class="card"><h3>IVF and assisted reproduction</h3><p>Suitability for IVF or another assisted-reproduction approach can only be determined after appropriate specialist assessment.</p></article><article class="card"><h3>Further investigations</h3><p>The treating team may request additional tests before confirming a treatment plan, timeline or estimate.</p></article></div><div class="note">Elajme India provides coordination and general information. We do not diagnose infertility, prescribe treatment, promise pregnancy or guarantee treatment outcomes.</div></div></section><section class="sec alt"><div class="c"><h2>What to share for an initial review</h2><p class="lead">Depending on the case, useful records may include a medical summary, previous fertility-treatment records, relevant laboratory reports, imaging or procedure reports and details of current medicines. The specialist team decides what information or testing is required.</p><div class="grid"><article class="card"><h3>1. Send available records</h3><p>Share the main concern and relevant available medical documents with Elajme India.</p></article><article class="card"><h3>2. Coordinate specialist review</h3><p>We can coordinate submission to an appropriate hospital or fertility team for preliminary review.</p></article><article class="card"><h3>3. Confirm next steps</h3><p>Consultation availability, investigations, treatment options, timing and estimates remain subject to the treating provider's review.</p></article></div><div class="related"><a href="../../hospitals/">Explore hospitals</a><a href="../../patient-guide/">Patient guide</a><a href="../../medical-visa/">Medical visa guide</a></div></div></section><section class="cta"><div class="c"><h2>Start a fertility-care enquiry</h2><p>Share the available medical information and your country. Elajme India can coordinate the next enquiry step with an appropriate specialist team.</p><a class="btn" href="/#enquiry">Send your enquiry</a></div></section></main>'''+en_footer
          ar='''<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>علاج العقم وأطفال الأنابيب في الهند للمرضى الدوليين | علاج مي إنديا</title><meta name="description" content="تنسيق استفسارات علاج العقم وأطفال الأنابيب في الهند للمرضى الدوليين، مع مراجعة أولية للتقارير وطلبات الاستشارة عبر علاج مي إنديا."><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="https://elajmeindia.com/ar/treatments/fertility-ivf-treatment-india/"><link rel="alternate" hreflang="en" href="https://elajmeindia.com/treatments/fertility-ivf-treatment-india/"><link rel="alternate" hreflang="ar" href="https://elajmeindia.com/ar/treatments/fertility-ivf-treatment-india/"><link rel="alternate" hreflang="x-default" href="https://elajmeindia.com/treatments/fertility-ivf-treatment-india/"><link rel="stylesheet" href="../../../assets/css/treatment.css"><link rel="stylesheet" href="../../../assets/css/ar-core.css"><link rel="stylesheet" href="/assets/css/site-shell.css"><link rel="stylesheet" href="/assets/css/footer-approved.css?v=1"></head><body class="site-shell"><header class="head"><div class="c nav"><a class="brand" href="/ar/">علاج مي إنديا</a><a href="/ar/treatments/">العلاجات</a><a href="/ar/doctors/">الأطباء</a><a href="/ar/hospitals/">المستشفيات</a><a href="/ar/patient-guide/">دليل المريض</a><a href="/treatments/fertility-ivf-treatment-india/">English</a><a class="wa" href="/ar/#enquiry">ابدأ استفسارك</a></div></header><main><section class="hero"><div class="c"><span class="ey">تنسيق رعاية الخصوبة</span><h1>علاج العقم وأطفال الأنابيب في الهند للمرضى الدوليين</h1><p class="lead">تساعد علاج مي إنديا المرضى الدوليين في تنسيق استفسارات الخصوبة مع المستشفيات والفرق الطبية المؤهلة في الهند. ويحدد الفريق المعالج التقييم والمسار العلاجي المناسب لكل حالة بصورة فردية.</p><a class="btn" href="/ar/#enquiry">اطلب التنسيق عبر علاج مي إنديا</a></div></section><section class="sec"><div class="c"><h2>رعاية الخصوبة تختلف من حالة إلى أخرى</h2><div class="grid"><article class="card"><h3>استشارة الاختصاصي</h3><p>قد يراجع اختصاصي الخصوبة التاريخ الطبي والعلاجات السابقة والفحوصات المتوفرة قبل تحديد الخطوة التالية.</p></article><article class="card"><h3>أطفال الأنابيب وتقنيات الإخصاب المساعد</h3><p>يحدد الطبيب مدى ملاءمة أطفال الأنابيب أو أي خيار آخر بعد التقييم الطبي المناسب.</p></article><article class="card"><h3>فحوصات إضافية</h3><p>قد يطلب الفريق المعالج فحوصات إضافية قبل تأكيد الخطة والمدة والتكلفة التقديرية.</p></article></div><div class="note">تقدم علاج مي إنديا خدمات التنسيق والمعلومات العامة، ولا تشخص العقم ولا تصف العلاج ولا تعد بحدوث الحمل أو تضمن نتائج العلاج.</div></div></section><section class="sec alt"><div class="c"><h2>ما الذي يمكن إرساله للمراجعة الأولية؟</h2><p class="lead">بحسب الحالة، قد تفيد مشاركة الملخص الطبي وسجلات علاجات الخصوبة السابقة والتقارير المخبرية والصور أو تقارير الإجراءات والأدوية الحالية. ويحدد الفريق الطبي المعلومات والفحوصات المطلوبة.</p><div class="grid"><article class="card"><h3>1. إرسال التقارير المتوفرة</h3><p>أرسل المشكلة الرئيسية والمستندات الطبية المتوفرة إلى علاج مي إنديا.</p></article><article class="card"><h3>2. تنسيق مراجعة الاختصاصي</h3><p>يمكننا تنسيق إرسال الحالة إلى مستشفى أو فريق خصوبة مناسب للمراجعة الأولية.</p></article><article class="card"><h3>3. تأكيد الخطوات التالية</h3><p>تبقى الاستشارة والفحوصات وخيارات العلاج والمواعيد والتقديرات خاضعة لمراجعة الجهة الطبية المعالجة.</p></article></div><div class="related"><a href="/ar/hospitals/">المستشفيات</a><a href="/ar/patient-guide/">دليل المريض</a><a href="/ar/medical-visa/">دليل التأشيرة الطبية</a></div></div></section><section class="cta"><div class="c"><h2>ابدأ استفسار رعاية الخصوبة</h2><p>أرسل المعلومات الطبية المتوفرة وبلد الإقامة، ويمكن لعلاج مي إنديا تنسيق الخطوة التالية مع فريق متخصص مناسب.</p><a class="btn" href="/ar/#enquiry">أرسل استفسارك</a></div></section></main>'''+ar_footer
          Path('treatments/fertility-ivf-treatment-india').mkdir(parents=True,exist_ok=True); Path('treatments/fertility-ivf-treatment-india/index.html').write_text(en,encoding='utf-8')
          Path('ar/treatments/fertility-ivf-treatment-india').mkdir(parents=True,exist_ok=True); Path('ar/treatments/fertility-ivf-treatment-india/index.html').write_text(ar,encoding='utf-8')
          # Add directory cards before grid closes by anchoring after spine card.
          p=Path('treatments/index.html'); s=p.read_text(encoding='utf-8'); pre,sep,foot=s.partition('<footer')
          if 'fertility-ivf-treatment-india/' not in pre:
              anchor='<article class="card"><h3><a href="spine-surgery-india/">Spine Surgery</a></h3><p>Spine-related specialist review and treatment coordination.</p></article>'
              pre=pre.replace(anchor,anchor+'<article class="card"><h3><a href="fertility-ivf-treatment-india/">IVF &amp; Fertility Care</a></h3><p>Fertility specialist and assisted-reproduction enquiry coordination.</p></article>',1)
              pre=pre.replace('Medical Treatment in India: 9 Specialties','Medical Treatment in India: 10 Specialties').replace('Explore 9 medical treatment areas','Explore 10 medical treatment areas')
              p.write_text(pre+sep+foot,encoding='utf-8')
          p=Path('ar/treatments/index.html'); s=p.read_text(encoding='utf-8'); pre,sep,foot=s.partition('<footer')
          if 'fertility-ivf-treatment-india/' not in pre:
              anchor='<article class="card"><h3>جراحة العمود الفقري</h3><p>تنسيق مراجعة حالات العمود الفقري مع الفرق المتخصصة.</p><a href="spine-surgery-india/">عرض التفاصيل</a></article>'
              pre=pre.replace(anchor,anchor+'<article class="card"><h3>علاج العقم وأطفال الأنابيب</h3><p>تنسيق استفسارات الخصوبة وتقنيات الإخصاب المساعد.</p><a href="fertility-ivf-treatment-india/">عرض التفاصيل</a></article>',1)
              p.write_text(pre+sep+foot,encoding='utf-8')
          p=Path('sitemap.xml'); s=p.read_text(encoding='utf-8')
          urls=['https://elajmeindia.com/treatments/fertility-ivf-treatment-india/','https://elajmeindia.com/ar/treatments/fertility-ivf-treatment-india/']
          for u in urls:
              if u not in s: s=s.replace('</urlset>',f'  <url><loc>{u}</loc></url>\n</urlset>')
          p.write_text(s,encoding='utf-8')
          for p,h in before.items():
              if hashlib.sha256(Path(p).read_bytes()).hexdigest()!=h: raise SystemExit('locked file changed '+p)
          PY
      - name: Commit expansion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add treatments/fertility-ivf-treatment-india/index.html ar/treatments/fertility-ivf-treatment-india/index.html treatments/index.html ar/treatments/index.html sitemap.xml
          git commit -m 'Add bilingual IVF and fertility treatment coverage'
          git push