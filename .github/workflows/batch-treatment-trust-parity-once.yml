name: Strengthen international patient treatment pathways once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/batch-treatment-trust-parity-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add direct treatment pathways to international patient hubs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib
          targets={
          'international-patients/mea/index.html':(
          'Explore treatment options and patient resources',
          '<section class="sec"><div class="c"><h2>Explore treatment options and patient resources</h2><div class="related"><a href="../../treatments/cancer-treatment-india/">Cancer treatment</a><a href="../../treatments/heart-treatment-india/">Heart treatment</a><a href="../../treatments/knee-replacement-india/">Knee replacement</a><a href="../../treatments/neurosurgery-india/">Neurosurgery</a><a href="../../treatments/urology-treatment-india/">Urology</a><a href="../../treatments/gastroenterology-treatment-india/">Gastroenterology</a><a href="../../treatments/kidney-transplant-india/">Kidney transplant</a><a href="../../treatments/liver-transplant-india/">Liver transplant</a><a href="../../treatments/spine-surgery-india/">Spine surgery</a><a href="../../treatments/">All treatment areas</a><a href="../../hospitals/">Hospital directory</a><a href="../../doctors/">Doctor directory</a><a href="../../patient-guide/">International patient guide</a><a href="../../medical-visa/">Medical visa guidance</a></div></div></section>'),
          'ar/international-patients/mea/index.html':(
          'استكشف العلاجات وموارد المريض',
          '<section class="sec"><div class="c"><h2>استكشف العلاجات وموارد المريض</h2><div class="related"><a href="/ar/treatments/cancer-treatment-india/">علاج السرطان</a><a href="/ar/treatments/heart-treatment-india/">علاج القلب</a><a href="/ar/treatments/knee-replacement-india/">استبدال مفصل الركبة</a><a href="/ar/treatments/neurosurgery-india/">جراحة الأعصاب</a><a href="/ar/treatments/urology-treatment-india/">المسالك البولية</a><a href="/ar/treatments/gastroenterology-treatment-india/">أمراض الجهاز الهضمي</a><a href="/ar/treatments/kidney-transplant-india/">زراعة الكلى</a><a href="/ar/treatments/liver-transplant-india/">زراعة الكبد</a><a href="/ar/treatments/spine-surgery-india/">جراحة العمود الفقري</a><a href="/ar/treatments/">جميع مجالات العلاج</a><a href="/ar/hospitals/">دليل المستشفيات</a><a href="/ar/doctors/">دليل الأطباء</a><a href="/ar/patient-guide/">دليل المريض الدولي</a><a href="/ar/medical-visa/">إرشادات التأشيرة الطبية</a></div></div></section>')}
          changed=[]
          for fn,(heading,new) in targets.items():
              p=Path(fn); text=p.read_text(); fi=text.lower().find('<footer'); assert fi>=0
              pre,foot=text[:fi],text[fi:]
              if new in pre: continue
              pattern=r'<section class="sec"><div class="c"><h2>'+re.escape(heading)+r'</h2>.*?</section>'
              pre2,n=re.subn(pattern,new,pre,count=1,flags=re.S)
              assert n==1, f'target section not found in {fn}'
              p.write_text(pre2+foot); changed.append(fn)
          print('Changed:',changed)
          for p in [Path('FOOTER-LOCK.md'),Path('assets/css/footer-approved.css')]: print('LOCK',p,hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Commit hub internal-link improvements
        run: |
          if git diff --quiet -- international-patients/mea/index.html ar/international-patients/mea/index.html; then echo 'No changes required'; exit 0; fi
          git config user.name 'elajmeindia'
          git config user.email 'shahzadalamnadwi@gmail.com'
          git add international-patients/mea/index.html ar/international-patients/mea/index.html
          git commit -m 'Strengthen international patient treatment pathways'
          git push
