name: Align knee replacement cluster parity once
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/align-kidney-cluster-once.yml'
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align Arabic knee replacement links with English
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ar/treatments/knee-replacement-india/index.html')
          s=p.read_text()
          old='<h2>استكشف الأطباء والمستشفيات</h2><div class="related"><a href="/ar/doctors/">دليل الأطباء</a><a href="/ar/hospitals/">دليل المستشفيات</a><a href="/ar/patient-guide/">دليل المريض</a></div>'
          new='<h2>أطباء العظام ذوو الصلة</h2><div class="related"><a href="/ar/doctors/dr-ashok-rajgopal/">د. أشوك راجغوبال</a><a href="/ar/doctors/dr-kaushal-malhan/">د. كوشال مالهان</a><a href="/ar/doctors/dr-ramneek-mahajan/">د. رامنيك مهاجان</a></div><h2>استكشف المستشفيات</h2><div class="related"><a href="/ar/hospitals/medanta-the-medicity-gurugram/">ميدانتا، جوروجرام</a><a href="/ar/hospitals/fortis-hospital-mulund-mumbai/">فورتيس، مولوند</a><a href="/ar/hospitals/max-super-speciality-hospital-saket/">ماكس ساكيت</a><a href="/ar/hospitals/artemis-hospital-gurugram/">أرتيمس، جوروجرام</a><a href="/ar/doctors/">دليل الأطباء</a><a href="/ar/hospitals/">دليل المستشفيات</a><a href="/ar/patient-guide/">دليل المريض</a></div>'
          if old not in s:
              raise SystemExit('Expected knee related-links block not found')
          before=s.split('<footer',1)[1]
          s=s.replace(old,new,1)
          after=s.split('<footer',1)[1]
          if before != after:
              raise SystemExit('Footer changed')
          p.write_text(s)
          PY
      - name: Commit content update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ar/treatments/knee-replacement-india/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Align knee replacement specialist links'
          git push
